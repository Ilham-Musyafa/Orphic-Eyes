<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orphic Eyes — Report</title>
<style>
:root{color-scheme:light;--bg:#f6f6f4;--panel:#ffffff;--surface:#f1f1ef;--soft:#fafaf8;--line:#e6e5e1;--line2:#d9d9d5;--ink:#202023;--muted:#797b80;--faint:#a6a7ab;--bronze:#c58b3e;--bronze-ink:#99671f;--blue:#2f80ff;--blue-bg:#f5f9ff;--blue-line:#c9ddfa;--guide:#e5359b;--green:#188951;--green-bg:#e7f6ed;--amber:#b45309;--amber-bg:#fdf3e2;--amber-line:#f0d9b5;--red:#c63d42;--red-bg:#feeeee;--r:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-synthesis:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;min-height:0;background:var(--bg)}

/* top bar */
.topbar{flex:0 0 54px;height:54px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.logo-wrap{width:34px;height:35px;flex:none;background:#1B1B19;border-radius:8px;padding:4px;display:flex;align-items:center;justify-content:center}
.logo-wrap svg{display:block;width:100%;height:100%}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.tagline{font-size:11px;color:var(--muted);white-space:nowrap}
.topbar-center{display:flex;align-items:center;gap:12px;flex:1;justify-content:center;min-width:0}
.topbar-right{display:flex;align-items:center;gap:8px;flex:none}

/* segmented controls */
.seg{display:inline-flex;align-items:center;padding:3px;gap:2px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.seg button{position:relative;border:0;background:transparent;min-height:28px;padding:4px 15px;border-radius:6px;white-space:nowrap;color:#686a6f;font-size:12px}
.seg button:hover:not(.on){background:#e7e7e4}
.seg button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.seg button.on::after{content:"";position:absolute;left:9px;right:9px;bottom:-4px;height:2px;border-radius:2px;background:var(--ink);opacity:.5}
#modeSwitch button.on::after{background:var(--bronze);opacity:1}

.btn{border:1px solid var(--line2);background:var(--panel);padding:6px 11px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;min-height:30px;white-space:nowrap;font-size:12px}
.btn:hover:not(:disabled){background:#f6f5f2;border-color:#c8c7c2}
.btn.ghost{border-color:transparent;background:transparent;color:#5b5c62}
.btn.ghost:hover:not(:disabled){background:#f1f0ed}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:#fff;font-weight:650;padding:7px 14px}
.btn.primary:hover:not(:disabled){background:#b87927;border-color:#b87927}
.history{display:flex;align-items:center;gap:3px;border-left:1px solid var(--line);padding-left:11px}

/* subbar */
.subbar{flex:0 0 52px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:var(--soft);border-bottom:1px solid var(--line);min-width:0}
.subbar-left,.subbar-right{display:flex;align-items:center;gap:10px;min-width:0}
.status-chip{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:5px 9px;background:#f0f2ef;color:#49594f;font-size:12px;white-space:nowrap}
.status-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#8b9a90}
.status-chip.pass{background:var(--green-bg);color:var(--green)}
.status-chip.pass::before{background:var(--green)}
.status-chip.check{background:var(--amber-bg);color:var(--amber)}
.status-chip.check::before{background:#d99a2b}
.status-chip.fail{background:var(--red-bg);color:var(--red)}
.status-chip.fail::before{background:var(--red)}
.note{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.set-value{display:inline-flex;align-items:center;min-height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font-size:12px}
.ctl select{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:8px;padding:6px 9px;min-height:30px;font-size:12px;max-width:190px}

/* layout */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:clamp(208px,19.5vw,258px) minmax(0,1fr) clamp(248px,22.5vw,300px);overflow:hidden;background:var(--bg)}
.leftpanel,.inspector{min-width:0;min-height:0;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.leftpanel{border-right:1px solid var(--line)}
.lists-region{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.lists-region .panel-section{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.lists-region .section-content{flex:1 1 auto;min-height:0;overflow:auto}
.inspector{border-left:1px solid var(--line)}
.panel-section{border-bottom:1px solid var(--line);min-height:0;flex:none;display:flex;flex-direction:column}
.section-head{width:100%;border:0;background:var(--panel);padding:10px 12px;font-weight:650;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:12px;color:var(--ink)}
.section-content{padding:0 9px 9px;min-height:0}
.count-pill{font-size:10px;font-weight:650;color:#555;background:var(--surface);border-radius:6px;padding:2px 6px;min-width:20px;text-align:center}

/* pages */
.page-item{display:flex;align-items:center;gap:9px;padding:6px 7px;border:1px solid transparent;border-radius:8px;min-height:37px;cursor:pointer;width:100%;background:transparent;text-align:left}
.page-item:hover{background:#f6f6f4}
.page-item.active{background:#f4f4f1;border-color:var(--line2)}
.page-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#b5b7bb;flex:none}
.dot.pass{background:var(--green)}
.dot.check{background:#d99a2b}
.dot.fail{background:var(--red)}

/* area map */
.zone-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.zone-cell{border:1px solid var(--line);border-radius:5px;background:#fbfbfa;min-height:38px;display:flex;align-items:center;justify-content:center;padding:3px 2px;font-size:9px;line-height:1.15;color:#7a7e82;text-align:center;cursor:pointer;position:relative}
.zone-cell:hover{border-color:#a4b8cf}
.zone-cell.hit{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.zone-cell.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#f1f6ff;color:#2665b9}

/* lists */
.list-item{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:9px;padding:7px 8px;cursor:pointer;background:#fff;margin-bottom:6px;text-align:left;width:100%}
.list-item:hover{background:#fcfbf8}
.list-item.selected{background:var(--blue-bg);border-color:var(--blue-line)}
.list-item.zone-hit{box-shadow:inset 2px 0 0 var(--blue)}
.list-item.flash{animation:flash .7s ease-out 1}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px rgba(47,128,255,.55)}100%{box-shadow:inset 0 0 0 2px rgba(47,128,255,0)}}
.line1{display:flex;gap:6px;align-items:center;font-size:12px;min-width:0}
.id-pill{flex:none;min-width:26px;min-height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:650;color:#555;background:var(--surface);border-radius:6px;padding:0 4px}
.list-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.list-sub{font-size:11px;color:var(--muted);line-height:1.35;padding-left:32px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;border-radius:5px;padding:2px 6px;font-size:10px;font-weight:650;white-space:nowrap;flex:none}
.chip.approved,.chip.done{background:var(--green-bg);color:var(--green)}
.chip.expected{background:#edf4ff;color:#2467c2}
.chip.unexpected,.chip.check{background:var(--amber-bg);color:var(--amber)}
.chip.not_done,.chip.fail{background:var(--red-bg);color:var(--red)}
.chip.unknown,.chip.draft{background:#eeeef0;color:#74777e}
.chip.skipped{background:#f8f8f7;color:#a0a2a7;box-shadow:inset 0 0 0 1px #ececea}
.chip.count{background:var(--surface);color:#555}
.guide{display:flex;flex-direction:column;gap:8px;padding:14px 6px;color:var(--muted);text-align:center;font-size:11px}
.guide strong{font-size:12px;color:var(--ink);font-weight:650}
.guide ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;text-align:left}
.guide li{display:flex;gap:7px;align-items:baseline}
.guide li b{color:var(--ink);font-size:10px;background:var(--surface);border-radius:5px;padding:1px 5px;flex:none}

/* center */
.centerpanel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);position:relative;overflow:hidden}
.review-bar{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--soft);min-width:0}
.review-bar .seg button{padding:4px 11px;font-size:11px}
.review-bar .note{font-size:11px;min-width:0}
.stage-scroller{flex:1;min-height:0;min-width:0;overflow:auto;display:flex;padding:8px;background:var(--surface)}
.stage-inner{flex:none;margin:auto;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.pair{display:flex;align-items:stretch;justify-content:center;gap:8px}
.pair.fitted{width:100%;height:100%;align-items:center}
.half{position:relative;background:#fff;border:1px solid var(--line2);border-radius:8px;overflow:hidden;box-shadow:0 1px 6px rgba(37,39,45,.05);display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.pair.fitted .half{flex:1 1 0;height:auto;min-width:0}
.pair.zoomed .half{flex:none}
.frame{position:relative;overflow:hidden;background:#fff;flex:none;align-self:center;justify-self:center}
.frame img{display:block;width:100%;height:100%;object-fit:fill}
.marks{position:absolute;inset:0;z-index:3;pointer-events:none}
.mark-box{position:absolute;border:2px solid var(--amber);background:transparent;padding:0;border-radius:2px;pointer-events:auto;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.7)}
.mark-box.expected,.mark-box.approved{border-color:var(--green)}
.mark-box.unexpected{border-color:var(--amber)}
.mark-box:hover{box-shadow:0 0 0 1px rgba(255,255,255,.7),0 0 0 2px rgba(47,128,255,.22)}
.mark-box.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,128,255,.28)}
.mark-box.ref{border-style:dashed;border-width:2px}
.mark-box:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.tag{position:absolute;top:6px;left:6px;z-index:4;background:#ffffffdd;border:1px solid #ececec;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:650;color:#4a4b50}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px dashed var(--line2);border-radius:10px;color:var(--muted);font-size:11px;text-align:center;padding:26px;min-width:260px;min-height:150px}
.placeholder strong{font-size:13px;color:var(--ink);font-weight:650}
.img-missing{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#f3f3f1 8px,#f3f3f1 16px);color:var(--faint);font-size:10px;text-align:center;padding:2px}

/* inspector */
.inspector-header{padding:13px 13px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.inspector-header h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary-card{flex:none;display:flex;align-items:center;gap:8px;padding:10px 11px;margin:11px 11px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:650;min-height:42px}
.summary-card.pass{color:var(--green);border-color:#cde9d9;background:var(--green-bg)}
.summary-card.check{color:var(--amber);border-color:#eddfc2;background:var(--amber-bg)}
.summary-card.fail{color:var(--red);border-color:#f3d3d4;background:var(--red-bg)}
.summary-card .mark{font-size:14px;font-weight:700;flex:none;width:16px;text-align:center;line-height:1}
.report-note{margin:6px 11px 0;font-size:11px;color:var(--muted);line-height:1.35;overflow-wrap:anywhere}
.inspector-body{flex:1;min-height:0;overflow:auto;padding:11px}
.block{margin:0 0 14px}
.caption{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#8b8d92;margin:0 0 7px}
.detail{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;font-size:12px;border-bottom:1px solid var(--line);background:#fff}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted);font-size:11px;flex:none}
.row strong{font-weight:650;text-align:right;overflow-wrap:anywhere}
.empty-note{color:var(--muted);font-size:11px;line-height:1.45;margin:0 0 10px}
.crop-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.crop{margin:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fbfbfa;min-width:0}
.crop-tag{display:block;font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#8b8d92;padding:4px 6px 2px}
.crop-img{height:56px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.crop-img img{display:block;max-width:100%;max-height:100%}

/* statusbar */
.statusbar{flex:0 0 27px;height:27px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border-top:1px solid var(--line);background:var(--soft);color:#73767b;font-size:11px;white-space:nowrap;min-width:0}
.statusbar>div{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sep{width:1px;height:12px;background:var(--line2);flex:none}

/* popover + toast */
.pop{position:fixed;z-index:40;width:252px;padding:11px;border-radius:11px;border:1px solid var(--line2);background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:12px}
.pop strong{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.pop p{margin:0 0 9px;color:#62646a;line-height:1.4;font-size:11px}
.pop .crop-pair{margin:0 0 9px}
.pop .crop-img{height:44px}
.pop-actions{display:flex;gap:6px}
.pop-actions .btn{flex:1;justify-content:center;font-size:11px;min-height:28px;padding:4px 8px}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:50;background:#262626;color:#fff;border-radius:9px;padding:9px 16px;box-shadow:0 5px 25px rgba(0,0,0,.2);font-weight:600;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s ease}
.toast.show{opacity:1}

/* move mode: toolbar, rulers, frame */
.move-toolbar{flex:0 0 44px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border-top:1px solid var(--line);background:var(--panel);min-width:0;overflow:hidden}
.tool-group,.opt-group{display:flex;align-items:center;gap:2px;min-width:0}
.move-toolbar button{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:transparent;border-radius:7px;padding:5px 7px;font-size:11px;color:#5e6066;min-height:30px;white-space:nowrap;flex:none}
.move-toolbar button:hover:not(:disabled):not(.is-disabled){background:#f1f0ed}
.move-toolbar button.on{background:#eff4fc;color:#1768bb;font-weight:650}
.move-toolbar button .key{font-size:9px;color:#a3a5aa;font-weight:600;border:1px solid #e3e2de;border-radius:4px;padding:0 3px;line-height:1.35}
.move-toolbar button.on .key{color:#7ba7dd;border-color:#cddff5}
.move-toolbar button:disabled{color:#a9abb0;opacity:.65;cursor:not-allowed}
.move-toolbar .later{display:inline-flex;flex:none}
.move-toolbar svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tool-sep{width:1px;height:18px;background:var(--line2);margin:0 4px;flex:none}
.move-hint{flex:0 0 26px;display:flex;align-items:center;padding:0 12px;border-top:1px solid var(--line);background:var(--soft);color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame-system{display:grid;grid-template-columns:23px auto;grid-template-rows:23px auto;flex:none;margin:auto;filter:drop-shadow(0 3px 10px rgba(0,0,0,.06))}
.ruler-corner{grid-area:1/1;background:#f4f4f2;border-right:1px solid #d5d5d1;border-bottom:1px solid #d5d5d1}
.ruler-top{grid-area:1/2;height:23px;overflow:hidden;border-bottom:1px solid #d5d5d1;background:#f4f4f2}
.ruler-left{grid-area:2/1;width:23px;overflow:hidden;border-right:1px solid #d5d5d1;background:#f4f4f2}
.ruler-top svg,.ruler-left svg{display:block}
.move-frame{grid-area:2/2;position:relative;overflow:hidden;background:#fff;box-shadow:0 0 0 1px #ddddda;touch-action:none;user-select:none}
.move-frame img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.move-frame.cursor-cross{cursor:crosshair}
.move-frame.cursor-grab{cursor:grab}
.move-frame.cursor-grabbing{cursor:grabbing}
.move-overlay{position:absolute;inset:0;pointer-events:none;z-index:3}
.move-grid{position:absolute;inset:0;z-index:1}
.move-sel{position:absolute;z-index:2;border:2px dashed var(--blue);background:rgba(47,128,255,.07);box-sizing:border-box}
.move-ghost{position:absolute;z-index:3;border:2px solid var(--blue);background:rgba(47,128,255,.14);box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding:2px;overflow:hidden}
.move-ghost span{font-size:10px;font-weight:650;color:#1c5cb8;background:#ffffffdd;border-radius:4px;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Guides are real 2px boxes with a painted background, so they have a non-zero
   height/width at every zoom level and their centre stays hit-testable.
   Border-only 1px boxes had zero size and never painted. */
.move-guide{position:absolute;z-index:5;pointer-events:auto}
.move-guide.v{width:2px;margin-left:-1px;background-image:repeating-linear-gradient(to bottom,var(--guide) 0 5px,transparent 5px 9px)}
.move-guide.h{height:2px;margin-top:-1px;background-image:repeating-linear-gradient(to right,var(--guide) 0 5px,transparent 5px 9px)}
.move-guide.dim{opacity:.45}
.move-measure{position:absolute;z-index:6;pointer-events:auto;background:var(--guide);border-radius:2px}
.move-measure.h{height:2px}
.move-measure.v{width:2px}
.move-tag{position:absolute;z-index:8;pointer-events:auto;font-size:10px;font-weight:650;line-height:1.5;color:#fff;background:var(--guide);border-radius:4px;padding:1px 5px;white-space:nowrap;transform:translate(-50%,-50%);max-width:70%;overflow:hidden;text-overflow:ellipsis}
.move-tag.blue{background:var(--blue)}
.move-tag.gray{background:#5c6069}

/* add mode: placement rectangles, blue dashed */
.add-sel{position:absolute;z-index:3;border:2px dashed var(--blue);background:rgba(47,128,255,.08);box-sizing:border-box;pointer-events:none}
.add-ghost{position:absolute;z-index:2;border:1px dashed rgba(47,128,255,.5);background:rgba(47,128,255,.04);box-sizing:border-box;pointer-events:none}
.add-tag{position:absolute;z-index:6;pointer-events:auto;font-size:10px;font-weight:650;line-height:1.5;color:#fff;background:var(--blue);border-radius:4px;padding:1px 5px;white-space:nowrap;transform:translate(-50%,-50%);max-width:80%;overflow:hidden;text-overflow:ellipsis}
.chip.unverified{background:#eeeef0;color:#6f7278}
.motion-badge{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 7px;border-radius:6px;background:#f1f1ef;color:#63656b;font-size:10px;line-height:1.3;border:1px solid var(--line)}
.motion-badge b{font-weight:650;color:#4d4f55}
.list-sub .chip{margin-left:6px;vertical-align:1px}
.add-form{display:flex;flex-direction:column;gap:6px}
.add-form .labelled{display:flex;flex-direction:column;gap:3px;min-width:0}
.add-form label{font-size:10.5px;color:var(--muted);display:block;margin:0}
.add-form .field,.add-form select{width:100%;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:6px 8px;font:inherit;font-size:12px;min-width:0;color:var(--ink);min-height:30px}
.add-form select{max-width:none}
.add-form .field:focus,.add-form select:focus{outline:2px solid var(--blue);outline-offset:1px}
.add-form select:disabled,.add-form input:disabled{background:#f4f4f2;color:#9a9ca1;cursor:not-allowed}

/* move mode: selection panel */
.field-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
.field-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field-box{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 3px;font-size:12px;text-align:center;min-width:0;overflow:hidden}
.field-box .tiny{font-size:9px;color:#909299;margin-bottom:2px}
.precision-buttons{display:flex;gap:5px}
.precision-buttons button{flex:1;font:inherit;font-size:11px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px;color:#5e6066}
.precision-buttons button:hover{background:#f7f6f3}
.precision-buttons button.active{border-color:#9ebfec;background:#f0f6ff;color:#2669b8;font-weight:650}
.field{width:100%;border:1px solid var(--line2);background:#fff;border-radius:8px;padding:7px 9px;font:inherit;font-size:12px;min-width:0;color:var(--ink)}
.field:focus{outline:2px solid var(--blue);outline-offset:1px}
.hint-note{font-size:10.5px;color:var(--muted);line-height:1.4;margin:5px 0 0;white-space:normal}
.crop-holder{position:relative;width:100%;height:79px;border:1px solid var(--line);border-radius:8px;background:#fafafa;overflow:hidden;display:flex;align-items:center;justify-content:center}
.crop-holder canvas{display:block}
.crop-missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:10px}
.crop-meta{margin-top:5px;font-size:10px;color:var(--faint)}
.request-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.request-head .caption{margin:0}
.request-text{background:#f7f7f5;border:1px solid var(--line);border-radius:8px;padding:8px 9px;font-size:11.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.request-json{margin-top:6px;background:#f7f7f5;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:10px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;color:#50525a}
.copy-mini{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 5px;display:inline-flex;align-items:center;gap:4px;color:#5e6066;font-size:10px}
.copy-mini:hover{background:#f4f3f0}
.copy-mini svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.row-x{flex:none;border:0;background:transparent;padding:0;border-radius:5px;color:#9a9ca1;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;font-size:13px;line-height:1;margin-left:1px}
.row-x:hover{background:#eceae6;color:#4a4b50}
.list-item{cursor:pointer}

@media(max-width:1300px){
  .brand .tagline{display:none}
  .ctl select{max-width:158px}
}
</style>
</head>

  /* ---------- move mode: before crop ---------- */
  var cropTimer = null;
  function beforeRecord() {
    var report = state.report;
    var safe = report && report.images ? safePath(report.images.before) : null;

    var record = state.imgLoaded[safe];
    if (!record) {
      record = state.imgLoaded[safe] = { img: new Image(), ok: false, failed: false, path: safe };
      record.img.onload = function () {
        record.ok = true;
        if (cropTimer) clearTimeout(cropTimer);
        cropTimer = setTimeout(function () { drawBeforeCrop(); }, 0);
      };
      record.img.onerror = function () {
        record.failed = true;

        if (holder && state.mode === 'move') {

          holder.appendChild(el('span', 'crop-missing', 'image not found'));
        }

    }

  }

  function drawBeforeCrop() {
    var holder = $('#cropHolder');
    if (!holder || state.mode !== 'move') return;
    var sel = state.selection;
    holder.innerHTML = '';
    if (!sel) { holder.appendChild(el('span', 'crop-missing', 'No area selected')); return; }
    var record = beforeRecord();
    if (!record) { holder.appendChild(el('span', 'crop-missing', 'image not found')); return; }
    if (record.failed) { holder.appendChild(el('span', 'crop-missing', 'image not found')); return; }
    if (!record.ok) { holder.appendChild(el('span', 'crop-missing', 'Loading\u2026')); return; }
    var natural = { w: record.img.naturalWidth || 0, h: record.img.naturalHeight || 0 };
    if (!natural.w || !natural.h) { holder.appendChild(el('span', 'crop-missing', 'image not found')); return; }
    var size = imageSize();
    var boxW = Math.max(20, holder.clientWidth || 220);
    var boxH = Math.max(20, holder.clientHeight || 79);
    var ratio = Math.min(boxW / sel.w, boxH / sel.h);
    var cw = Math.max(1, Math.round(sel.w * ratio));
    var ch = Math.max(1, Math.round(sel.h * ratio));

    canvas.width = cw;
    canvas.height = ch;
    canvas.setAttribute('aria-label', 'Before crop');
    var ctx = canvas.getContext('2d');
    if (!ctx) { holder.appendChild(el('span', 'crop-missing', 'image not found')); return; }
    var sx = sel.x / size.w * natural.w;
    var sy = sel.y / size.h * natural.h;
    var sw = sel.w / size.w * natural.w;
    var sh = sel.h / size.h * natural.h;

  /* ---------- move mode: rulers ---------- */
  /* Ruler numbers are always capture pixels; only tick density follows the zoom. */
  function rulerSvg(horizontal, capturePx, scale) {
    var major = 100;
    var choices = [100, 200, 500, 1000];
    for (var i = 0; i < choices.length; i++) {
      if (choices[i] * scale >= 40) { major = choices[i]; break; }
      major = choices[choices.length - 1];
    }
    var minor = major / 5;
    var length = Math.max(1, Math.round(capturePx * scale));
    var parts = [];
    var count = Math.floor(capturePx / minor);
    for (var k = 0; k <= count; k++) {
      var value = k * minor;
      if (value > capturePx) break;
      var pos = Math.round(value * scale * 10) / 10;
      var isMajor = k % 5 === 0;
      var tick = isMajor ? 11 : 4;
      if (horizontal) {
        parts.push('<line x1="' + pos + '" x2="' + pos + '" y1="' + (23 - tick) + '" y2="23"/>');
        if (isMajor) parts.push('<text x="' + (pos + 2) + '" y="9">' + value + '</text>');
      } else {
        parts.push('<line y1="' + pos + '" y2="' + pos + '" x1="' + (23 - tick) + '" x2="23"/>');
        if (isMajor) parts.push('<text x="2" y="' + (pos + 10) + '" transform="rotate(90 3 ' + (pos + 10) + ')">' + value + '</text>');
      }
    }
    /* Close the ruler at the capture edge so the last number is the image size. */
    if (capturePx % major !== 0) {
      var end = Math.round(capturePx * scale * 10) / 10;
      if (horizontal) {
        parts.push('<line x1="' + end + '" x2="' + end + '" y1="12" y2="23"/>');
        parts.push('<text x="' + (end - 2) + '" y="9" text-anchor="end">' + capturePx + '</text>');
      } else {
        parts.push('<line y1="' + end + '" y2="' + end + '" x1="12" x2="23"/>');
        parts.push('<text x="2" y="' + (end - 2) + '" transform="rotate(90 3 ' + (end - 2) + ')" text-anchor="end">' + capturePx + '</text>');
      }

      '" aria-hidden="true" fill="#82858b" stroke="#999ca1" stroke-width="0.7" ' +
      'font-size="9" font-family="Arial,sans-serif" preserveAspectRatio="none">' + parts.join('') + '</svg>';
  }

  function rulerHost(horizontal) {
    var found = document.querySelector(horizontal ? '#rulerTop' : '#rulerLeft');
    if (!found) return;
    var size = imageSize();
    var px = horizontal ? size.w : size.h;

  /* ---------- move mode: overlay ---------- */
  function placeBox(node, rect, size) {

    node.style.left = (x / size.w * 100) + '%';
    node.style.top = '0px';
    node.style.height = '100%';
    node.setAttribute('data-guide', (opts && opts.kind) || 'v');
    node.title = Math.round(x) + ' px';
    layer.appendChild(node);

  }

    node.style.top = (y / size.h * 100) + '%';
    node.style.left = '0px';
    node.style.width = '100%';

    node.title = Math.round(y) + ' px';
    layer.appendChild(node);
    return node;

    node.style.width = (Math.abs(x2 - x1) / size.w * 100) + '%';

    layer.appendChild(node);
    return node;
  }
  function measureV(layer, y1, y2, x) {

    node.style.top = (Math.min(y1, y2) / size.h * 100) + '%';
    node.style.height = (Math.abs(y2 - y1) / size.h * 100) + '%';

  /* ---------- add mode: overlay ---------- */

      placeBox(drawing, state.drawRect, size);
      layer.appendChild(drawing);

    }

    if (selectedDraft) {

      placeBox(original, selectedDraft, size);

    var halfPctY = 9 / Math.max(1, state.frameH || 1) * 100;
    node.style.left = clamp((sel.x + sel.w / 2) / size.w * 100, halfPctX, 100 - halfPctX) + '%';

  function updateFrameCursor() {

    if (drag.kind === 'pan') return;
    if (drag.kind === 'add-select') {
      var addRect = state.drawRect;
      state.drawRect = null;
      if (addRect && addRect.w >= MIN_SELECT && addRect.h >= MIN_SELECT) {
        state.addSelection = addRect;
        state.addSelected = null;
        syncSelectedAdd();
        commitHistory(drag.before);
        render();
      } else {
        paintAddOverlay();
        if (addRect) toast('Select at least 8 \u00d7 8 px');
      }
      return;
    }
    if (drag.kind === 'select') {
      var rect = state.drawRect;
      state.drawRect = null;
      if (rect && rect.w >= MIN_SELECT && rect.h >= MIN_SELECT) {
        if (state.selectedDraft) state.selectedDraft = null;
        state.selection = rect;
        state.offset = { dx: 0, dy: 0 };
        state.label = '';
        syncSelectedDraft();
        commitHistory(drag.before);
        render();
      } else {
        paintOverlay();
        if (rect) toast('Select at least 8 \u00d7 8 px');
      }
      return;
    }
    if (state.offset.dx !== drag.base.dx || state.offset.dy !== drag.base.dy) {
      syncSelectedDraft();
      commitHistory(drag.before);
      render();
    }
  }

  function updateMoveInline() {
    var dxNode = $('#offsetDx');
    var dyNode = $('#offsetDy');
    if (dxNode) dxNode.textContent = (state.offset.dx > 0 ? '+' : '') + state.offset.dx;
    if (dyNode) dyNode.textContent = (state.offset.dy > 0 ? '+' : '') + state.offset.dy;
    if (!state.selection) return;
    var source = liveSource();
    var text = $('#requestText');
    if (text) text.textContent = requestHeading(source) + '\n' + requestText(source);
    var json = $('#requestJson');
    if (json) json.textContent = requestJson(source);
  }

  function addSource() {
    var sel = state.addSelection || { x: 0, y: 0, w: 0, h: 0 };
    return {
      id: state.addSelected || nextAddId(),
      x: Math.round(sel.x), y: Math.round(sel.y), w: Math.round(sel.w), h: Math.round(sel.h),
      label: state.addLabel, hint: state.addHint,
      animation: state.addAnimation, duration: state.addDuration, easing: state.addEasing
    };
  }
  /* The instruction box updates without rebuilding the form, so typing keeps focus. */
  function updateAddInline() {
    var text = $('#addText');
    if (!text) return;
    text.textContent = state.addSelection ? addText(addSource()) : 'Point at an area to create an add instruction.';
  }

  /* ---------- rendering ---------- */
  function render() {
    renderStatus();
    renderPages();
    renderZones();
    renderLeft();
    renderStage();
    renderInspector();
    renderPopover();
    renderChrome();
    renderStatusbar();
  }

  function renderStatus() {
    var chip = $('#readiness');
    var report = state.report;
    chip.className = 'status-chip';
    if (!report) { chip.textContent = 'Draft'; return; }
    var status = report.status;
    chip.textContent = status === 'pass' ? 'Pass' : status === 'check' ? 'Check' : status === 'fail' ? 'Fail' : 'Draft';
    if (STATUS_TEXT[status]) chip.classList.add(status);
  }

  function renderPages() {
    var list = $('#pageList');
    list.innerHTML = '';
    var report = state.report;
    var item = el('button', 'page-item active');
    item.type = 'button';
    item.appendChild(el('span', 'page-name', report ? (report.name || 'report') : 'No target'));
    var dot = el('span', 'dot' + (report && STATUS_TEXT[report.status] ? ' ' + report.status : ''));
    item.appendChild(dot);
    list.appendChild(item);
  }

  function renderZones() {
    var grid = $('#zoneGrid');
    grid.innerHTML = '';
    var hits = {};
    state.boxes.forEach(function (box) { if (box.zone) hits[box.zone] = true; });
    ZONES.forEach(function (zone) {
      var cell = el('button', 'zone-cell' + (hits[zone] ? ' hit' : '') + (state.zone === zone ? ' selected' : ''), ZONE_LABEL[zone]);
      cell.type = 'button';
      cell.setAttribute('data-zone', zone);
      cell.title = ZONE_LABEL[zone];
      grid.appendChild(cell);
    });
  }

  function guideBlock() {
    var box = el('div', 'guide');
    box.appendChild(el('strong', null, state.report ? 'No changes to show' : 'No report loaded'));
    var steps = el('ol');
    ['1|Pick a mode', '2|Point at the image', '3|Copy for Hermes'].forEach(function (step) {
      var parts = step.split('|');
      var li = el('li');
      li.appendChild(el('b', null, parts[0]));
      li.appendChild(el('span', null, parts[1]));
      steps.appendChild(li);
    });

    return box;
  }

  function renderLeft() {
    var holder = $('#leftList');
    var count = $('#listCount');
    holder.innerHTML = '';
    count.textContent = String(state.boxes.length);
    var draftCount = state.drafts.length;
    var hasRequests = state.requests.length > 0 || draftCount > 0;

    if (!state.boxes.length) {
      holder.appendChild(hasRequests ? el('p', 'empty-note', 'No changed areas.') : guideBlock());
    } else {
      state.boxes.forEach(function (box) {
        var status = boxStatus(box);
        var row = el('button', 'list-item' + (isBoxSelected(box) ? ' selected' : '') + (state.zone && state.zone === box.zone ? ' zone-hit' : ''));
        row.type = 'button';
        row.setAttribute('data-box', String(box.id));
        var line = el('div', 'line1');
        line.appendChild(el('span', 'id-pill', box.id));
        line.appendChild(el('span', 'list-name', zoneLabel(box.zone)));
        line.appendChild(el('span', 'chip ' + status, status));
        row.appendChild(line);
        row.appendChild(el('div', 'list-sub mono', pct(box.percent) + ' changed'));
        holder.appendChild(row);
      });
    }

    var section = $('#requestsSection');
    var list = $('#requestList');
    var addCount = state.addDrafts.length;
    section.hidden = !hasRequests && !addCount;
    $('#requestCount').textContent = String(state.requests.length + draftCount + addCount);
    list.innerHTML = '';
    if (section.hidden) return;

    /* Drafts first: they are this session's work and the ones Copy for Hermes sends. */
    state.drafts.forEach(function (draft) {
      var selected = state.selectedDraft !== null && String(state.selectedDraft) === String(draft.id);
      var row = el('div', 'list-item' + (selected ? ' selected' : ''));
      row.setAttribute('data-draft', draft.id);
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      var line = el('div', 'line1');
      line.appendChild(el('span', 'id-pill', draft.id));
      line.appendChild(el('span', 'list-name', 'Move \u00b7 ' + labelOf(draft)));
      line.appendChild(el('span', 'chip draft', 'draft'));
      var remove = el('button', 'row-x', '\u00d7');
      remove.type = 'button';
      remove.setAttribute('data-delete-draft', draft.id);
      remove.setAttribute('aria-label', 'Delete ' + draft.id);
      remove.title = 'Delete ' + draft.id;
      line.appendChild(remove);
      row.appendChild(line);
      row.appendChild(el('div', 'list-sub mono',
        (draft.dx > 0 ? '+' : '') + draft.dx + ' \u00b7 ' + (draft.dy > 0 ? '+' : '') + draft.dy +
        ' \u00b7 ' + (draft.precision === 'exact' ? 'Exact' : 'Approx')));
      list.appendChild(row);
    });

    state.requests.forEach(function (request) {
      var row = el('button', 'list-item' + (isRequestSelected(request) ? ' selected' : ''));
      row.type = 'button';
      if (request.id) row.setAttribute('data-request', request.id);
      var line = el('div', 'line1');
      line.appendChild(el('span', 'id-pill', request.id || 'PT-?'));
      line.appendChild(el('span', 'list-name', request.type || 'request'));
      line.appendChild(el('span', 'chip ' + request.status, request.status));
      row.appendChild(line);
      var parts = [];
      if (request.precision) parts.push(request.precision);
      if (request.result && typeof request.result.why === 'string' && request.result.why) parts.push(request.result.why);
      row.appendChild(el('div', 'list-sub', parts.join(' \u00b7 ') || '\u2014'));
      list.appendChild(row);
    });

    /* Add drafts come last, with their own ids and an explicit "not verified" badge. */
    state.addDrafts.forEach(function (draft) {
      var selected = state.addSelected !== null && String(state.addSelected) === String(draft.id);
      var row = el('div', 'list-item' + (selected ? ' selected' : ''));
      row.setAttribute('data-add-draft', draft.id);
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      var line = el('div', 'line1');
      line.appendChild(el('span', 'id-pill', draft.id));
      line.appendChild(el('span', 'list-name', 'Add \u00b7 ' + addName(draft)));
      line.appendChild(el('span', 'chip draft', 'draft'));
      var remove = el('button', 'row-x', '\u00d7');
      remove.type = 'button';
      remove.setAttribute('data-delete-add', draft.id);
      remove.setAttribute('aria-label', 'Delete ' + draft.id);
      remove.title = 'Delete ' + draft.id;
      line.appendChild(remove);
      row.appendChild(line);
      var sub = el('div', 'list-sub mono');
      sub.appendChild(document.createTextNode(
        Math.round(draft.w) + '\u00d7' + Math.round(draft.h) + ' \u00b7 ' +
        (addHasMotion(draft) ? ANIMATION_LABEL[addAnimationOf(draft)] : 'No animation')));
      sub.appendChild(el('span', 'chip unverified', 'not verified'));
      row.appendChild(sub);
      list.appendChild(row);
    });
  }

  function imageNode(path, label) {
    var safe = safePath(path);
    if (!safe) return el('div', 'img-missing', 'image not found');
    var img = el('img');
    img.alt = label || '';
    img.src = safe;
    img.addEventListener('error', function () {
      var box = el('div', 'img-missing', 'image not found');
      if (img.parentNode) img.parentNode.replaceChild(box, img);
    });
    return img;
  }

  function cropSide(side) {
    var figure = el('figure', 'crop');
    figure.appendChild(el('span', 'crop-tag', side === 'before' ? 'Before' : 'After'));
    var holder = el('div', 'crop-img');
    var safe = side && typeof side.path === 'string' ? safePath(side.path) : null;
    if (!safe) {
      holder.appendChild(el('div', 'img-missing', 'image not found'));
    } else {
      var img = el('img');
      img.alt = (side === 'before' ? 'Before' : 'After') + ' crop';
      img.src = safe;
      img.addEventListener('error', function () {
        if (img.parentNode) img.parentNode.replaceChild(el('div', 'img-missing', 'image not found'), img);
      });
      holder.appendChild(img);
    }
    figure.appendChild(holder);
    return figure;
  }

  function cropPair(cropId) {
    var entry = state.crops[cropId];
    if (!entry) return null;
    var pair = el('div', 'crop-pair');
    pair.appendChild(cropSide(entry.before && typeof entry.before === 'object' ? entry.before : null));
    pair.appendChild(cropSide(entry.after && typeof entry.after === 'object' ? entry.after : null));
    return pair;
  }

  function blockWithCaption(caption, node) {
    var block = el('div', 'block');
    block.appendChild(el('div', 'caption', caption));
    block.appendChild(node);
    return block;
  }

  function stageSize() {
    var report = state.report;
    var size = report && report.size ? report.size : null;
    return {
      w: num(size && size.width) || state.capture.w || 1280,
      h: num(size && size.height) || state.capture.h || 720
    };
  }

  function markLayer(size) {
    var layer = el('div', 'marks');
    if (!size || size.w <= 0 || size.h <= 0) return layer;
    /* Boxes are changed-pixel clusters in AFTER capture pixels (contract: flat x,y,w,h).
       Both images share the same capture size, so the same rectangle is used on each;
       no before/after offset is invented from a shift hint. */
    state.boxes.forEach(function (box) {
      if (box.x === null || box.y === null || box.w === null || box.h === null) return;
      var node = el('button', 'mark-box ' + boxStatus(box));
      node.type = 'button';
      node.setAttribute('data-box', String(box.id));
      node.title = 'Change ' + box.id + ' \u00b7 ' + zoneLabel(box.zone);
      node.style.left = (box.x / size.w * 100) + '%';
      node.style.top = (box.y / size.h * 100) + '%';
      node.style.width = (box.w / size.w * 100) + '%';
      node.style.height = (box.h / size.h * 100) + '%';
      if (isBoxSelected(box)) node.classList.add('selected');
      layer.appendChild(node);
    });
    return layer;
  }

  function frameHalf(label, path, size, imageLabel) {
    var half = el('div', 'half');
    var tag = el('span', 'tag', label);
    var frame = el('div', 'frame');
    frame.appendChild(imageNode(path, imageLabel));
    frame.appendChild(markLayer(size));
    half.appendChild(tag);
    half.appendChild(frame);
    return { half: half, frame: frame };
  }

  function renderMoveStage(inner, scroller, size) {
    var report = state.report;
    var images = report.images || {};

    var system = el('div', 'frame-system');
    system.appendChild(el('div', 'ruler-corner'));
    var rulerTop = el('div', 'ruler-top');
    rulerTop.id = 'rulerTop';
    var rulerLeft = el('div', 'ruler-left');
    rulerLeft.id = 'rulerLeft';
    var frame = el('div', 'move-frame ' + (CURSOR_CLASS[activeTool()] || 'cursor-grab'));
    frame.id = 'moveFrame';

    var availW = Math.max(120, (scroller ? scroller.clientWidth : 900) - 23 - 16);
    var availH = Math.max(120, (scroller ? scroller.clientHeight : 600) - 23 - 16);
    var zoom = state.zoom === 'fit' ? null : (Number(state.zoom) || 1);
    /* The scale only changes the drawing box; capture pixels and ruler numbers never change. */
    var scale = zoom === null ? Math.min(availW / size.w, availH / size.h) : zoom;
    scale = Math.max(0.02, scale);
    var frameW = Math.max(20, Math.round(size.w * scale));
    var frameH = Math.max(20, Math.round(size.h * scale));
    state.scale = scale;
    state.overlaySize = size;
    frame.style.width = frameW + 'px';
    frame.style.height = frameH + 'px';
    rulerTop.style.width = frameW + 'px';
    rulerLeft.style.height = frameH + 'px';

    var grid = el('div', 'move-grid');
    var wantGrid = state.mode === 'add' ? state.addGrid : state.grid;
    if (wantGrid) {
      var step = Math.max(4, 8 * frameW / size.w);
      grid.style.backgroundImage = 'linear-gradient(to right,rgba(47,128,255,.13) 1px,transparent 1px),' +
        'linear-gradient(to bottom,rgba(47,128,255,.13) 1px,transparent 1px)';
      grid.style.backgroundSize = step + 'px ' + step + 'px';
    }
    frame.appendChild(grid);

    var img = el('img');
    img.alt = 'after image';
    var afterSafe = safePath(images.after);
    img.addEventListener('error', function () {
      if (img.parentNode) img.parentNode.replaceChild(el('div', 'img-missing', 'image not found'), img);
    });
    if (afterSafe) { img.src = afterSafe; frame.appendChild(img); }
    else frame.appendChild(el('div', 'img-missing', 'image not found'));

    var overlay = el('div', 'move-overlay');
    overlay.id = 'moveOverlay';
    frame.appendChild(overlay);

    frame.addEventListener('pointerdown', beginMoveDrag);
    frame.addEventListener('pointermove', moveMoveDrag);
    frame.addEventListener('pointerup', endMoveDrag);
    frame.addEventListener('pointercancel', endMoveDrag);
    /* Keep the stage from selecting text while dragging a rectangle. */
    frame.addEventListener('dragstart', function (event) { event.preventDefault(); });

    system.appendChild(rulerTop);
    system.appendChild(rulerLeft);
    system.appendChild(frame);
    inner.appendChild(system);

    if (zoom !== null) {
      inner.style.minWidth = (frameW + 23) + 'px';
      inner.style.minHeight = (frameH + 23) + 'px';
    }

    state.frameW = frameW;
    state.frameH = frameH;
    rulerHost(true);
    rulerHost(false);
    if (state.mode === 'add') paintAddOverlay(); else paintOverlay();
  }

  function renderStage() {
    var inner = $('#stageInner');
    var scroller = $('#stageScroller');
    inner.innerHTML = '';
    inner.className = 'stage-inner mode-' + state.mode;
    inner.style.width = '';
    inner.style.height = '';
    inner.style.minWidth = '0';
    inner.style.minHeight = '0';
    var report = state.report;

    if (!report) {
      var empty = el('div', 'placeholder');
      empty.appendChild(el('strong', null, 'No report loaded'));
      empty.appendChild(el('span', null, 'This page has no embedded report data yet.'));
      inner.appendChild(empty);
      state.scale = 1;
      return;
    }

    var size = stageSize();
    var images = report.images || {};

    if (state.mode === 'add') {
      renderMoveStage(inner, scroller, size);
      return;
    }

    if (state.mode !== 'review') {
      renderMoveStage(inner, scroller, size);
      return;
    }

    if (state.view !== 'side') {
      var ph = el('div', 'placeholder');
      ph.appendChild(el('strong', null, state.view.charAt(0).toUpperCase() + state.view.slice(1) + ' view'));
      ph.appendChild(el('span', null, VIEW_PLACEHOLDER[state.view] || 'Not available yet.'));
      inner.appendChild(ph);
      state.scale = 1;
      return;
    }

    var gap = 8;
    var pair = el('div', 'pair');
    pair.style.gap = gap + 'px';
    var before = frameHalf('Before', images.before, size, 'before');
    var after = frameHalf('After', images.after, size, 'after');
    pair.appendChild(before.half);
    pair.appendChild(after.half);

    if (state.zoom !== 'fit') {
      var zoom = Number(state.zoom) || 1;
      var zw = Math.max(20, Math.round(size.w * zoom));
      var zh = Math.max(20, Math.round(size.h * zoom));
      pair.classList.add('zoomed');
      pair.style.width = (zw * 2 + gap) + 'px';
      pair.style.height = zh + 'px';
      [before, after].forEach(function (item) {
        item.half.style.width = zw + 'px';
        item.half.style.height = zh + 'px';
        item.frame.style.width = zw + 'px';
        item.frame.style.height = zh + 'px';
      });
      inner.style.minWidth = (zw * 2 + gap) + 'px';
      inner.style.minHeight = zh + 'px';
      state.scale = zoom;
    } else {
      /* Fit: the pair fills the stage; each image keeps its aspect ratio and is never cropped. */
      pair.classList.add('fitted');
      pair.style.width = '100%';
      pair.style.height = '100%';
      inner.style.width = '100%';
      inner.style.height = '100%';
      inner.appendChild(pair);
      var halfW = before.half.clientWidth;
      var halfH = before.half.clientHeight;
      var fit = Math.max(0.01, Math.min((halfW || size.w) / size.w, (halfH || size.h) / size.h));
      var fw = Math.max(20, Math.round(size.w * fit));
      var fh = Math.max(20, Math.round(size.h * fit));
      [before, after].forEach(function (item) {
        item.frame.style.width = fw + 'px';
        item.frame.style.height = fh + 'px';
      });
      state.scale = fit;
      return;
    }
    inner.appendChild(pair);
  }

  function appendRow(parent, label, value) {
    var row = el('div', 'row');
    row.appendChild(el('span', null, label));
    row.appendChild(el('strong', null, value));
    parent.appendChild(row);
  }

  function renderSummary() {
    var card = $('#summaryCard');
    var text = $('#summaryText');
    var note = $('#reportNote');
    var report = state.report;
    card.className = 'summary-card';
    card.textContent = '';
    if (!report) {
      text.textContent = 'No report loaded';
      card.appendChild(text);
      note.textContent = '';
      note.hidden = true;
      return;
    }
    var status = STATUS_TEXT[report.status] ? report.status : 'check';
    card.classList.add(status);
    var mark = el('span', 'mark', statusSymbol(status));
    mark.setAttribute('aria-hidden', 'true');
    card.appendChild(mark);
    text.textContent = STATUS_TEXT[status];
    card.appendChild(text);
    /* Only the three contract tokens are shown, in words. Anything else stays silent. */
    var value = typeof report.note === 'string' ? NOTE_TEXT[report.note] || '' : '';
    note.textContent = value;
    note.hidden = !value;
  }

  function restoreFocus(focusId, caret) {
    if (!focusId) return;
    var node = document.getElementById(focusId);
    if (!node) return;
    try {
      node.focus({ preventScroll: true });
      if (caret !== null && typeof node.setSelectionRange === 'function' && typeof node.value === 'string') {
        node.setSelectionRange(caret, caret);
      }
    } catch (err) { /* focus is best-effort */ }
  }

  function renderInspector() {
    renderSummary();
    var title = $('#inspectorTitle');
    var chip = $('#inspectorChip');
    var body = $('#inspectorBody');
    /* Rebuilds replace the form controls; keep the caret where the user left it. */
    var active = document.activeElement;
    var focusId = active && active.id && body.contains(active) ? active.id : null;
    var caret = focusId && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    if (focusId) {
      /* Dropping the control must not be read as "the user finished editing". */
      state.suppressFocusCommit = true;
      try { active.blur(); } catch (err) { /* ignore */ }
      state.suppressFocusCommit = false;
      state.addFieldBefore = null;
      state.labelBefore = null;
    }
    body.innerHTML = '';
    chip.className = 'chip count';
    var report = state.report;

    if (!report) {
      title.textContent = state.mode === 'review' ? 'Changes' : state.mode === 'add' ? 'Add' : 'Selection';
      chip.textContent = '\u2014';
      body.appendChild(el('p', 'empty-note', state.mode === 'add'
        ? 'No report loaded. Open a report with an embedded image to place new elements.'
        : 'No report loaded.'));
      return;
    }

    if (state.mode === 'add') {
      renderAddInspector(title, chip, body);
      restoreFocus(focusId, caret);
      return;
    }

    if (state.mode !== 'review') {
      renderMoveInspector(title, chip, body);
      restoreFocus(focusId, caret);
      return;
    }

    var request = findRequest(state.selectedRequest);
    if (request) {
      title.textContent = 'Request ' + (request.id || '');
      chip.className = 'chip ' + request.status + ' count';
      chip.textContent = request.status;
      var asked = el('div', 'detail');
      appendRow(asked, 'Kind', request.type || '\u2014');
      if (request.precision) appendRow(asked, 'Precision', request.precision);
      if (request.from) appendRow(asked, 'From', fmtRect(request.from));
      if (request.to) appendRow(asked, 'To', fmtRect(request.to));
      body.appendChild(blockWithCaption('Asked', asked));
      var verdict = el('div', 'detail');
      appendRow(verdict, 'Verdict', request.status);
      var result = request.result || {};
      /* match is 0..1 in the contract; the UI only ever shows whole percents. */
      if (num(result.match) !== null) appendRow(verdict, 'Match', matchText(result.match));
      /* found/moved/off may be null: a dash, never "null". */
      appendRow(verdict, 'Found', fmtRect(result.found));
      appendRow(verdict, 'Moved', pairText(result.moved));
      appendRow(verdict, 'Off', pairText(result.off));
      if (typeof result.why === 'string' && result.why) appendRow(verdict, 'Why', result.why);
      body.appendChild(blockWithCaption('Verdict', verdict));
      var requestCrops = request.id ? cropPair('req-' + request.id) : null;
      if (requestCrops) body.appendChild(blockWithCaption('Crops', requestCrops));
      else body.appendChild(el('p', 'empty-note', 'No crops for this request.'));
      restoreFocus(focusId, caret);
      return;
    }

    var box = findBox(state.selectedBox);
    if (box) {
      var status = boxStatus(box);
      title.textContent = 'Change ' + box.id;
      chip.className = 'chip ' + status + ' count';
      chip.textContent = status;
      var rows = el('div', 'detail');
      appendRow(rows, 'Area', zoneLabel(box.zone));
      appendRow(rows, 'Position', fmtPoint(box));
      appendRow(rows, 'Size', fmtSize(box));
      appendRow(rows, 'Changed', pct(box.percent));
      appendRow(rows, 'Status', status);
      body.appendChild(blockWithCaption('Selected change', rows));
      var boxCrops = cropPair('box-' + box.id);
      if (boxCrops) body.appendChild(blockWithCaption('Crops', boxCrops));
      return;
    }

    title.textContent = 'Changes';
    chip.className = 'chip count';
    chip.textContent = state.boxes.length + ' area' + (state.boxes.length === 1 ? '' : 's');
    if (state.mode !== 'review') {
      body.appendChild(el('p', 'empty-note', 'This mode is a skeleton in this round. Only pixel size, position, area and status are shown, from the images themselves.'));
      return;
    }
    body.appendChild(el('p', 'empty-note', 'Pick a change or a request to inspect its pixels.'));
  }

  function fieldBox(caption, value, id) {
    var box = el('div', 'field-box mono');
    box.appendChild(el('div', 'tiny', caption));
    var span = el('span', null, value);
    if (id) span.id = id;
    box.appendChild(span);
    return box;
  }

  function renderMoveInspector(title, chip, body) {
    var sel = state.selection;
    title.textContent = 'Selection';
    chip.className = 'chip count';
    chip.textContent = state.drafts.length + ' draft' + (state.drafts.length === 1 ? '' : 's');

    offsetGrid.appendChild(fieldBox('dy', (state.offset.dy > 0 ? '+' : '') + state.offset.dy, 'offsetDy'));

    /* Precision */
