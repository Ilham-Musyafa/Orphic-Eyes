    exact.type = 'button';
    exact.id = 'precisionExact';
    exact.title = 'Exact = 2 px';
    var approx = el('button', state.precision === 'approximate' ? 'active' : '', 'Approx');
    approx.type = 'button';
    approx.id = 'precisionApprox';
    approx.title = 'Approx = 8 px';
    buttons.appendChild(exact);
    buttons.appendChild(approx);
    precisionBlock.appendChild(buttons);
    body.appendChild(precisionBlock);

    /* Label */
    var labelBlock = el('div', 'block');
    labelBlock.appendChild(el('div', 'caption', 'Your label'));
    var input = el('input', 'field');
    input.type = 'text';
    input.id = 'selectionLabel';
    input.maxLength = 60;
    input.value = state.label;
    input.placeholder = 'e.g. Start trial button';
    input.setAttribute('aria-label', 'Area label');
    labelBlock.appendChild(input);
    labelBlock.appendChild(el('p', 'hint-note', 'A label you provide. No page code or DOM data is read.'));
    body.appendChild(labelBlock);

    /* Before crop */
    var cropBlock = el('div', 'block');
    cropBlock.appendChild(el('div', 'caption', 'Before crop'));
    var holder = el('div', 'crop-holder');
    holder.id = 'cropHolder';
    cropBlock.appendChild(holder);
    var meta = el('div', 'crop-meta mono', sel
      ? Math.round(sel.x) + ', ' + Math.round(sel.y) + ' \u00b7 ' + Math.round(sel.w) + ' \u00d7 ' + Math.round(sel.h) + ' px'
      : 'No area selected');
    cropBlock.appendChild(meta);
    body.appendChild(cropBlock);

    /* Generated request */
    var source = liveSource();
    var requestBlock = el('div', 'block');
    var head = el('div', 'request-head');
    head.appendChild(el('div', 'caption', 'Generated request'));
    var copyBtn = el('button', 'copy-mini');
    copyBtn.type = 'button';
    copyBtn.id = 'copyRequest';
    copyBtn.title = 'Copy this request';
    copyBtn.setAttribute('aria-label', 'Copy this request');
    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('viewBox', '0 0 24 24');
    icon.setAttribute('aria-hidden', 'true');
    var pathA = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    pathA.setAttribute('x', '8'); pathA.setAttribute('y', '8');
    pathA.setAttribute('width', '12'); pathA.setAttribute('height', '12');
    pathA.setAttribute('rx', '2');
    var pathB = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathB.setAttribute('d', 'M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2');
    icon.appendChild(pathA);
    icon.appendChild(pathB);
    copyBtn.appendChild(icon);
    copyBtn.appendChild(el('span', null, 'Copy'));
    head.appendChild(copyBtn);
    requestBlock.appendChild(head);
    var text = el('div', 'request-text mono');
    text.id = 'requestText';
    text.textContent = sel ? (requestHeading(source) + '\n' + requestText(source)) : 'Point at an area to create a request.';
    requestBlock.appendChild(text);
    if (sel) {
      var json = el('div', 'request-json mono');
      json.id = 'requestJson';
      json.textContent = requestJson(source);
      requestBlock.appendChild(json);
    }
    body.appendChild(requestBlock);

    /* Draft actions */
    var actions = el('div', 'block');
    var addBtn = el('button', 'btn', 'Add request');
    addBtn.type = 'button';
    addBtn.id = 'addDraft';
    addBtn.disabled = !sel;
    addBtn.style.width = '100%';
    addBtn.style.justifyContent = 'center';
    actions.appendChild(addBtn);
    if (state.drafts.length >= MAX_REQUESTS) {
      var limit = el('p', 'hint-note', 'Up to 8 requests per check');
      limit.id = 'moveLimit';
      actions.appendChild(limit);
    } else if (state.selectedDraft) {
      actions.appendChild(el('p', 'hint-note', 'Edits above save to ' + state.selectedDraft + '.'));
    }
    body.appendChild(actions);

    drawBeforeCrop();
  }

  function copyIconButton(id, title) {
    var button = el('button', 'copy-mini');
    button.type = 'button';
    button.id = id;
    button.title = title;
    button.setAttribute('aria-label', title);
    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('viewBox', '0 0 24 24');
    icon.setAttribute('aria-hidden', 'true');
    var rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    rect.setAttribute('x', '8'); rect.setAttribute('y', '8');
    rect.setAttribute('width', '12'); rect.setAttribute('height', '12');
    rect.setAttribute('rx', '2');
    var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', 'M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2');
    icon.appendChild(rect);
    icon.appendChild(path);
    button.appendChild(icon);
    button.appendChild(el('span', null, 'Copy'));
    return button;
  }

  function addFieldRow(labelText, control) {
    var wrap = el('div', 'labelled');
    var label = el('label', null, labelText);
    if (control.id) label.setAttribute('for', control.id);
    wrap.appendChild(label);
    wrap.appendChild(control);
    return wrap;
  }

  function addSelect(id, options, value, disabled) {
    var select = el('select');
    select.id = id;
    options.forEach(function (item) {
      var option = el('option', null, item[1]);
      option.value = item[0];
      if (item[0] === value) option.selected = true;
      select.appendChild(option);
    });
    select.disabled = !!disabled;
    return select;
  }

  /* Renders only the fields that changed, so a focused control keeps its focus
     and typing is never interrupted by a full re-render. */
  function syncAddControls() {
    var label = document.getElementById('addLabel');
    if (label && document.activeElement !== label && label.value !== state.addLabel) label.value = state.addLabel;
    var hint = document.getElementById('addHint');
    if (hint && hint.value !== state.addHint) hint.value = state.addHint;
    var anim = document.getElementById('addAnimation');
    if (anim && anim.value !== state.addAnimation) anim.value = state.addAnimation;
    var easing = document.getElementById('addEasing');
    if (easing && easing.value !== state.addEasing) easing.value = state.addEasing;
    var motion = addHasMotion({ animation: state.addAnimation });
    if (easing) easing.disabled = !motion;
    var duration = document.getElementById('addDuration');
    if (duration) {
      duration.disabled = !motion;
      var shown = String(addDurationOf({ duration: state.addDuration }));
      if (document.activeElement !== duration && duration.value !== shown) duration.value = shown;
    }
  }

  /* Add mode: one large After image. The panel is the placement form and the
     generated instruction; nothing here is verified, and nothing goes to the engine. */
  function renderAddInspector(title, chip, body) {
    var sel = state.addSelection;
    var draft = state.addSelected ? findAddDraft(state.addSelected) : null;
    title.textContent = draft ? 'Add ' + draft.id : 'Add';
    chip.className = 'chip count';
    chip.textContent = state.addDrafts.length + ' add' + (state.addDrafts.length === 1 ? '' : 's');

    var areaBlock = el('div', 'block');
    areaBlock.appendChild(el('div', 'caption', 'Where it should appear (pixels)'));
    var grid = el('div', 'field-grid');
    grid.appendChild(fieldBox('X', sel ? Math.round(sel.x) : '\u2014'));
    grid.appendChild(fieldBox('Y', sel ? Math.round(sel.y) : '\u2014'));
    grid.appendChild(fieldBox('W', sel ? Math.round(sel.w) : '\u2014'));
    grid.appendChild(fieldBox('H', sel ? Math.round(sel.h) : '\u2014'));
    areaBlock.appendChild(grid);
    if (!sel) areaBlock.appendChild(el('p', 'hint-note', 'Drag on the image to place the new element.'));
    body.appendChild(areaBlock);

    var form = el('div', 'add-form');

    var labelInput = el('input', 'field');
    labelInput.type = 'text';
    labelInput.id = 'addLabel';
    labelInput.maxLength = 60;
    labelInput.value = state.addLabel;
    labelInput.placeholder = 'e.g. Promo banner';
    labelInput.setAttribute('aria-label', 'Your label');
    form.appendChild(addFieldRow('Your label', labelInput));

    var hintSelect = addSelect('addHint', ADD_HINTS.map(function (item) { return [item, item]; }), state.addHint);
    form.appendChild(addFieldRow('Element hint', hintSelect));

    var motion = addHasMotion({ animation: state.addAnimation });
    var animSelect = addSelect('addAnimation',
      ANIMATION_ORDER.map(function (key) { return [key, ANIMATION_LABEL[key]]; }), state.addAnimation);
    form.appendChild(addFieldRow('Animation', animSelect));

    var duration = el('input', 'field mono');
    duration.type = 'number';
    duration.id = 'addDuration';
    duration.min = '50';
    duration.max = '3000';
    duration.step = '10';
    duration.value = String(addDurationOf({ duration: state.addDuration }));
    duration.disabled = !motion;
    duration.setAttribute('aria-label', 'Animation duration in milliseconds');
    form.appendChild(addFieldRow('Duration (ms)', duration));

    var easingSelect = addSelect('addEasing',
      EASINGS.map(function (key) { return [key, key]; }), state.addEasing, !motion);
    form.appendChild(addFieldRow('Easing', easingSelect));
    body.appendChild(blockWithCaption('New element', form));

    if (motion) {
      var badge = el('div', 'motion-badge');
      badge.id = 'addMotionBadge';
      /* One unambiguous sentence: motion is never verified. */
      badge.textContent = MOTION_NOTE;
      body.appendChild(badge);
    }

    /* Generated instruction: plain text only, no engine request object. */
    var source = {
      id: draft ? draft.id : nextAddId(),
      x: sel ? sel.x : 0, y: sel ? sel.y : 0,
      w: sel ? sel.w : 0, h: sel ? sel.h : 0,
      label: state.addLabel, hint: state.addHint,
      animation: state.addAnimation, duration: state.addDuration, easing: state.addEasing
    };
    var textBlock = el('div', 'block');
    var head = el('div', 'request-head');
    head.appendChild(el('div', 'caption', 'Add instruction'));
    head.appendChild(copyIconButton('copyAddText', 'Copy this instruction'));
    textBlock.appendChild(head);
    var text = el('div', 'request-text mono');
    text.id = 'addText';
    text.textContent = sel ? addText(source) : 'Point at an area to create an add instruction.';
    textBlock.appendChild(text);
    body.appendChild(textBlock);

    var actions = el('div', 'block');
    var saveBtn = el('button', 'btn', draft ? 'Save ' + draft.id : 'Add instruction');
    saveBtn.type = 'button';
    saveBtn.id = 'addDraftSave';
    saveBtn.disabled = !sel;
    saveBtn.style.width = '100%';
    saveBtn.style.justifyContent = 'center';
    actions.appendChild(saveBtn);
    if (draft) actions.appendChild(el('p', 'hint-note', 'Edits above save to ' + draft.id + '.'));
    body.appendChild(actions);
  }

  function renderPopover() {
    var pop = $('#changePop');
    var crops = $('#popCrops');
    var box = findBox(state.selectedBox);
    if (!box || state.mode !== 'review') {
      pop.hidden = true;
      crops.innerHTML = '';
      return;
    }
    var status = boxStatus(box);
    pop.hidden = false;
    $('#popTitle').textContent = 'Change ' + box.id + ' \u00b7 ' + zoneLabel(box.zone);
    $('#popInfo').textContent = fmtPoint(box) + ' \u00b7 ' + fmtSize(box) + ' \u00b7 ' + pct(box.percent) + ' changed';
    crops.innerHTML = '';
    var pair = cropPair('box-' + box.id);
    if (pair) crops.appendChild(pair);
    var approve = $('#popApprove');
    approve.disabled = status === 'approved';
    approve.textContent = status === 'approved' ? 'Approved' : 'Approve';
  }

  function placePopover(clientX, clientY) {
    var pop = $('#changePop');
    if (pop.hidden) return;
    var rect = pop.getBoundingClientRect();
    var left = clientX + 14;
    var top = clientY + 14;
    if (left + rect.width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - rect.width - 8);
    if (top + rect.height > window.innerHeight - 8) top = Math.max(8, clientY - rect.height - 12);
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  function renderChrome() {
    var buttons = document.querySelectorAll('#modeSwitch button');
    for (var i = 0; i < buttons.length; i++) {
      var on = buttons[i].getAttribute('data-mode') === state.mode;
      buttons[i].classList.toggle('on', on);
      buttons[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    var views = document.querySelectorAll('#viewSwitch button');
    for (var j = 0; j < views.length; j++) {
      var active = views[j].getAttribute('data-view') === state.view;
      views[j].classList.toggle('on', active);
      views[j].setAttribute('aria-pressed', active ? 'true' : 'false');
    }
    var bar = document.querySelector('.review-bar');
    bar.style.display = state.mode === 'review' ? '' : 'none';
    var toolbar = $('#moveToolbar');
    var hint = $('#moveHint');
    var editing = state.mode === 'move' || state.mode === 'add';
    if (toolbar) toolbar.hidden = !editing;
    if (hint) {
      hint.hidden = !editing;
      hint.textContent = state.mode === 'add' ? HINT_ADD : HINT_MOVE;
    }
    /* Each mode shows only its own tools: Move gets move+precision, Add gets place. */
    var forNodes = document.querySelectorAll('#moveToolbar [data-for]');
    for (var f = 0; f < forNodes.length; f++) {
      var owned = forNodes[f].getAttribute('data-for');
      forNodes[f].style.display = owned === state.mode ? '' : 'none';
    }

    var tools = document.querySelectorAll('#moveToolbar [data-tool]');
    var current = activeTool();
    for (var k = 0; k < tools.length; k++) {
      var name = tools[k].getAttribute('data-tool');
      var disabled = name === 'hide' || name === 'comment';
      tools[k].classList.toggle('on', !disabled && name === current);
      if (disabled) {
        tools[k].disabled = true;
        tools[k].setAttribute('aria-disabled', 'true');
        tools[k].title = 'Coming next round';
      }
    }
    toggleOption('#gridBtn', state.grid);
    toggleOption('#snapBtn', state.snap);
    toggleOption('#axisBtn', state.axisLock);
    toggleOption('#exactBtn', state.precision === 'exact');
    toggleOption('#approxBtn', state.precision === 'approximate');
    toggleOption('#addGridBtn', state.addGrid);

    var note = $('#reviewNote');
    if (!state.report) { note.textContent = ''; return; }
    if (state.mode !== 'review') { note.textContent = ''; return; }
    if (state.view !== 'side') { note.textContent = 'Placeholder in this round'; return; }
    note.textContent = state.boxes.length
      ? state.boxes.length + ' changed area(s) \u00b7 click one to review'
      : 'No pixel differences beyond the threshold';
  }

  function toggleOption(selector, on) {
    var node = document.querySelector(selector);
    if (!node) return;
    node.classList.toggle('on', !!on);
    node.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function renderStatusbar() {
    var report = state.report;
    var size = stageSize();
    var label = size.w + 'x' + size.h;
    $('#captureSize').textContent = report ? label : '\u2014';
    $('#sbCapture').textContent = 'Capture ' + label;
    $('#sbZoom').textContent = 'Zoom ' + (state.zoom === 'fit' ? 'Fit' : Math.round(Number(state.zoom) * 100) + '%');
    $('#sbPrecision').textContent = 'Exact 2 px \u00b7 Approx 8 px';
    updateHistory();
  }

  /* ---------- events ---------- */
  function revealRow(id) {
    var row = document.querySelector('#leftList [data-box="' + String(id).replace(/"/g, '') + '"]');
    if (!row) return;
    if (row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
    row.classList.add('flash');
    setTimeout(function () { row.classList.remove('flash'); }, 750);
  }

  function selectBox(id, clientX, clientY, reveal) {
    state.selectedBox = id;
    state.selectedRequest = null;
    render();
    if (clientX !== undefined && clientY !== undefined) placePopover(clientX, clientY);
    if (reveal) revealRow(id);
  }

  function selectRequest(id) {
    state.selectedRequest = id;
    state.selectedBox = null;
    render();
  }

  function approveSelected() {
    var box = findBox(state.selectedBox);
    if (!box) return;
    box.approved = true;
    render();
    toast('Change ' + box.id + ' approved');
  }

  function setMode(mode) {
    state.mode = mode === 'move' ? 'move' : mode === 'add' ? 'add' : 'review';
    state.selectedBox = null;
    state.selectedRequest = null;
    state.drawRect = null;
    state.drag = null;
    /* Drafts and selections survive mode switches on purpose. */
    render();
    toast(state.mode === 'review' ? 'Review mode' : state.mode === 'move' ? 'Move mode' : 'Add mode');
  }

  function initEvents() {
    document.getElementById('modeSwitch').addEventListener('click', function (event) {
      var button = event.target.closest('[data-mode]');
      if (!button) return;
      setMode(button.getAttribute('data-mode'));
    });

    document.getElementById('viewSwitch').addEventListener('click', function (event) {
      var button = event.target.closest('[data-view]');
      if (!button) return;
      state.view = button.getAttribute('data-view');
      state.selectedBox = null;
      render();
    });

    document.getElementById('zoneGrid').addEventListener('click', function (event) {
      var cell = event.target.closest('[data-zone]');
      if (!cell) return;
      var zone = cell.getAttribute('data-zone');
      state.zone = state.zone === zone ? null : zone;
      render();
      toast(state.zone ? 'Area: ' + zoneLabel(state.zone) : 'Area cleared');
    });

    document.getElementById('copyMain').addEventListener('click', function () {
      writeClipboard(hermesText());
    });

    document.getElementById('popApprove').addEventListener('click', approveSelected);
    document.getElementById('popCopy').addEventListener('click', function () {
      var box = findBox(state.selectedBox);
      if (!box) return;
      writeClipboard(fixText(box));
    });

    document.getElementById('zoomSelect').addEventListener('change', function (event) {
      state.zoom = event.target.value;
      renderStage();
      renderStatusbar();
    });

    document.getElementById('undoBtn').addEventListener('click', undo);
    document.getElementById('redoBtn').addEventListener('click', redo);

    var toolbar = document.getElementById('moveToolbar');
    toolbar.addEventListener('click', function (event) {
      var button = event.target.closest('[data-tool]');
      if (button) {
        if (button.disabled || button.classList.contains('is-disabled')) return;
        setTool(button.getAttribute('data-tool'));
        return;
      }
      var option = event.target.closest('button[id]');
      if (!option) return;
      var id = option.id;
      if (id === 'gridBtn') {
        state.grid = !state.grid;
        renderChrome();
        renderStage();
      } else if (id === 'snapBtn') {
        state.snap = !state.snap;
        renderChrome();
        toast(state.snap ? 'Snap on · 8 px grid' : 'Snap off');
      } else if (id === 'axisBtn') {
        state.axisLock = !state.axisLock;
        renderChrome();
        toast(state.axisLock ? 'Axis lock on' : 'Axis lock off');
      } else if (id === 'exactBtn' || id === 'approxBtn') {
        setPrecision(id === 'exactBtn' ? 'exact' : 'approximate');
      } else if (id === 'addGridBtn') {
        state.addGrid = !state.addGrid;
        renderChrome();
        renderStage();
      }
    });

    document.addEventListener('click', function (event) {
      var mark = event.target.closest('[data-box]');
      if (mark) {
        selectBox(mark.getAttribute('data-box'), event.clientX, event.clientY, true);
        return;
      }
      var removeAdd = event.target.closest('[data-delete-add]');
      if (removeAdd) {
        deleteAddDraft(removeAdd.getAttribute('data-delete-add'));
        return;
      }
      var remove = event.target.closest('[data-delete-draft]');
      if (remove) {
        deleteDraft(remove.getAttribute('data-delete-draft'));
        return;
      }
      var addRow = event.target.closest('[data-add-draft]');
      if (addRow) {
        selectAddDraft(addRow.getAttribute('data-add-draft'));
        return;
      }
      var draftRow = event.target.closest('[data-draft]');
      if (draftRow) {
        selectDraft(draftRow.getAttribute('data-draft'));
        return;
      }
      var requestRow = event.target.closest('[data-request]');
      if (requestRow) {
        /* Verdict rows stay informational in Move mode; only drafts are selectable there. */
        if (state.mode === 'review') selectRequest(requestRow.getAttribute('data-request'));
        return;
      }
      if (event.target.closest('#changePop')) return;
      if (state.selectedBox !== null) {
        state.selectedBox = null;
        render();
      }
    });

    /* Inspector controls are rebuilt on every render, so listen on the body once. */
    var body = document.getElementById('inspectorBody');
    body.addEventListener('click', function (event) {
      var target = event.target;
      if (target.closest('#precisionExact')) { setPrecision('exact'); return; }
      if (target.closest('#precisionApprox')) { setPrecision('approximate'); return; }
      if (target.closest('#addDraft')) { addDraft(); return; }
      if (target.closest('#addDraftSave')) { saveAddDraft(); return; }
      if (target.closest('#copyRequest')) {
        var source = liveSource();
        if (!state.selection) { toast('Point at an area to create a request'); return; }
        writeClipboard(requestHeading(source) + '\n' + requestText(source) + '\n' + requestJson(source));
        return;
      }
      if (target.closest('#copyAddText')) {
        if (!state.addSelection) { toast('Point at an area to create an instruction'); return; }
        writeClipboard(addText(addSource()));
        return;
      }
    });

    body.addEventListener('focusin', function (event) {
      var id = event.target && event.target.id;
      if (id === 'selectionLabel') {
        /* One undo step per label edit: snapshot on focus, commit on commit. */
        state.labelBefore = snapshotState();
        return;
      }
      if (id && id.indexOf('add') === 0) {
        /* Same rule for the add fields: one step per editing burst. */
        state.addFieldBefore = snapshotState();
        state.addFocus = id;
      }
    });

    body.addEventListener('input', function (event) {
      var id = event.target && event.target.id;
      if (id === 'selectionLabel') {
        if (!state.selection) return;
        var value = event.target.value;
        if (state.label === value) return;
        state.label = value;
        syncSelectedDraft();
        updateMoveInline();
        if (!state.labelTimer) {
          state.labelTimer = setTimeout(function () {
            state.labelTimer = null;
            renderLeft();
          }, 260);
        }
        return;
      }
      if (id === 'addLabel') {
        if (state.addLabel === event.target.value) return;
        state.addLabel = event.target.value;
        syncSelectedAdd();
        updateAddInline();
        if (state.addSelected) {
          var row = document.querySelector('[data-add-draft="' + state.addSelected + '"] .list-name');
          if (row) row.textContent = 'Add \u00b7 ' + addName({ label: state.addLabel });
        }
        if (!state.addTimer) {
          state.addTimer = setTimeout(function () {
            state.addTimer = null;
            renderLeft();
          }, 260);
        }
        return;
      }
      if (id === 'addDuration') {
        var raw = event.target.value;
        if (raw === '') return;
        var ms = num(Number(raw));
        if (ms === null || !isFinite(ms)) return;
        state.addDuration = clamp(Math.round(ms), 50, 3000);
        syncSelectedAdd();
        updateAddInline();
      }
    });

    body.addEventListener('change', function (event) {
      var id = event.target && event.target.id;
      if (id === 'selectionLabel') {
        if (!state.selection) return;
        state.label = event.target.value;
        syncSelectedDraft();
        updateMoveInline();
        commitLabel();
        return;
      }
      if (id === 'addHint') {
        state.addHint = addHintOf({ hint: event.target.value });
        syncSelectedAdd();
        updateAddInline();
        renderLeft();
        commitAddField();
        return;
      }
      if (id === 'addAnimation') {
        state.addAnimation = addAnimationOf({ animation: event.target.value });
        syncSelectedAdd();
        /* Close the undo step BEFORE the rebuild: rebuilding drops the focused
           control, so the pending snapshot must be consumed first. */
        commitAddField();
        /* Rebuild so Duration and Easing enable/disable together. */
        renderInspector();
        renderLeft();
        return;
      }
      if (id === 'addDuration') {
        state.addDuration = addDurationOf({ duration: Number(event.target.value) });
        syncSelectedAdd();
        var node = event.target;
        node.value = String(state.addDuration);
        updateAddInline();
        commitAddField();
        return;
      }
      if (id === 'addEasing') {
        state.addEasing = addEasingOf({ easing: event.target.value });
        syncSelectedAdd();
        updateAddInline();
        commitAddField();
      }
    });

    body.addEventListener('focusout', function (event) {
      var id = event.target && event.target.id;
      if (id === 'selectionLabel') { commitLabel(); return; }
      if (id && id.indexOf('add') === 0) commitAddField();
    });

    document.addEventListener('keydown', function (event) {
      var writing = event.target && event.target.matches &&
        event.target.matches('input,textarea,select,[contenteditable]');
      var mod = event.ctrlKey || event.metaKey;
      if (mod && !event.altKey) {
        var key = String(event.key).toLowerCase();
        if (key === 'z') {
          event.preventDefault();
          if (event.shiftKey) redo(); else undo();
          return;
        }
        if (key === 'y') {
          event.preventDefault();
          redo();
          return;
        }
      }
      if (event.key === 'Escape') {
        /* Esc drops the transient selection; the drafts themselves stay. */
        if (state.mode === 'add' && (state.addSelection || state.drawRect)) {
          state.addSelection = null;
          state.addSelected = null;
          state.drawRect = null;
          render();
          return;
        }
        if (state.selectedBox !== null) {
          state.selectedBox = null;
          render();
          return;
        }
        if (state.mode === 'move' && state.selection) {
          state.selection = null;
          state.offset = { dx: 0, dy: 0 };
          state.selectedDraft = null;
          state.drawRect = null;
          render();
          return;
        }
      }
      if (writing || (state.mode !== 'move' && state.mode !== 'add')) return;
      if (mod || event.altKey) return;
      var tool = TOOL_KEYS[state.mode === 'add' ? 'add' : 'move'][String(event.key).toLowerCase()];
      if (tool) {
        event.preventDefault();
        setTool(tool);
      }
    });

    var timer = null;
    window.addEventListener('resize', function () {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { renderStage(); renderStatusbar(); }, 90);
    });
  }

  function setPrecision(value) {
    if (state.precision === value) return;
    var before = state.selection ? snapshotState() : null;
    state.precision = value;
    if (state.selection) syncSelectedDraft();
    if (before) commitHistory(before);
    render();
    toast(value === 'exact' ? 'Exact · 2 px' : 'Approx · 8 px');
  }

  loadReport();
  initEvents();
  render();
  window.addEventListener('load', function () { renderStage(); renderStatusbar(); });
})();
</script>
</body>
</html>
