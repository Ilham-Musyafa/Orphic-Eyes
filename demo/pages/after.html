<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>Lumen Demo</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
body { background: #f7f8fa; color: #202b3c; font-family: Arial, Helvetica, sans-serif; }
header { position: absolute; left: 80px; top: 40px; width: 1120px; height: 60px; border-bottom: 1px solid #dce1e8; }
.logo { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
h1 { position: absolute; left: 104px; top: 170px; margin: 0; font-size: 48px; line-height: 58px; letter-spacing: -1.5px; }
.subline { position: absolute; left: 104px; top: 250px; margin: 0; color: #6d7b8f; font-size: 20px; line-height: 30px; }
button { position: absolute; width: 160px; height: 52px; padding: 0; border: 3px solid #172d44; border-radius: 8px; font: 700 20px Arial, Helvetica, sans-serif; }
.primary { left: 224px; top: 340px; background: #254a70; color: white; }
.secondary { left: 104px; top: 480px; background: #ffffff; color: #172d44; }
.card { position: absolute; left: 880px; top: 500px; width: 320px; height: 160px; padding: 18px 20px; border: 3px solid #172d44; border-radius: 12px; background: #ffffff; }
.card h2 { margin: 0 0 8px; font-size: 28px; line-height: 34px; letter-spacing: -0.5px; }
.card p { margin: 0; font-size: 22px; font-weight: 700; line-height: 30px; color: #254a70; }
</style>
</head>
<body>
<header><span class="logo">Lumen Demo</span></header>
<main>
<h1>Plan your week in one place</h1>
<p class="subline">A clear view of your tasks, notes, and time.</p>
<button class="primary" type="button">Start trial</button>
<button class="secondary" type="button">See pricing</button>
<aside class="card"><h2>Summer bonus</h2><p>Get 80% rewards<br>Build a fresh routine</p></aside>
</main>
</body>
</html>
