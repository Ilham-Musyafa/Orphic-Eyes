name: orphic-eyes
title: Orphic Eyes
repo: https://github.com/Ilham-Musyafa/orphic-eyes
sha: "0000000000000000000000000000000000000000"
description: >-
  Pixel-only screenshot review for Hermes: capture URL pairs, inspect changed
  zones, prepare coding-agent requests and run bounded follow-up review rounds.
  Disclosure: launches an installed headless browser; captured pages can load
  network resources and redirects. Stores screenshots/reports locally, reads
  explicit input pages/images and browser/runtime files, and optionally serves
  reports read-only on loopback until stopped. No telemetry or credential-store
  access; prompts are returned, never sent or executed by the plugin.
maintainer: Ilham-Musyafa
tier: community
category: tools
version: "0.3.0"
docs_url: https://github.com/Ilham-Musyafa/orphic-eyes#readme
readme: true
# Only Linux Chrome has automated coverage.
platforms: [linux]
# TODO (Ilham): use [linux, windows] ONLY after docs/WINDOWS-TEST.md passes
# on the exact final pinned commit; do not advertise Windows before that.
# requires_hermes omitted: no tested Hermes minimum version is established.
# TODO: add pinned final-release screenshots/video documentation when available.
known_issues:
  - Draft pin is a placeholder; this entry is not installable or submitted.
  - Final combined engine/UI release must pass hermes plugins validate with --install-deps.
  - Requires Python 3.12 or newer, Pillow and an installed Edge/Chrome/Chromium browser.
  - Windows, macOS and a live Hermes host are not covered by automated verification.
  - Release-only UI features must be included in the selected final commit; Content check is unconfirmed.
  - Public DNS and proxy rules can block capture; login walls and dynamic pages can affect pixels.
capabilities:
  provides_tools:
    - orphic_baseline
    - orphic_compare
    - orphic_loop_step
    - orphic_approve
    - orphic_accept
    - orphic_ignore
  provides_hooks: []
  provides_middleware: []
  requires_env: []
