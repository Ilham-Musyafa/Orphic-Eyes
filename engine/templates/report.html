<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Orphic Eyes — Report</title>
<style>
:root{color-scheme:light;--bg:#f6f6f4;--panel:#ffffff;--surface:#f1f1ef;--soft:#fafaf8;--line:#e6e5e1;--line2:#d9d9d5;--ink:#202023;--muted:#797b80;--faint:#a6a7ab;--bronze:#c58b3e;--bronze-ink:#99671f;--blue:#2f80ff;--blue-bg:#f5f9ff;--blue-line:#c9ddfa;--guide:#e5359b;--green:#188951;--green-bg:#e7f6ed;--amber:#b45309;--amber-bg:#fdf3e2;--amber-line:#f0d9b5;--red:#c63d42;--red-bg:#feeeee;--r:12px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-synthesis:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}
.app{height:100%;display:flex;flex-direction:column;min-height:0;background:var(--bg)}

/* top bar */
.topbar{flex:0 0 54px;height:54px;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:none}
.logo-wrap{width:34px;height:35px;flex:none;background:#1B1B19;border-radius:8px;padding:4px;display:flex;align-items:center;justify-content:center}
.logo-wrap svg{display:block;width:100%;height:100%}
.brand-text{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.brand-name{font-size:15px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.tagline{font-size:11px;color:var(--muted);white-space:nowrap}
.topbar-center{display:flex;align-items:center;gap:12px;flex:1;justify-content:center;min-width:0}
.topbar-right{display:flex;align-items:center;gap:8px;flex:none}

/* segmented controls */
.seg{display:inline-flex;align-items:center;padding:3px;gap:2px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.seg button{position:relative;border:0;background:transparent;min-height:28px;padding:4px 15px;border-radius:6px;white-space:nowrap;color:#686a6f;font-size:12px}
.seg button:hover:not(.on){background:#e7e7e4}
.seg button.on{background:#fff;color:var(--ink);font-weight:650;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.seg button.on::after{content:"";position:absolute;left:9px;right:9px;bottom:-4px;height:2px;border-radius:2px;background:var(--ink);opacity:.5}
#modeSwitch button.on::after{background:var(--bronze);opacity:1}

.btn{border:1px solid var(--line2);background:var(--panel);padding:6px 11px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;min-height:30px;white-space:nowrap;font-size:12px}
.btn:hover:not(:disabled){background:#f6f5f2;border-color:#c8c7c2}
.btn.ghost{border-color:transparent;background:transparent;color:#5b5c62}
.btn.ghost:hover:not(:disabled){background:#f1f0ed}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:#fff;font-weight:650;padding:7px 14px}
.btn.primary:hover:not(:disabled){background:#b87927;border-color:#b87927}
.history{display:flex;align-items:center;gap:3px;border-left:1px solid var(--line);padding-left:11px}

/* subbar */
.subbar{flex:0 0 52px;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;background:var(--soft);border-bottom:1px solid var(--line);min-width:0}
.subbar-left,.subbar-right{display:flex;align-items:center;gap:10px;min-width:0}
.status-chip{display:inline-flex;align-items:center;gap:6px;border-radius:7px;padding:5px 9px;background:#f0f2ef;color:#49594f;font-size:12px;white-space:nowrap}
.status-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:#8b9a90}
.status-chip.pass{background:var(--green-bg);color:var(--green)}
.status-chip.pass::before{background:var(--green)}
.status-chip.check{background:var(--amber-bg);color:var(--amber)}
.status-chip.check::before{background:#d99a2b}
.status-chip.fail{background:var(--red-bg);color:var(--red)}
.status-chip.fail::before{background:var(--red)}
.note{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);white-space:nowrap}
.ctl select{border:1px solid var(--line2);background:#fff;color:var(--ink);border-radius:8px;padding:6px 9px;min-height:30px;font-size:12px;max-width:190px}

/* layout */
.layout{flex:1;min-height:0;display:grid;grid-template-columns:clamp(208px,19.5vw,258px) minmax(0,1fr) clamp(248px,22.5vw,300px);overflow:hidden;background:var(--bg)}
.leftpanel,.inspector{min-width:0;min-height:0;background:var(--panel);display:flex;flex-direction:column;overflow:hidden}
.leftpanel{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
.panel-section{border-bottom:1px solid var(--line);min-height:0;flex:none;display:flex;flex-direction:column}
.section-head{width:100%;border:0;background:var(--panel);padding:10px 12px;font-weight:650;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:12px;color:var(--ink)}
.section-content{padding:0 9px 9px;min-height:0}
.list-section{flex:1;min-height:0;border-bottom:0}
.list-section .section-content{flex:1;min-height:0;overflow:auto;padding-bottom:12px}
.count-pill{font-size:10px;font-weight:650;color:#555;background:var(--surface);border-radius:6px;padding:2px 6px;min-width:20px;text-align:center}

/* pages */
.page-item{display:flex;align-items:center;gap:9px;padding:6px 7px;border:1px solid transparent;border-radius:8px;min-height:37px;cursor:pointer;width:100%;background:transparent;text-align:left}
.page-item:hover{background:#f6f6f4}
.page-item.active{background:#f4f4f1;border-color:var(--line2)}
.page-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:#b5b7bb;flex:none}
.dot.pass{background:var(--green)}
.dot.check{background:#d99a2b}
.dot.fail{background:var(--red)}

/* area map */
.zone-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.zone-cell{border:1px solid var(--line);border-radius:5px;background:#fbfbfa;min-height:40px;display:flex;align-items:center;justify-content:center;padding:3px 2px;font-size:9px;line-height:1.15;color:#7a7e82;text-align:center;cursor:pointer;position:relative}
.zone-cell:hover{border-color:#a4b8cf}
.zone-cell.hit{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.zone-cell.selected{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:#f1f6ff;color:#2665b9}

/* lists */
.list-item{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:9px;padding:7px 8px;cursor:pointer;background:#fff;margin-bottom:6px;text-align:left;width:100%}
.list-item:hover{background:#fcfbf8}
.list-item.selected{background:var(--blue-bg);border-color:var(--blue-line)}
.list-item.zone-hit{box-shadow:inset 2px 0 0 var(--blue)}
.line1{display:flex;gap:6px;align-items:center;font-size:12px;min-width:0}
.id-pill{flex:none;min-width:26px;min-height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:650;color:#555;background:var(--surface);border-radius:6px}
.list-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.list-sub{font-size:11px;color:var(--muted);line-height:1.35;padding-left:32px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;border-radius:5px;padding:2px 6px;font-size:10px;font-weight:650;white-space:nowrap;flex:none}
.chip.approved,.chip.done{background:var(--green-bg);color:var(--green)}
.chip.expected{background:#edf4ff;color:#2467c2}
.chip.unexpected,.chip.check{background:var(--amber-bg);color:var(--amber)}
.chip.not_done,.chip.fail{background:var(--red-bg);color:var(--red)}
.chip.unknown,.chip.skipped,.chip.draft{background:#eeeef0;color:#74777e}
.guide{display:flex;flex-direction:column;gap:8px;padding:14px 6px;color:var(--muted);text-align:center;font-size:11px}
.guide strong{font-size:12px;color:var(--ink);font-weight:650}
.guide ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;text-align:left}
.guide li{display:flex;gap:7px;align-items:baseline}
.guide li b{color:var(--ink);font-size:10px;background:var(--surface);border-radius:5px;padding:1px 5px;flex:none}

/* center */
.centerpanel{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface);position:relative;overflow:hidden}
.review-bar{flex:0 0 44px;height:44px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--soft);min-width:0}
.review-bar .seg button{padding:4px 11px;font-size:11px}
.review-bar .note{font-size:11px}
.stage-scroller{flex:1;min-height:0;min-width:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:18px}
.stage-inner{display:flex;flex-direction:column;align-items:center;gap:9px;flex:none}
.stage-inner.mode-move{cursor:crosshair}
.stage-inner.mode-add{cursor:cell}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:6;background:#ffffffe0;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:11px;color:#5f6166;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:flex;gap:10px;align-items:flex-start}
.half{position:relative;background:#fff;border:1px solid #ddddda;border-radius:8px;overflow:hidden;box-shadow:0 2px 10px rgba(37,39,45,.06);flex:none}
.half img{display:block;width:100%;height:100%;object-fit:fill}
.tag{position:absolute;top:6px;left:6px;z-index:4;background:#ffffffdd;border:1px solid #ececec;border-radius:6px;padding:2px 7px;font-size:10px;font-weight:650;color:#4a4b50}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;background:#fff;border:1px dashed var(--line2);border-radius:10px;color:var(--muted);font-size:11px;text-align:center;padding:26px;min-width:260px;min-height:150px}
.placeholder strong{font-size:13px;color:var(--ink);font-weight:650}
.img-missing{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#f3f3f1 8px,#f3f3f1 16px);color:var(--faint);font-size:11px}

/* inspector */
.inspector-header{padding:13px 13px 11px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.inspector-header h2{margin:0;font-size:14px;font-weight:700;letter-spacing:-.15px}
.summary-card{flex:none;display:flex;align-items:center;gap:8px;padding:10px 11px;margin:11px 11px 0;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:650;min-height:42px}
.summary-card .mark{font-size:14px;flex:none;width:18px;text-align:center}
.summary-card.pass{color:var(--green);border-color:#cde9d9;background:var(--green-bg)}
.summary-card.check{color:var(--amber);border-color:#eddfc2;background:var(--amber-bg)}
.summary-card.fail{color:var(--red);border-color:#f3d3d4;background:var(--red-bg)}
.inspector-body{flex:1;min-height:0;overflow:auto;padding:11px}
.block{margin:0 0 14px}
.caption{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:#8b8d92;margin:0 0 7px}
.detail{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 9px;font-size:12px;border-bottom:1px solid var(--line);background:#fff}
.row:last-child{border-bottom:0}
.row span:first-child{color:var(--muted);font-size:11px}
.row strong{font-weight:650}
.empty-note{color:var(--muted);font-size:11px;line-height:1.45}

/* statusbar */
.statusbar{flex:0 0 27px;height:27px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px;border-top:1px solid var(--line);background:var(--soft);color:#73767b;font-size:11px;white-space:nowrap;min-width:0}
.statusbar>div{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sep{width:1px;height:12px;background:var(--line2);flex:none}

/* popover + toast */
.pop{position:fixed;z-index:40;width:250px;padding:11px;border-radius:11px;border:1px solid var(--line2);background:#fff;box-shadow:0 10px 30px rgba(0,0,0,.16);font-size:12px}
.pop strong{display:block;font-size:12px;font-weight:700;margin-bottom:4px}
.pop p{margin:0 0 9px;color:#62646a;line-height:1.4;font-size:11px}
.pop-actions{display:flex;gap:6px}
.pop-actions .btn{flex:1;justify-content:center;font-size:11px;min-height:28px;padding:4px 8px}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);z-index:50;background:#262626;color:#fff;border-radius:9px;padding:9px 16px;box-shadow:0 5px 25px rgba(0,0,0,.2);font-weight:600;font-size:12px;opacity:0;pointer-events:none;transition:opacity .15s ease}
.toast.show{opacity:1}

@media(max-width:1300px){
  .brand .tagline{display:none}
  .ctl select{max-width:158px}
}
</style>
</head>

      <button type="button" class="btn primary" id="copyMain">Copy for Hermes</button>
    </div>
  </header>

  <section class="subbar">
    <div class="subbar-left">
      <span class="status-chip" id="readiness">Draft</span>
      <span class="note">Image only · pixels, not page code</span>
    </div>
    <div class="subbar-right">
      <label class="ctl" for="captureSize">Capture
        <select id="captureSize">
          <option value="1280x720">Desktop 1280x720</option>
          <option value="1440x900">Laptop 1440x900</option>
          <option value="1920x1080">Full HD 1920x1080</option>
          <option value="768x1024">Tablet 768x1024</option>
          <option value="390x844">Mobile 390x844</option>
          <option value="custom">Custom</option>
        </select>
      </label>
      <label class="ctl" for="zoomSelect">Zoom
        <select id="zoomSelect">
          <option value="fit">Fit</option>
          <option value="0.5">50%</option>
          <option value="1">100%</option>
          <option value="2">200%</option>
        </select>
      </label>
    </div>
  </section>

  <main class="layout">

    <aside class="leftpanel" aria-label="Pages, area map and list">
      <section class="panel-section" id="pagesSection">
        <div class="section-head">Pages</div>
        <div class="section-content" id="pageList"></div>
      </section>
      <section class="panel-section" id="mapSection">
        <div class="section-head">Area map</div>
        <div class="section-content"><div class="zone-grid" id="zoneGrid"></div></div>
      </section>
      <section class="panel-section list-section" id="listSection">
        <div class="section-head"><span id="listTitle">Changes</span><span class="count-pill" id="listCount">0</span></div>
        <div class="section-content" id="leftList"></div>
      </section>
    </aside>

    <section class="centerpanel" aria-label="Image stage">
      <div class="review-bar">
        <div class="seg" id="viewSwitch" role="group" aria-label="Review view">
          <button type="button" data-view="side" class="on" aria-pressed="true">Side by side</button>
          <button type="button" data-view="slider" aria-pressed="false">Slider</button>
          <button type="button" data-view="overlay" aria-pressed="false">Overlay</button>
          <button type="button" data-view="diff" aria-pressed="false">Diff</button>
        </div>
        <span class="note" id="reviewNote"></span>
      </div>
      <div class="stage-scroller" id="stageScroller">
        <div class="stage-inner" id="stageInner"></div>
      </div>
      <div class="hint" id="stageHint"></div>
    </section>

    <aside class="inspector" aria-label="Inspector">
      <div class="inspector-header">
        <h2 id="inspectorTitle">Changes</h2>
        <span class="chip unknown" id="inspectorChip">—</span>
      </div>
      <div class="summary-card" id="summaryCard"><span class="mark">•</span><span id="summaryText">No report loaded</span></div>
      <div class="inspector-body">
        <div class="block">
          <div class="caption" id="changeListCaption">Changed areas</div>
          <div id="changeList"><p class="empty-note">No changed areas.</p></div>
        </div>
        <div class="block" id="detailBlock" hidden>
          <div class="caption">Selected area</div>
          <div class="detail" id="detailRows"></div>
        </div>
      </div>
    </aside>

  </main>

  <footer class="statusbar">
    <div>
      <span id="sbCapture">Capture —</span>
      <span class="sep"></span>
      <span id="sbZoom">Zoom Fit</span>
    </div>
    <div><span id="sbPrecision">Exact 2 px · Approx 8 px</span></div>
  </footer>

</div>

<div class="pop" id="changePop" hidden>
  <strong id="popTitle">Change</strong>
  <p id="popInfo"></p>
  <div class="pop-actions">
    <button type="button" class="btn" id="popApprove">Approve</button>
    <button type="button" class="btn" id="popCopy">Copy fix message</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!--ORPHIC_REPORT_JSON-->

<script>
(function () {
  'use strict';

  var ZONES = ['top-left', 'top-center', 'top-right', 'middle-left', 'center', 'middle-right', 'bottom-left', 'bottom-center', 'bottom-right'];
  var ZONE_LABEL = {
    'top-left': 'Top left', 'top-center': 'Top center', 'top-right': 'Top right',
    'middle-left': 'Middle left', 'center': 'Center', 'middle-right': 'Middle right',
    'bottom-left': 'Bottom left', 'bottom-center': 'Bottom center', 'bottom-right': 'Bottom right'
  };
  var STATUS_TEXT = { pass: '\u2713 Looks the same', check: '\u26a0 Check these changes', fail: '\u2715 Big change detected' };
  var PRESETS = [
    { id: '1280x720', label: 'Desktop 1280x720', w: 1280, h: 720 },
    { id: '1440x900', label: 'Laptop 1440x900', w: 1440, h: 900 },
    { id: '1920x1080', label: 'Full HD 1920x1080', w: 1920, h: 1080 },
    { id: '768x1024', label: 'Tablet 768x1024', w: 768, h: 1024 },
    { id: '390x844', label: 'Mobile 390x844', w: 390, h: 844 }
  ];
  var VIEW_PLACEHOLDER = {
    slider: 'Slider view arrives in a later round.',
    overlay: 'Overlay view arrives in a later round.',
    diff: 'Diff view arrives in a later round.'
  };

  function $(sel) { return document.querySelector(sel); }
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }
  function esc(value) { return String(value); }

  var state = {
    mode: 'review',
    view: 'side',
    zoom: 'fit',
    scale: 1,
    capture: { w: 1280, h: 720, preset: '1280x720' },
    report: null,
    changes: [],
    selectedId: null,
    zone: null,
    toastTimer: null
  };

  /* ---------- report loading ---------- */
  /* Built at runtime so the template's placeholder literal stays unique in the file. */
  var PLACEHOLDER_TOKEN = ['ORPHIC', 'REPORT', 'JSON'].join('_');

  function readReport() {
    var node = document.getElementById('orphic-report');
    if (!node) return { ok: false, reason: 'No report loaded' };
    var raw = node.textContent || '';
    if (!raw || raw.indexOf(PLACEHOLDER_TOKEN) !== -1) return { ok: false, reason: 'No report loaded' };
    var data;
    try { data = JSON.parse(raw); } catch (err) { return { ok: false, reason: 'Report data could not be read' }; }
    if (!data || typeof data !== 'object' || Array.isArray(data)) return { ok: false, reason: 'Report data could not be read' };
    if (data.schema_version !== 1) return { ok: false, reason: 'Unsupported report version' };
    return { ok: true, data: data };
  }

  function changeStatus(box) {
    if (!box) return 'unknown';
    if (box.approved === true) return 'approved';
    if (box.label === 'expected') return 'expected';
    if (box.label === 'approved') return 'approved';
    return 'unexpected';
  }

  function zoneLabel(zone) { return ZONE_LABEL[zone] || String(zone || '\u2014'); }
  function num(value) { return typeof value === 'number' && isFinite(value) ? value : null; }
  function pct(value) {
    var n = num(value);
    if (n === null) return '\u2014';
    return (Math.round(n * 1000) / 1000) + '%';
  }

  function loadReport() {
    var result = readReport();
    if (!result.ok) {
      state.report = null;
      state.changes = [];
      return;
    }
    var report = result.data;
    state.report = report;
    state.changes = (Array.isArray(report.boxes) ? report.boxes : []).map(function (box, index) {
      return {
        id: box && box.id !== undefined && box.id !== null ? box.id : (index + 1),
        x: num(box && box.x), y: num(box && box.y), w: num(box && box.w), h: num(box && box.h),
        zone: (box && box.zone) || null,
        percent: num(box && box.percent),
        approved: !!(box && box.approved === true),
        label: (box && box.label) || null,
        shift: box && box.shift ? box.shift : null
      };
    });
    var size = report.size || {};
    if (num(size.width) && num(size.height)) {
      setCaptureFromSize(size.width, size.height);
    }
  }

  function setCaptureFromSize(w, h) {
    state.capture = { w: w, h: h, preset: 'custom' };
    var match = null;
    for (var i = 0; i < PRESETS.length; i++) {
      if (PRESETS[i].w === w && PRESETS[i].h === h) { match = PRESETS[i]; break; }
    }
    state.capture.preset = match ? match.id : 'custom';
    var select = $('#captureSize');
    if (select) select.value = state.capture.preset;
  }

  /* ---------- copy helpers ---------- */
  function writeClipboard(text) {
    var done = function () { toast('Copied'); };
    var fallback = function () {
      var ok = false;
      try {
        var area = document.createElement('textarea');
        area.value = text;
        area.setAttribute('readonly', 'readonly');
        area.style.position = 'fixed';
        area.style.top = '-1000px';
        area.style.opacity = '0';
        document.body.appendChild(area);
        area.select();
        area.setSelectionRange(0, area.value.length);
        ok = document.execCommand('copy');
        document.body.removeChild(area);
      } catch (err) { ok = false; }
      if (ok) toast('Copied');
      else toast('Copy unavailable \u2014 select the text instead');
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  function toast(message) {
    var node = $('#toast');
    if (!node) return;
    node.textContent = message;
    node.classList.add('show');
    if (state.toastTimer) clearTimeout(state.toastTimer);
    state.toastTimer = setTimeout(function () { node.classList.remove('show'); }, 1500);
  }

  function hermesText() {
    var report = state.report;
    if (!report) return 'Orphic Eyes: no report loaded.';
    var summary = report.summary || {};
    var zones = [];
    state.changes.forEach(function (change) {
      var label = zoneLabel(change.zone);
      if (change.zone && zones.indexOf(label) === -1) zones.push(label);
    });
    var lines = ['[Orphic Eyes] ' + esc(report.name || 'report')];
    lines.push('Status: ' + esc(report.status || 'unknown') + ' \u00b7 ' + state.changes.length + ' changed area(s) \u00b7 ' + pct(summary.changed_percent) + ' changed');
    if (zones.length) lines.push('Areas: ' + zones.join(', '));
    lines.push('Please fix the unexpected changes without altering approved areas.');
    return lines.join('\n');
  }

  function fixText(change) {
    if (!change) return '';
    var lines = ['[Orphic Eyes] Fix visual change ' + esc(change.id)];
    lines.push('Area: ' + zoneLabel(change.zone));
    lines.push('Position: ' + fmtPoint(change) + ' \u00b7 Size: ' + fmtSize(change));
    lines.push('Changed: ' + pct(change.percent));
    lines.push('Please fix only this area and rerun the screenshot comparison.');
    return lines.join('\n');
  }

  function fmtPoint(change) {
    if (change.x === null || change.y === null) return '\u2014';
    return change.x + ', ' + change.y;
  }
  function fmtSize(change) {
    if (change.w === null || change.h === null) return '\u2014';
    return change.w + ' \u00d7 ' + change.h;
  }

  /* ---------- rendering ---------- */
  function render() {
    renderStatus();
    renderPages();
    renderZones();
    renderLeftList();
    renderStage();
    renderInspector();
    renderModeChrome();
    renderStatusbar();
    renderPopover();
  }

  function renderStatus() {
    var chip = $('#readiness');
    var report = state.report;
    chip.className = 'status-chip';
    if (!report) { chip.textContent = 'Draft'; return; }
    var status = report.status;
    chip.textContent = status === 'pass' ? 'Pass' : status === 'check' ? 'Check' : status === 'fail' ? 'Fail' : 'Draft';
    if (STATUS_TEXT[status]) chip.classList.add(status);
  }

  function renderPages() {
    var list = $('#pageList');
    list.innerHTML = '';
    var report = state.report;
    var item = el('button', 'page-item active');
    item.type = 'button';
    item.appendChild(el('span', 'page-name', report ? esc(report.name || 'report') : 'No target'));
    var dot = el('span', 'dot' + (report && STATUS_TEXT[report.status] ? ' ' + report.status : ''));
    item.appendChild(dot);
    list.appendChild(item);
  }

  function renderZones() {
    var grid = $('#zoneGrid');
    grid.innerHTML = '';
    var hits = {};
    state.changes.forEach(function (change) { if (change.zone) hits[change.zone] = true; });
    ZONES.forEach(function (zone) {
      var cell = el('button', 'zone-cell' + (hits[zone] ? ' hit' : '') + (state.zone === zone ? ' selected' : ''), ZONE_LABEL[zone]);
      cell.type = 'button';
      cell.setAttribute('data-zone', zone);
      cell.title = ZONE_LABEL[zone];
      grid.appendChild(cell);
    });
  }

  function requestRows() {
    var report = state.report;
    if (!report) return [];
    var results = Array.isArray(report.request_results) ? report.request_results : [];
    return results.map(function (result) {
      return {
        id: result && result.id ? result.id : 'PT-?',
        status: result && result.status ? result.status : 'unknown',
        why: result && result.why ? result.why : ''
      };
    });
  }

  function isSelected(change) {
    return state.selectedId !== null && state.selectedId !== undefined && String(state.selectedId) === String(change.id);
  }

  function changeRow(change) {
    var row = el('button', 'list-item' + (isSelected(change) ? ' selected' : '') + (state.zone && state.zone === change.zone ? ' zone-hit' : ''));
    row.type = 'button';
    row.setAttribute('data-change', String(change.id));
    var line = el('div', 'line1');
    line.appendChild(el('span', 'id-pill', change.id));
    line.appendChild(el('span', 'list-name', zoneLabel(change.zone)));
    line.appendChild(el('span', 'chip ' + changeStatus(change), changeStatus(change)));
    row.appendChild(line);
    row.appendChild(el('div', 'list-sub mono', pct(change.percent) + ' changed'));
    return row;
  }

  function guideBlock() {
    var box = el('div', 'guide');
    box.appendChild(el('strong', null, state.mode === 'review' ? 'No changes to show' : 'No requests yet'));
    var steps = el('ol');
    ['1|Pick a mode', '2|Point at the image', '3|Copy for Hermes'].forEach(function (step) {
      var parts = step.split('|');
      var li = el('li');
      li.appendChild(el('b', null, parts[0]));
      li.appendChild(el('span', null, parts[1]));
      steps.appendChild(li);
    });
    box.appendChild(steps);
    return box;
  }

  function renderLeftList() {
    var holder = $('#leftList');
    var title = $('#listTitle');
    var count = $('#listCount');
    holder.innerHTML = '';
    title.textContent = state.mode === 'review' ? 'Changes' : 'Requests';
    if (!state.report) {
      count.textContent = '0';
      holder.appendChild(guideBlock());
      return;
    }
    if (state.mode === 'review') {
      count.textContent = String(state.changes.length);
      if (!state.changes.length) { holder.appendChild(guideBlock()); return; }
      state.changes.forEach(function (change) { holder.appendChild(changeRow(change)); });
      return;
    }
    var rows = requestRows();
    count.textContent = String(rows.length);
    if (!rows.length) { holder.appendChild(guideBlock()); return; }
    rows.forEach(function (row) {
      var node = el('button', 'list-item');
      node.type = 'button';
      var line = el('div', 'line1');
      line.appendChild(el('span', 'id-pill', row.id));
      line.appendChild(el('span', 'list-name', row.id));
      line.appendChild(el('span', 'chip ' + row.status, row.status));
      node.appendChild(line);
      node.appendChild(el('div', 'list-sub', row.why || '\u2014'));
      holder.appendChild(node);
    });
  }

  function imageNode(path, label) {
    if (!path) {
      var missing = el('div', 'img-missing', 'No ' + (label || 'image'));
      return missing;
    }
    var img = el('img');
    img.alt = label || '';
    img.src = path;
    img.addEventListener('error', function () {
      var box = el('div', 'img-missing', 'Image not available');
      if (img.parentNode) img.parentNode.replaceChild(box, img);
    });
    return img;
  }

  function stageSize() {
    var report = state.report;
    var size = report && report.size ? report.size : null;
    return {
      w: num(size && size.width) || state.capture.w || 1280,
      h: num(size && size.height) || state.capture.h || 720
    };
  }

  function scaleFor(totalW, totalH) {
    var scroller = $('#stageScroller');
    var availW = Math.max(120, (scroller ? scroller.clientWidth : 900) - 40);
    var availH = Math.max(120, (scroller ? scroller.clientHeight : 600) - 56);
    if (state.zoom === 'fit') {
      var scale = Math.min(availW / totalW, availH / totalH, 1);
      return Math.max(0.02, scale);
    }
    return Number(state.zoom);
  }

  function renderStage() {
    var inner = $('#stageInner');
    var hint = $('#stageHint');
    inner.innerHTML = '';
    inner.className = 'stage-inner mode-' + state.mode;
    var report = state.report;

    if (!report) {
      var empty = el('div', 'placeholder');
      empty.appendChild(el('strong', null, 'No report loaded'));
      empty.appendChild(el('span', null, 'This page has no embedded report data yet.'));
      inner.appendChild(empty);
      hint.textContent = 'Waiting for report data';
      state.scale = 1;
      return;
    }

    var size = stageSize();

    if (state.mode !== 'review') {
      hint.textContent = state.mode === 'move'
        ? 'Move mode: picking a box to move arrives in a later round.'
        : 'Add mode: drawing a new area arrives in a later round.';
      var single = el('div', 'half');
      var scaleSingle = scaleFor(size.w, size.h);
      single.style.width = Math.max(40, Math.round(size.w * scaleSingle)) + 'px';
      single.style.height = Math.max(30, Math.round(size.h * scaleSingle)) + 'px';
      single.appendChild(imageNode(report.images && report.images.after, 'after image'));
      inner.appendChild(single);
      state.scale = scaleSingle;
      return;
    }

    if (state.view !== 'side') {
      hint.textContent = VIEW_PLACEHOLDER[state.view] || '';
      var ph = el('div', 'placeholder');
      ph.appendChild(el('strong', null, state.view.charAt(0).toUpperCase() + state.view.slice(1) + ' view'));
      ph.appendChild(el('span', null, VIEW_PLACEHOLDER[state.view] || 'Not available yet.'));
      inner.appendChild(ph);
      state.scale = 1;
      return;
    }

    hint.textContent = state.changes.length
      ? state.changes.length + ' changed area(s) \u2014 click one to review it.'
      : 'No pixel differences beyond the threshold.';

    var pair = el('div', 'pair');
    var scale = scaleFor(size.w * 2 + 10, size.h);
    var width = Math.max(40, Math.round(size.w * scale));
    var height = Math.max(30, Math.round(size.h * scale));
    [['Before', report.images && report.images.before], ['After', report.images && report.images.after]].forEach(function (pairDef) {
      var half = el('div', 'half');
      half.style.width = width + 'px';
      half.style.height = height + 'px';
      half.appendChild(imageNode(pairDef[1], pairDef[0].toLowerCase() + ' image'));
      var tag = el('span', 'tag', pairDef[0]);
      half.appendChild(tag);
      pair.appendChild(half);
    });
    inner.appendChild(pair);
    state.scale = scale;
  }

  function renderInspector() {
    var card = $('#summaryCard');
    var text = $('#summaryText');
    var mark = card.querySelector('.mark');
    var title = $('#inspectorTitle');
    var chip = $('#inspectorChip');
    var list = $('#changeList');
    var caption = $('#changeListCaption');
    var detail = $('#detailBlock');
    var rows = $('#detailRows');
    var report = state.report;

    card.className = 'summary-card';
    list.innerHTML = '';
    detail.hidden = true;

    if (!report) {
      text.textContent = 'No report loaded';
      mark.textContent = '\u2022';
      title.textContent = 'Changes';
      chip.className = 'chip unknown';
      chip.textContent = '\u2014';
      caption.textContent = 'Changed areas';
      list.appendChild(el('p', 'empty-note', 'No changed areas.'));
      return;
    }

    var status = STATUS_TEXT[report.status] ? report.status : 'check';
    card.classList.add(status);
    text.textContent = STATUS_TEXT[status];
    mark.textContent = status === 'pass' ? '\u2713' : status === 'check' ? '\u26a0' : '\u2715';

    if (state.mode === 'review') {
      title.textContent = 'Changes';
      caption.textContent = 'Changed areas';
      var summary = report.summary || {};
      chip.className = 'chip ' + status;
      chip.textContent = String(state.changes.length) + ' area' + (state.changes.length === 1 ? '' : 's');
      if (!state.changes.length) {
        list.appendChild(el('p', 'empty-note', 'No changed areas. ' + pct(summary.changed_percent) + ' of pixels changed.'));
      } else {
        state.changes.forEach(function (change) {
          var row = el('button', 'list-item' + (isSelected(change) ? ' selected' : '') + (state.zone && state.zone === change.zone ? ' zone-hit' : ''));
          row.type = 'button';
          row.setAttribute('data-change', String(change.id));
          var line = el('div', 'line1');
          line.appendChild(el('span', 'id-pill', change.id));
          line.appendChild(el('span', 'list-name', zoneLabel(change.zone)));
          line.appendChild(el('span', 'chip ' + changeStatus(change), changeStatus(change)));
          row.appendChild(line);
          row.appendChild(el('div', 'list-sub mono', fmtSize(change) + ' \u00b7 ' + pct(change.percent)));
          list.appendChild(row);
        });
      }
      var selected = findChange(state.selectedId);
      if (selected) {
        detail.hidden = false;
        rows.innerHTML = '';
        appendRow(rows, 'Area', zoneLabel(selected.zone));
        appendRow(rows, 'Position', fmtPoint(selected));
        appendRow(rows, 'Size', fmtSize(selected));
        appendRow(rows, 'Changed', pct(selected.percent));
        appendRow(rows, 'Status', changeStatus(selected));
      }
      return;
    }

    title.textContent = state.mode === 'move' ? 'Move' : 'Add';
    caption.textContent = 'Image';
    chip.className = 'chip draft';
    chip.textContent = state.mode === 'move' ? 'Skeleton' : 'Skeleton';
    var size = stageSize();
    var note = el('p', 'empty-note');
    note.textContent = (state.mode === 'move'
      ? 'Move mode is a skeleton in this round. '
      : 'Add mode is a skeleton in this round. ') + 'Only size, position, area and status are shown here, from the image itself.';
    list.appendChild(note);
    var wrap = el('div', 'detail');
    appendRow(wrap, 'Image size', size.w + ' \u00d7 ' + size.h);
    appendRow(wrap, 'Area', state.zone ? zoneLabel(state.zone) : '\u2014');
    appendRow(wrap, 'Changes', String(state.changes.length));
    var spacer = el('div', 'block');
    spacer.appendChild(wrap);
    list.appendChild(spacer);
  }

  function appendRow(parent, label, value) {
    var row = el('div', 'row');
    row.appendChild(el('span', null, label));
    row.appendChild(el('strong', null, value));
    parent.appendChild(row);
  }

  function findChange(id) {
    if (id === null || id === undefined) return null;
    for (var i = 0; i < state.changes.length; i++) {
      if (String(state.changes[i].id) === String(id)) return state.changes[i];
    }
    return null;
  }

  function renderModeChrome() {
    var buttons = document.querySelectorAll('#modeSwitch button');
    for (var i = 0; i < buttons.length; i++) {
      var on = buttons[i].getAttribute('data-mode') === state.mode;
      buttons[i].classList.toggle('on', on);
      buttons[i].setAttribute('aria-pressed', on ? 'true' : 'false');
    }
    var reviews = document.querySelectorAll('#viewSwitch button');
    for (var j = 0; j < reviews.length; j++) {
      var active = reviews[j].getAttribute('data-view') === state.view;
      reviews[j].classList.toggle('on', active);
      reviews[j].setAttribute('aria-pressed', active ? 'true' : 'false');
    }
    var bar = document.querySelector('.review-bar');
    bar.style.display = state.mode === 'review' ? '' : 'none';
    $('#reviewNote').textContent = state.report
      ? (state.view === 'side' ? 'Before and after' : 'Placeholder in this round')
      : '';
  }

  function renderStatusbar() {
    /* The report's own image size is the truth; the preset only fills in before a report loads. */
    var report = state.report;
    var reportSize = report && report.size ? report.size : null;
    var w = num(reportSize && reportSize.width) || state.capture.w;
    var h = num(reportSize && reportSize.height) || state.capture.h;
    $('#sbCapture').textContent = 'Capture ' + w + 'x' + h;
    $('#sbZoom').textContent = 'Zoom ' + (state.zoom === 'fit' ? 'Fit' : Math.round(Number(state.zoom) * 100) + '%');
    $('#sbPrecision').textContent = 'Exact 2 px \u00b7 Approx 8 px';
  }

  function renderPopover() {
    var pop = $('#changePop');
    var change = findChange(state.selectedId);
    if (!change || state.mode !== 'review') { pop.hidden = true; return; }
    pop.hidden = false;
    $('#popTitle').textContent = 'Change ' + change.id + ' \u00b7 ' + zoneLabel(change.zone);
    $('#popInfo').textContent = fmtPoint(change) + ' \u00b7 ' + fmtSize(change) + ' \u00b7 ' + pct(change.percent) + ' changed';
    $('#popApprove').disabled = changeStatus(change) === 'approved';
    $('#popApprove').textContent = changeStatus(change) === 'approved' ? 'Approved' : 'Approve';
  }

  function placePopover(clientX, clientY) {
    var pop = $('#changePop');
    if (pop.hidden) return;
    var rect = pop.getBoundingClientRect();
    var left = clientX + 14;
    var top = clientY + 14;
    if (left + rect.width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - rect.width - 8);
    if (top + rect.height > window.innerHeight - 8) top = Math.max(8, clientY - rect.height - 12);
    pop.style.left = Math.round(left) + 'px';
    pop.style.top = Math.round(top) + 'px';
  }

  /* ---------- events ---------- */
  function selectChange(id, event) {
    state.selectedId = id;
    render();
    if (event) placePopover(event.clientX, event.clientY);
  }

  function approveSelected() {
    var change = findChange(state.selectedId);
    if (!change) return;
    change.approved = true;
    render();
    toast('Change ' + change.id + ' approved');
    var pop = $('#changePop');
    if (!pop.hidden && pop.style.left) placePopover(parseInt(pop.style.left, 10), parseInt(pop.style.top, 10));
  }

  function applyCapture(value) {
    var select = $('#captureSize');
    if (state.report) {
      /* This page shows one captured report; its image size cannot be changed here. */
      if (select) select.value = state.capture.preset;
      toast('Capture size comes from the report');
      return;
    }
    if (value === 'custom') {
      var current = stageSize();
      var inputW = window.prompt('Custom capture width (pixels)', String(current.w));
      if (inputW === null) { $('#captureSize').value = state.capture.preset; return; }
      var inputH = window.prompt('Custom capture height (pixels)', String(current.h));
      if (inputH === null) { $('#captureSize').value = state.capture.preset; return; }
      var w = Math.max(200, Math.min(3840, parseInt(inputW, 10) || current.w));
      var h = Math.max(200, Math.min(3840, parseInt(inputH, 10) || current.h));
      state.capture = { w: w, h: h, preset: 'custom' };
      renderStage();
      renderStatusbar();
      return;
    }
    for (var i = 0; i < PRESETS.length; i++) {
      if (PRESETS[i].id === value) {
        state.capture = { w: PRESETS[i].w, h: PRESETS[i].h, preset: PRESETS[i].id };
        renderStage();
        renderStatusbar();
        return;
      }
    }
  }

  function initEvents() {
    document.getElementById('modeSwitch').addEventListener('click', function (event) {
      var button = event.target.closest('[data-mode]');
      if (!button) return;
      state.mode = button.getAttribute('data-mode');
      state.selectedId = null;
      render();
      toast(state.mode === 'review' ? 'Review mode' : state.mode === 'move' ? 'Move mode' : 'Add mode');
    });

    document.getElementById('viewSwitch').addEventListener('click', function (event) {
      var button = event.target.closest('[data-view]');
      if (!button) return;
      state.view = button.getAttribute('data-view');
      render();
    });

    document.getElementById('zoneGrid').addEventListener('click', function (event) {
      var cell = event.target.closest('[data-zone]');
      if (!cell) return;
      var zone = cell.getAttribute('data-zone');
      state.zone = state.zone === zone ? null : zone;
      render();
      toast(state.zone ? 'Area: ' + zoneLabel(state.zone) : 'Area cleared');
    });

    ['#leftList', '#changeList'].forEach(function (selector) {
      document.querySelector(selector).addEventListener('click', function (event) {
        var row = event.target.closest('[data-change]');
        if (!row) return;
        selectChange(row.getAttribute('data-change'), event);
      });
    });

    document.getElementById('copyMain').addEventListener('click', function () {
      writeClipboard(hermesText());
    });

    document.getElementById('popApprove').addEventListener('click', approveSelected);
    document.getElementById('popCopy').addEventListener('click', function () {
      var change = findChange(state.selectedId);
      if (!change) return;
      writeClipboard(fixText(change));
    });

    document.getElementById('captureSize').addEventListener('change', function (event) {
      applyCapture(event.target.value);
    });

    document.getElementById('zoomSelect').addEventListener('change', function (event) {
      state.zoom = event.target.value;
      renderStage();
      renderStatusbar();
    });

    document.getElementById('undoBtn').addEventListener('click', function () { toast('Undo arrives in a later round'); });
    document.getElementById('redoBtn').addEventListener('click', function () { toast('Redo arrives in a later round'); });

    document.addEventListener('click', function (event) {
      var pop = $('#changePop');
      if (pop.hidden) return;
      if (event.target.closest('#changePop')) return;
      if (event.target.closest('[data-change]')) return;
      if (event.target.closest('#popApprove') || event.target.closest('#popCopy')) return;
      state.selectedId = null;
      render();
    });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        if (!$('#changePop').hidden) { state.selectedId = null; render(); }
      }
    });

    var timer = null;
    window.addEventListener('resize', function () {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function () { renderStage(); }, 90);
    });
  }

  loadReport();
  initEvents();
  render();
  window.addEventListener('load', function () { renderStage(); });
})();
</script>
</body>
</html>
