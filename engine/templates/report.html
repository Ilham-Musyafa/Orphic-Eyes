      var value = k * minor;
      if (value > capturePx) break;
      var pos = Math.round(value * scale * 10) / 10;
      var isMajor = k % 5 === 0;
      var tick = isMajor ? 11 : 4;
      if (horizontal) {
        parts.push('<line x1="' + pos + '" x2="' + pos + '" y1="' + (23 - tick) + '" y2="23"/>');
      } else {
        parts.push('<line y1="' + pos + '" y2="' + pos + '" x1="' + (23 - tick) + '" x2="23"/>');
      }
    }
    /* Close the ruler at the capture edge with a tick only; the end number is
       placed by the label pass, which knows whether it would collide. */
    if (capturePx % major !== 0) {
      var edge = Math.round(capturePx * scale * 10) / 10;
      if (horizontal) parts.push('<line x1="' + edge + '" x2="' + edge + '" y1="12" y2="23"/>');
      else parts.push('<line y1="' + edge + '" y2="' + edge + '" x1="12" x2="23"/>');
    }
    rulerLabels(capturePx, scale, length, horizontal).forEach(function (item) {
      if (horizontal) {
        var x = item.anchor === 'end' ? item.pos - 2 : item.pos + 2;
        parts.push('<text x="' + x + '" y="9"' +
          (item.anchor === 'end' ? ' text-anchor="end"' : '') + '>' + item.value + '</text>');
      } else {
        var y = item.anchor === 'end' ? item.pos - 2 : item.pos + 10;
        parts.push('<text x="2" y="' + y + '" transform="rotate(90 3 ' + y + ')"' +
          (item.anchor === 'end' ? ' text-anchor="end"' : '') + '>' + item.value + '</text>');
      }
    });
    var w = horizontal ? length : 23;
    var h = horizontal ? 23 : length;
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
      '" aria-hidden="true" fill="#82858b" stroke="#999ca1" stroke-width="0.7" ' +
      'font-size="var(--fs-ruler)" font-family="var(--font-mono)" preserveAspectRatio="none">' + parts.join('') + '</svg>';
  }

  function rulerHost(horizontal) {
    var found = document.querySelector(horizontal ? '#rulerTop' : '#rulerLeft');
    if (!found) return;
    var size = imageSize();
    var px = horizontal ? size.w : size.h;
    var shown = horizontal ? state.frameW : state.frameH;
    if (!shown || !px) { found.innerHTML = ''; return; }
    /* Scale from the same integer frame size the ruler box uses, so the last
       label lands exactly on the image edge at Fit and 50/100/200%. */
    found.innerHTML = rulerSvg(horizontal, px, shown / px);
  }

  /* ---------- move mode: overlay ---------- */
  function placeBox(node, rect, size) {
    node.style.left = (rect.x / size.w * 100) + '%';
    node.style.top = (rect.y / size.h * 100) + '%';
    node.style.width = (rect.w / size.w * 100) + '%';
    node.style.height = (rect.h / size.h * 100) + '%';
  }

  /* Guides are inset by half a pixel so a 1px line sits exactly on the capture
     pixel edge at any scale, and so its painted area is always inside the frame. */
  function guideV(layer, x, opts) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-guide v' + (opts && opts.dim ? ' dim' : ''));
    node.style.left = (x / size.w * 100) + '%';
    node.style.top = '0px';
    node.style.height = '100%';
    node.setAttribute('data-guide', (opts && opts.kind) || 'v');
    node.title = Math.round(x) + ' px';
    layer.appendChild(node);
    return node;
  }
  function guideH(layer, y, opts) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-guide h' + (opts && opts.dim ? ' dim' : ''));
    node.style.top = (y / size.h * 100) + '%';
    node.style.left = '0px';
    node.style.width = '100%';
    node.setAttribute('data-guide', (opts && opts.kind) || 'h');
    node.title = Math.round(y) + ' px';
    layer.appendChild(node);
    return node;
  }
  function measureH(layer, x1, x2, y) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-measure h');
    node.style.left = (Math.min(x1, x2) / size.w * 100) + '%';
    node.style.width = (Math.abs(x2 - x1) / size.w * 100) + '%';
    node.style.top = (y / size.h * 100) + '%';
    node.setAttribute('data-measure', 'dx');
    layer.appendChild(node);
    return node;
  }
  function measureV(layer, y1, y2, x) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-measure v');
    node.style.top = (Math.min(y1, y2) / size.h * 100) + '%';
    node.style.height = (Math.abs(y2 - y1) / size.h * 100) + '%';
    node.style.left = (x / size.w * 100) + '%';
    node.setAttribute('data-measure', 'dy');
    layer.appendChild(node);
    return node;
  }
  /* shiftX/shiftY are CSS offsets from the anchor, so a label never sits on top
     of the line it annotates and its centre stays hit-testable. */
  function tag(layer, cx, cy, text, cls, shiftX, shiftY) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-tag' + (cls ? ' ' + cls : ''), text);
    node.setAttribute('data-tag', cls || 'guide');
    /* Keep the label inside the frame so it is never clipped away. */
    var halfPctX = 42 / Math.max(1, state.frameW || 1) * 100;
    var halfPctY = 9 / Math.max(1, state.frameH || 1) * 100;
    node.style.left = clamp(cx / size.w * 100, halfPctX, 100 - halfPctX) + '%';
    node.style.top = clamp(cy / size.h * 100, halfPctY, 100 - halfPctY) + '%';
    if (shiftX) node.style.marginLeft = shiftX + 'px';
    if (shiftY) node.style.marginTop = shiftY + 'px';
    layer.appendChild(node);
    return node;
  }

  /* Guides describe both rectangles: dashed magenta lines from the ORIGINAL
     edges and the NEW edges to the image edges, with a px distance for dx and
     dy measured anchor to anchor. Duplicate edges are drawn once so each line
     keeps a real size and a hit-testable centre. */
  function paintGuides(layer, sel, offset, size) {
    var dx = Math.round(offset.dx);
    var dy = Math.round(offset.dy);
    var ghost = { x: sel.x + dx, y: sel.y + dy, w: sel.w, h: sel.h };
    var usedV = {};
    var usedH = {};
    function addV(x, dim) {
      var key = String(Math.round(x));
      if (usedV[key]) return;
      usedV[key] = true;
      guideV(layer, x, { dim: dim, kind: dim ? 'from-x' : 'to-x' });
    }
    function addH(y, dim) {
      var key = String(Math.round(y));
      if (usedH[key]) return;
      usedH[key] = true;
      guideH(layer, y, { dim: dim, kind: dim ? 'from-y' : 'to-y' });
    }
    /* New edges first: where an old edge lands on a new one the brighter line
       should be the one that stays on top. */
    addV(ghost.x, false); addV(ghost.x + ghost.w, false);
    addH(ghost.y, false); addH(ghost.y + ghost.h, false);
    addV(sel.x, true); addV(sel.x + sel.w, true);
    addH(sel.y, true); addH(sel.y + sel.h, true);

    /* Distance from the original anchor to the new anchor, in capture pixels.
       Both measures sit outside the rectangles so they never cover a guide. */
    var topY = Math.max(4, Math.min(sel.y, ghost.y) - 14);
    var leftX = Math.max(4, Math.min(sel.x, ghost.x) - 14);
    if (dx !== 0) {
      measureH(layer, sel.x, ghost.x, topY);
      tag(layer, (sel.x + ghost.x) / 2, topY, Math.abs(dx) + ' px', null, 0, -11);
    }
    if (dy !== 0) {
      measureV(layer, sel.y, ghost.y, leftX);
      tag(layer, leftX, (sel.y + ghost.y) / 2, Math.abs(dy) + ' px', null, 34, 0);
    }
    if (dx === 0 && dy === 0) {
      tag(layer, ghost.x + ghost.w / 2, Math.max(4, ghost.y - 14), '0 px', null, 0, -11);
    }
  }

  function paintOverlay() {
    var layer = document.getElementById('moveOverlay');
    if (!layer) return;
    var size = state.overlaySize || imageSize();
    layer.innerHTML = '';
    if (state.drawRect) {
      var drawing = el('div', 'move-sel');
      placeBox(drawing, state.drawRect, size);
      layer.appendChild(drawing);
      return;
    }
    var sel = state.selection;
    if (!sel) return;
    var rect = el('div', 'move-sel');
    placeBox(rect, sel, size);
    layer.appendChild(rect);

    var ghost = { x: sel.x + state.offset.dx, y: sel.y + state.offset.dy, w: sel.w, h: sel.h };
    var ghostNode = el('div', 'move-ghost');
    placeBox(ghostNode, ghost, size);
    ghostNode.appendChild(el('span', null, labelOf({ label: state.label })));
    layer.appendChild(ghostNode);

    /* Guides stay painted after mouseup: they belong to the selection, and are
       removed only when the selection, mode, or Esc changes. */
    paintGuides(layer, sel, state.offset, size);

    tag(layer, ghost.x + ghost.w / 2, ghost.y - 12,
      'x ' + Math.round(ghost.x) + ' y ' + Math.round(ghost.y), 'gray');
  }

  /* ---------- add mode: overlay ---------- */
  function paintAddOverlay() {
    var layer = document.getElementById('moveOverlay');
    if (!layer) return;
    var size = state.overlaySize || imageSize();
    layer.innerHTML = '';
    if (state.drawRect) {
      var drawing = el('div', 'add-sel');
      placeBox(drawing, state.drawRect, size);
      layer.appendChild(drawing);
      return;
    }
    var sel = state.addSelection;
    if (!sel) return;
    var selectedDraft = findAddDraft(state.addSelected);
    if (selectedDraft) {
      var original = el('div', 'add-ghost');
      placeBox(original, selectedDraft, size);
      layer.appendChild(original);
    }
    var rect = el('div', 'add-sel');
    placeBox(rect, sel, size);
    layer.appendChild(rect);
    /* Corner ticks make a thin/tall selection readable without hiding the image. */
    var label = addName({ label: state.addLabel });
    var node = el('div', 'add-tag', label + ' \u00b7 ' + Math.round(sel.w) + '\u00d7' + Math.round(sel.h));
    var halfPctX = 44 / Math.max(1, state.frameW || 1) * 100;
    var halfPctY = 9 / Math.max(1, state.frameH || 1) * 100;
    node.style.left = clamp((sel.x + sel.w / 2) / size.w * 100, halfPctX, 100 - halfPctX) + '%';
    node.style.top = clamp((sel.y - 12) / size.h * 100, halfPctY, 100 - halfPctY) + '%';
    node.setAttribute('data-add-tag', 'add');
    layer.appendChild(node);
  }

  /* ---------- move mode: pointer ---------- */
  function capturePoint(frame, clientX, clientY) {
    var rect = frame.getBoundingClientRect();
    var size = imageSize();
    if (!rect.width || !rect.height) return { x: 0, y: 0 };
    return {
      x: clamp((clientX - rect.left) / rect.width * size.w, 0, size.w),
      y: clamp((clientY - rect.top) / rect.height * size.h, 0, size.h)
    };
  }

  function insideRect(point, rect, pad) {
    var p = pad || 0;
    return point.x >= rect.x - p && point.x <= rect.x + rect.w + p &&
      point.y >= rect.y - p && point.y <= rect.y + rect.h + p;
  }

  function activeTool() { return state.mode === 'add' ? state.addTool : state.tool; }

  /* Topmost existing add area under the cursor, for the Select tool. */
  function addDraftAt(point) {
    for (var i = state.addDrafts.length - 1; i >= 0; i--) {
      var draft = state.addDrafts[i];
      if (insideRect(point, draft, 0)) return draft;
    }
    return null;
  }

  function setTool(tool) {
    if (state.mode === 'add') {
      state.addTool = tool === 'select' ? 'select' : tool === 'hand' ? 'hand' : 'place';
    } else {
      state.tool = tool;
    }
    state.drag = null;
    state.drawRect = null;
    renderChrome();
    if (state.mode === 'add') paintAddOverlay(); else paintOverlay();
    updateFrameCursor();
  }

  function updateFrameCursor() {
    var frame = document.getElementById('moveFrame');
    if (!frame) return;
    var cls = CURSOR_CLASS[activeTool()] || 'cursor-grab';
    frame.className = 'move-frame ' + cls;
  }

  function beginMoveDrag(event) {
    var frame = event.currentTarget;
    if (!state.report || event.button !== 0) return;
    var point = capturePoint(frame, event.clientX, event.clientY);
    var scroller = $('#stageScroller');
    if (activeTool() === 'hand') {
      state.drag = { kind: 'pan', x: event.clientX, y: event.clientY,
                     left: scroller ? scroller.scrollLeft : 0, top: scroller ? scroller.scrollTop : 0 };
      frame.className = 'move-frame cursor-grabbing';
      if (frame.setPointerCapture) { try { frame.setPointerCapture(event.pointerId); } catch (err) {} }
      event.preventDefault();
      return;
    }
    var sel = state.selection;
    var ghost = sel ? { x: sel.x + state.offset.dx, y: sel.y + state.offset.dy, w: sel.w, h: sel.h } : null;
    if (state.mode === 'add' && state.addTool !== 'hand') {
      if (state.addTool === 'select') {
        /* Select only picks an existing area; Place draws a new one. */
        var hit = addDraftAt(point);
        if (hit) { selectAddDraft(hit.id); return; }
        if (state.addSelection && insideRect(point, state.addSelection, 0)) {
          state.addSelected = null;
          renderInspector();
          return;
        }
        toast('Click an add area, or use Place (P)');
        return;
      }
      state.drag = { kind: 'add-select', start: point, before: snapshotState() };
      state.drawRect = { x: point.x, y: point.y, w: 0, h: 0 };
      paintAddOverlay();
      if (frame.setPointerCapture) { try { frame.setPointerCapture(event.pointerId); } catch (err) {} }
      event.preventDefault();
      return;
    }
    if (state.tool === 'move' && sel && (insideRect(point, sel, 0) || (ghost && insideRect(point, ghost, 0)))) {
      state.drag = { kind: 'move', start: point, base: { dx: state.offset.dx, dy: state.offset.dy },
                     before: snapshotState() };
      frame.className = 'move-frame cursor-grabbing';
      if (frame.setPointerCapture) { try { frame.setPointerCapture(event.pointerId); } catch (err) {} }
      event.preventDefault();
      return;
    }
    state.drag = { kind: 'select', start: point, before: snapshotState() };
    state.drawRect = { x: point.x, y: point.y, w: 0, h: 0 };
    paintOverlay();
    if (frame.setPointerCapture) { try { frame.setPointerCapture(event.pointerId); } catch (err) {} }
    event.preventDefault();
  }

  function moveMoveDrag(event) {
    var drag = state.drag;
    if (!drag) return;
    var frame = event.currentTarget;
    if (drag.kind === 'pan') {
      var scroller = $('#stageScroller');
      if (scroller) {
        scroller.scrollLeft = drag.left - (event.clientX - drag.x);
        scroller.scrollTop = drag.top - (event.clientY - drag.y);
      }
      return;
    }
    var point = capturePoint(frame, event.clientX, event.clientY);
    var size = imageSize();
    if (drag.kind === 'select' || drag.kind === 'add-select') {
      var x = Math.min(drag.start.x, point.x);
      var y = Math.min(drag.start.y, point.y);
      state.drawRect = {
        x: Math.round(x), y: Math.round(y),
        w: Math.round(Math.abs(point.x - drag.start.x)),
        h: Math.round(Math.abs(point.y - drag.start.y))
      };
      if (drag.kind === 'add-select') paintAddOverlay(); else paintOverlay();
      return;
    }
    var dx = drag.base.dx + (point.x - drag.start.x);
    var dy = drag.base.dy + (point.y - drag.start.y);
    if (state.axisLock || event.shiftKey) {
      if (Math.abs(dx - drag.base.dx) >= Math.abs(dy - drag.base.dy)) dy = drag.base.dy;
      else dx = drag.base.dx;
    }
    var sel = state.selection;
    var snappedX = snapPx(dx);
    var snappedY = snapPx(dy);
    var minX = -sel.x;
    var maxX = size.w - (sel.x + sel.w);
    var minY = -sel.y;
    var maxY = size.h - (sel.y + sel.h);
    state.offset = {
      dx: clamp(snappedX, minX, Math.max(minX, maxX)),
      dy: clamp(snappedY, minY, Math.max(minY, maxY))
    };
    paintOverlay();
    updateMoveInline();
  }

  function endMoveDrag(event) {
    var drag = state.drag;
    if (!drag) return;
    state.drag = null;
    var frame = event.currentTarget;
    if (frame && frame.className) updateFrameCursor();
    if (drag.kind === 'pan') return;
    if (drag.kind === 'add-select') {
      var addRect = state.drawRect;
      state.drawRect = null;
      if (addRect && addRect.w >= MIN_SELECT && addRect.h >= MIN_SELECT) {
        state.addSelection = addRect;
        state.addSelected = null;
        syncSelectedAdd();
        commitHistory(drag.before);
        render();
      } else {
        paintAddOverlay();
        if (addRect) toast('Select at least 8 \u00d7 8 px');
      }
      return;
    }
    if (drag.kind === 'select') {
      var rect = state.drawRect;
      state.drawRect = null;
      if (rect && rect.w >= MIN_SELECT && rect.h >= MIN_SELECT) {
        if (state.selectedDraft) state.selectedDraft = null;
        state.selection = rect;
        state.offset = { dx: 0, dy: 0 };
        state.label = '';
        syncSelectedDraft();
        commitHistory(drag.before);
        render();
      } else {
        paintOverlay();
        if (rect) toast('Select at least 8 \u00d7 8 px');
      }
      return;
    }
    if (state.offset.dx !== drag.base.dx || state.offset.dy !== drag.base.dy) {
      syncSelectedDraft();
      commitHistory(drag.before);
      render();
    }
  }

  function updateMoveInline() {
    var dxNode = $('#offsetDx');
    var dyNode = $('#offsetDy');
    if (dxNode) dxNode.textContent = (state.offset.dx > 0 ? '+' : '') + state.offset.dx;
    if (dyNode) dyNode.textContent = (state.offset.dy > 0 ? '+' : '') + state.offset.dy;
    if (!state.selection) return;
    var source = liveSource();
    var text = $('#requestText');
    if (text) text.textContent = requestHeading(source) + '\n' + requestText(source);
    var json = $('#requestJson');
    if (json) json.textContent = requestJson(source);
  }

  function addSource() {
    var sel = state.addSelection || { x: 0, y: 0, w: 0, h: 0 };
    return {
      id: state.addSelected || nextAddId(),
      x: Math.round(sel.x), y: Math.round(sel.y), w: Math.round(sel.w), h: Math.round(sel.h),
      label: state.addLabel, description: state.addDescription, hint: state.addHint,
      animation: state.addAnimation, duration: state.addDuration, easing: state.addEasing
    };
  }
  /* The instruction box updates without rebuilding the form, so typing keeps focus. */
  function updateAddInline() {
    var text = $('#addText');
    if (!text) return;
    text.textContent = state.addSelection ? addText(addSource()) : 'Point at an area to create an add instruction.';
  }

  /* ---------- rendering ---------- */
  function render() {
    renderStatus();
    renderPages();
    renderZones();
    renderLeft();
    renderStage();
    renderInspector();
    renderPopover();
    renderChrome();
    renderStatusbar();
  }

  function renderStatus() {
    var chip = $('#readiness');
    var report = state.report;
    chip.className = 'status-chip hide-sm';
    var pending = state.drafts.length + state.addDrafts.length;
    if (!report) {
      chip.textContent = 'Draft';
      chip.setAttribute('data-tip', 'No report loaded');
      return;
    }
    var status = STATUS_TEXT[report.status] ? report.status : 'check';
    var tip = STATUS_TEXT[status] + ' · ' + state.boxes.length + ' changed area' + (state.boxes.length === 1 ? '' : 's');
    if (pending) {
      chip.classList.add('draft');
      chip.textContent = pending + ' request' + (pending === 1 ? '' : 's');
      tip = pending + ' new request' + (pending === 1 ? '' : 's') + ' ready to copy · ' + tip;
    } else {
      chip.classList.add(status);
      chip.textContent = 'Ready';
    }
    chip.setAttribute('data-tip', tip);
    chip.setAttribute('aria-label', chip.textContent + '. ' + tip);
  }

  function afterImageUrl() {
    var report = state.report;
    var images = report && report.images ? report.images : {};
    return safePath(images.after) || safePath(images.before) || null;
  }

  function renderPages() {
    var list = $('#pageList');
    var tabs = $('#pageTabs');
    list.innerHTML = '';
    tabs.innerHTML = '';
    var report = state.report;
    if (!report) {
      list.appendChild(el('p', 'empty-note', 'No page yet. Load a report to see its page here.'));
      return;
    }
    var pageName = report.name || 'report';
    var size = stageSize();
    var item = el('button', 'page-item active');
    item.type = 'button';
    item.title = pageName;
    var thumb = el('span', 'page-thumb');
    var url = afterImageUrl();
    if (url) thumb.style.backgroundImage = 'url("' + url.replace(/"/g, '%22') + '")';
    item.appendChild(thumb);
    var meta = el('span', 'page-meta');
    meta.appendChild(el('span', 'page-name', pageName));
    meta.appendChild(el('span', 'page-size', size.w + ' × ' + size.h));
    item.appendChild(meta);
    var dot = el('span', 'dot' + (STATUS_TEXT[report.status] ? ' ' + report.status : ''));
    dot.title = STATUS_TEXT[report.status] || '';
    item.appendChild(dot);
    list.appendChild(item);
    var tab = el('button', 'page-tab on', pageName);
    tab.type = 'button';
    tab.setAttribute('aria-current', 'page');
    tab.title = pageName;
    tabs.appendChild(tab);
  }

  function renderZones() {
    var grid = $('#zoneGrid');
    grid.innerHTML = '';
    var url = afterImageUrl();
    grid.style.backgroundImage = url ? 'url("' + url.replace(/"/g, '%22') + '")' : '';
    var size = stageSize();
    grid.style.aspectRatio = size.w + ' / ' + size.h;
    var hits = {};
    state.boxes.forEach(function (box) {
      if (!box.zone) return;
      var status = boxStatus(box);
      /* Unexpected wins: one dot per area, coloured by its most urgent change. */
      if (!hits[box.zone] || status === 'unexpected') hits[box.zone] = status;
    });
    ZONES.forEach(function (zone) {
      var cls = 'zone-cell' + (hits[zone] ? ' hit ' + hits[zone] : '') + (state.zone === zone ? ' selected' : '');
      var cell = el('button', cls);
      cell.type = 'button';
      cell.setAttribute('data-zone', zone);
      var label = ZONE_LABEL[zone] + (hits[zone] ? ' · ' + word(hits[zone]) + ' change' : '');
      cell.setAttribute('aria-label', label);
      cell.setAttribute('aria-pressed', state.zone === zone ? 'true' : 'false');
      cell.setAttribute('data-tip', label);
      grid.appendChild(cell);
    });
    var note = $('#zoneNote');
    var clear = $('#zoneClear');
    note.textContent = state.zone ? 'Showing ' + zoneLabel(state.zone) : (state.boxes.length ? 'Pick an area to highlight its changes' : 'No changed areas');
    clear.hidden = !state.zone;
  }

  function guideBlock() {
    var box = el('div', 'guide');
    box.appendChild(el('strong', null, state.report ? 'No changes to show' : 'No report loaded'));
    var steps = el('ol');
    ['1|Pick a mode: Review, Move or Add', '2|Point at the image', '3|Copy the message for your AI'].forEach(function (step) {
      var parts = step.split('|');
      var li = el('li');
      li.appendChild(el('b', null, parts[0]));
      li.appendChild(el('span', null, parts[1]));
      steps.appendChild(li);
    });
    box.appendChild(steps);
    return box;
  }

  function deleteButton(attr, id) {

  function imageNode(path, label) {
    var safe = safePath(path);
    if (!safe) return el('div', 'img-missing', 'image not found');
    var img = el('img');
    img.alt = label || '';
    img.src = safe;
    img.addEventListener('error', function () {
      var box = el('div', 'img-missing', 'image not found');
      if (img.parentNode) img.parentNode.replaceChild(box, img);
    });
    return img;
  }

  function cropSide(side, which) {
    var figure = el('figure', 'crop');
    figure.appendChild(el('span', 'crop-tag', which === 'before' ? 'Before' : 'After'));
    var holder = el('div', 'crop-img');
    var safe = side && typeof side.path === 'string' ? safePath(side.path) : null;
    if (!safe) {
      holder.appendChild(el('div', 'img-missing', 'image not found'));
    } else {
      var img = el('img');
      img.alt = (which === 'before' ? 'Before' : 'After') + ' crop';
      img.src = safe;
      img.addEventListener('error', function () {
        if (img.parentNode) img.parentNode.replaceChild(el('div', 'img-missing', 'image not found'), img);
      });
      holder.appendChild(img);
    }
    figure.appendChild(holder);
    return figure;
  }

  function cropPair(cropId) {
    var entry = state.crops[cropId];
    if (!entry) return null;
    var pair = el('div', 'crop-pair');
    pair.appendChild(cropSide(entry.before && typeof entry.before === 'object' ? entry.before : null, 'before'));
    pair.appendChild(cropSide(entry.after && typeof entry.after === 'object' ? entry.after : null, 'after'));
    return pair;
  }

  function blockWithCaption(caption, node) {
    var block = el('div', 'block');
    block.appendChild(el('div', 'caption', caption));
    block.appendChild(node);
    return block;
  }

  /* Room the picture may use: the scroller minus the padding kept for floating bars. */
  function stageAvail(scroller, fallbackW, fallbackH) {
    if (!scroller) return { w: fallbackW, h: fallbackH };
    var cs = window.getComputedStyle(scroller);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    return { w: scroller.clientWidth - padX, h: scroller.clientHeight - padY };
  }

  function stageSize() {
    var report = state.report;
    var size = report && report.size ? report.size : null;
    return {
      w: num(size && size.width) || state.capture.w || 1280,
      h: num(size && size.height) || state.capture.h || 720
    };
  }

  function markLayer(size) {
    var layer = el('div', 'marks');
    if (!size || size.w <= 0 || size.h <= 0) return layer;
    /* Boxes are changed-pixel clusters in AFTER capture pixels (contract: flat x,y,w,h).
       Both images share the same capture size, so the same rectangle is used on each;
       no before/after offset is invented from a shift hint. */
    state.boxes.forEach(function (box) {
      if (box.x === null || box.y === null || box.w === null || box.h === null) return;
      var node = el('button', 'mark-box ' + boxStatus(box));
      node.type = 'button';
      node.setAttribute('data-box', String(box.id));
      node.title = 'Change ' + box.id + ' \u00b7 ' + zoneLabel(box.zone);
      node.style.left = (box.x / size.w * 100) + '%';
      node.style.top = (box.y / size.h * 100) + '%';
      node.style.width = (box.w / size.w * 100) + '%';
      node.style.height = (box.h / size.h * 100) + '%';
      if (isBoxSelected(box)) node.classList.add('selected');
      layer.appendChild(node);
    });
    return layer;
  }

  /* ---------- review views ---------- */
  /* A caption row sits ABOVE each picture, in its own box, so no label can ever
     cover picture pixels. Pictures are sized from the stage, never cropped. */
  function rvCaption(nodes) {
    var cap = el('div', 'rv-cap');
    (nodes || []).forEach(function (node) { cap.appendChild(node); });
    return cap;
  }
  function rvLabel(text) { return el('span', 'rv-label', text); }
  function rvFrame(capNodes) {
    var frame = el('div', 'rv-frame');
    var cap = rvCaption(capNodes);
    var pic = el('div', 'rv-pic');
    frame.appendChild(cap);
    frame.appendChild(pic);
    return { frame: frame, cap: cap, pic: pic };
  }
  function rvLayer(cls, path, label) {
    var layer = el('div', cls);
    layer.appendChild(imageNode(path, label));
    return layer;
  }
  function diffNode(path) {
    var safe = safePath(path);
    if (!safe) return el('div', 'rv-nodiff', 'No diff image in this report');
    var img = el('img', 'rv-img');
    img.alt = 'diff';
    img.src = safe;
    img.addEventListener('error', function () {
      var box = el('div', 'rv-nodiff', 'No diff image in this report');
      if (img.parentNode) img.parentNode.replaceChild(box, img);
    });
    return img;
  }
  var HANDLE_MIN_INSET = 17; /* half the handle width: keeps it fully inside */
  function applySlider(value) {
    state.sliderPct = clamp(Math.round(value), 0, 100);
    var pic = document.getElementById('rvSliderPic');
    if (!pic) return;
    var after = pic.querySelector('.rv-after');
    var line = pic.querySelector('.rv-line');
    var handle = pic.querySelector('.rv-handle');
    if (after) after.style.clipPath = 'inset(0 0 0 ' + state.sliderPct + '%)';
    if (line) line.style.left = state.sliderPct + '%';
    if (handle) {
      /* The split stays exact; the handle is nudged inward at the extremes so it
         is never half-clipped by the picture box. */
      handle.style.left = 'clamp(' + HANDLE_MIN_INSET + 'px,' + state.sliderPct +
        '%,calc(100% - ' + HANDLE_MIN_INSET + 'px))';
      handle.setAttribute('aria-valuenow', String(state.sliderPct));
    }
  }
  function sliderAt(pic, clientX) {
    var rect = pic.getBoundingClientRect();
    if (!rect.width) return;
    applySlider(clamp((clientX - rect.left) / rect.width, 0, 1) * 100);
  }
  function bindSlider(pic) {
    var drag = false;
    var grabOffset = 0;
    pic.addEventListener('pointerdown', function (event) {
      if (event.button !== 0) return;
      if (event.target.closest('[data-box]')) return; /* boxes stay clickable */
      drag = true;
      var handle = event.target.closest('.rv-handle');
      var rect = pic.getBoundingClientRect();
      /* Grabbing the handle keeps its value; clicking the picture jumps there. */
      if (handle && rect.width) {
        grabOffset = event.clientX - (rect.left + rect.width * state.sliderPct / 100);
      } else {
        grabOffset = 0;
        sliderAt(pic, event.clientX);
      }
      if (pic.setPointerCapture) { try { pic.setPointerCapture(event.pointerId); } catch (err) {} }
      event.preventDefault();
    });
    pic.addEventListener('pointermove', function (event) {
      if (!drag) return;
      sliderAt(pic, event.clientX - grabOffset);
    });
    var stop = function (event) {
      if (!drag) return;
      drag = false;
      if (pic.releasePointerCapture) { try { pic.releasePointerCapture(event.pointerId); } catch (err) {} }
    };
    pic.addEventListener('pointerup', stop);
    pic.addEventListener('pointercancel', stop);
  }
  function sliderHandle() {
    var handle = el('button', 'rv-handle');
    handle.type = 'button';
    handle.id = 'rvSliderHandle';
    handle.setAttribute('role', 'slider');
    handle.setAttribute('tabindex', '0');
    handle.setAttribute('aria-valuemin', '0');
    handle.setAttribute('aria-valuemax', '100');
    handle.setAttribute('aria-valuenow', String(state.sliderPct));
    handle.setAttribute('aria-label', 'Before and after position');
    handle.title = 'Drag to compare \u00b7 arrows move 1%, Shift moves 10%';
    handle.appendChild(el('i', 'l'));
    handle.appendChild(el('i', 'r'));
    handle.style.left = 'clamp(' + HANDLE_MIN_INSET + 'px,' + state.sliderPct +
      '%,calc(100% - ' + HANDLE_MIN_INSET + 'px))';
    handle.addEventListener('keydown', function (event) {
      var step = event.shiftKey ? 10 : 1;
      var next = state.sliderPct;
      if (event.key === 'ArrowLeft') next -= step;
      else if (event.key === 'ArrowRight') next += step;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = 100;
      else return;
      event.preventDefault();
      applySlider(next);
    });
    return handle;
  }
  function opacityControl() {
    var wrap = el('label', 'rv-opacity');
    wrap.appendChild(el('span', 'rv-optxt', 'After opacity'));
    var input = document.createElement('input');
    input.type = 'range';
    input.min = '0';
    input.max = '100';
    input.step = '1';
    input.value = String(state.overlayOpacity);
    input.id = 'rvOpacity';
    input.setAttribute('aria-label', 'After opacity');
    var out = el('span', 'rv-opval', state.overlayOpacity + '%');
    input.addEventListener('input', function () {
      var value = clamp(Math.round(Number(input.value) || 0), 0, 100);
      state.overlayOpacity = value;
      out.textContent = value + '%';
      var layer = document.getElementById('rvOverlayAfter');
      if (layer) layer.style.opacity = String(value / 100);
    });
    wrap.appendChild(input);
    wrap.appendChild(out);
    return wrap;
  }

  function renderReviewStage(inner, scroller, size) {
    var report = state.report;
    var images = report.images || {};
    var view = state.view;
    var gap = 8;
    var room = stageAvail(scroller, 900, 600);
    var availW = Math.max(80, room.w);
    var availH = Math.max(80, room.h);
    var zoom = state.zoom === 'fit' ? null : (Number(state.zoom) || 1);
    var stage = el('div', 'rv-stage');
    stage.setAttribute('data-view', view);

    /* Built before measuring: the caption row height is real layout, not a guess. */
    var frames = [];
    var sideBefore = null;
    var sideAfter = null;

    if (view === 'side') {
      sideBefore = rvFrame([rvLabel('Before')]);
      sideAfter = rvFrame([rvLabel('After')]);
      frames.push(sideBefore, sideAfter);
    } else if (view === 'slider') {
      /* Both words sit in the SAME caption row: Before at its left end, After at its right. */
      frames.push(rvFrame([rvLabel('Before'), rvLabel('After')]));
    } else if (view === 'overlay') {
      var ovLeft = el('span', 'rv-side');
      ovLeft.appendChild(el('span', 'rv-view', 'Overlay'));
      ovLeft.appendChild(rvLabel('Before / After'));
      frames.push(rvFrame([ovLeft, opacityControl()]));
    } else {
      var dfLeft = el('span', 'rv-side');
      dfLeft.appendChild(el('span', 'rv-view', 'Diff'));
      frames.push(rvFrame([dfLeft]));
    }
    frames.forEach(function (item) { stage.appendChild(item.frame); });
    if (view === 'side') stage.classList.add('row');
    inner.appendChild(stage);

    var capH = 0;
    frames.forEach(function (item) { capH = Math.max(capH, item.cap.offsetHeight || 0); });
    if (!capH) capH = 20;

    var single = frames[0];
    var scale;
    if (zoom !== null) {
      scale = zoom;
    } else if (view === 'side') {
      /* Two candidate layouts at Fit: compare the picture size each would give. */
      var rowScale = Math.min((availW - gap) / (2 * size.w), (availH - capH) / size.h);
      var stackScale = Math.min(availW / size.w, (availH - 2 * capH - gap) / (2 * size.h));
      rowScale = Math.max(0.01, rowScale);
      stackScale = Math.max(0.01, stackScale);
      if (stackScale > rowScale) {
        stage.classList.remove('row');
        stage.classList.add('stack');
        scale = stackScale;
      } else {
        scale = rowScale;
      }
    } else {
      scale = Math.max(0.01, Math.min(availW / size.w, (availH - capH) / size.h));
    }

    var pw = Math.max(20, Math.round(size.w * scale));
    var ph = Math.max(20, Math.round(size.h * scale));
    frames.forEach(function (item) {
      item.pic.style.width = pw + 'px';
      item.pic.style.height = ph + 'px';
    });
    if (zoom !== null) {
      var across = view === 'side' && !stage.classList.contains('stack') ? 2 : 1;
      var down = view === 'side' && stage.classList.contains('stack') ? 2 : 1;
      inner.style.minWidth = (pw * across + (across > 1 ? gap : 0)) + 'px';
      inner.style.minHeight = (ph * down + capH * down + (down > 1 ? gap : 0)) + 'px';
    }
    state.scale = scale;
    state.overlaySize = size;

    if (view === 'side') {
      sideBefore.pic.appendChild(imageNode(images.before, 'before'));
      sideBefore.pic.appendChild(markLayer(size));
      sideAfter.pic.appendChild(imageNode(images.after, 'after'));
      sideAfter.pic.appendChild(markLayer(size));
      return;
    }

    if (view === 'slider') {
      var pic = single.pic;
      pic.id = 'rvSliderPic';
      pic.appendChild(rvLayer('rv-before', images.before, 'before'));
      var after = rvLayer('rv-after', images.after, 'after');
      /* Right of the handle is AFTER, left is BEFORE. */
      after.style.clipPath = 'inset(0 0 0 ' + state.sliderPct + '%)';
      pic.appendChild(after);
      pic.appendChild(markLayer(size));
      var line = el('div', 'rv-line');
      line.style.left = state.sliderPct + '%';
      pic.appendChild(line);
      pic.appendChild(sliderHandle());
      bindSlider(pic);
      return;
    }

    if (view === 'overlay') {
      var opic = single.pic;
      opic.appendChild(rvLayer('rv-before', images.before, 'before'));
      var afterLayer = rvLayer('rv-after', images.after, 'after');
      afterLayer.id = 'rvOverlayAfter';
      afterLayer.style.opacity = String(state.overlayOpacity / 100);
      opic.appendChild(afterLayer);
      opic.appendChild(markLayer(size));
      return;
    }

    single.pic.appendChild(diffNode(images.diff));
    single.pic.appendChild(markLayer(size));
  }

  function renderMoveStage(inner, scroller, size) {
    var report = state.report;
    var images = report.images || {};

    var system = el('div', 'frame-system');
    system.appendChild(el('div', 'ruler-corner'));
    var rulerTop = el('div', 'ruler-top');
    rulerTop.id = 'rulerTop';
    var rulerLeft = el('div', 'ruler-left');
    rulerLeft.id = 'rulerLeft';
    var frame = el('div', 'move-frame ' + (CURSOR_CLASS[activeTool()] || 'cursor-grab'));
    frame.id = 'moveFrame';

    var room = stageAvail(scroller, 900, 600);
    var rulerPx = state.rulers ? 23 : 0;
    var availW = Math.max(120, room.w - rulerPx);
    var availH = Math.max(120, room.h - rulerPx);
    var zoom = state.zoom === 'fit' ? null : (Number(state.zoom) || 1);
    /* The scale only changes the drawing box; capture pixels and ruler numbers never change. */
    var scale = zoom === null ? Math.min(availW / size.w, availH / size.h) : zoom;
    scale = Math.max(0.02, scale);
    var frameW = Math.max(20, Math.round(size.w * scale));
    var frameH = Math.max(20, Math.round(size.h * scale));
    state.scale = scale;
    state.overlaySize = size;
    frame.style.width = frameW + 'px';
    frame.style.height = frameH + 'px';
    rulerTop.style.width = frameW + 'px';
    rulerLeft.style.height = frameH + 'px';

    var grid = el('div', 'move-grid');
    var wantGrid = state.mode === 'add' ? state.addGrid : state.grid;
    if (wantGrid) {
      var step = Math.max(4, (state.gridSize || 8) * frameW / size.w);
      grid.style.backgroundImage = 'linear-gradient(to right,rgba(47,128,255,.13) 1px,transparent 1px),' +
        'linear-gradient(to bottom,rgba(47,128,255,.13) 1px,transparent 1px)';
      grid.style.backgroundSize = step + 'px ' + step + 'px';
    }
    frame.appendChild(grid);

    var img = el('img');
    img.alt = 'after image';
    var afterSafe = safePath(images.after);
    img.addEventListener('error', function () {
      if (img.parentNode) img.parentNode.replaceChild(el('div', 'img-missing', 'image not found'), img);
    });
    if (afterSafe) { img.src = afterSafe; frame.appendChild(img); }
    else frame.appendChild(el('div', 'img-missing', 'image not found'));

    var overlay = el('div', 'move-overlay');
    overlay.id = 'moveOverlay';
    frame.appendChild(overlay);

    frame.addEventListener('pointerdown', beginMoveDrag);
    frame.addEventListener('pointermove', moveMoveDrag);
    frame.addEventListener('pointerup', endMoveDrag);
    frame.addEventListener('pointercancel', endMoveDrag);
    /* Keep the stage from selecting text while dragging a rectangle. */
    frame.addEventListener('dragstart', function (event) { event.preventDefault(); });

    system.appendChild(rulerTop);
    system.appendChild(rulerLeft);
    system.appendChild(frame);
    inner.appendChild(system);

    if (zoom !== null) {
      inner.style.minWidth = (frameW + (state.rulers ? 23 : 0)) + 'px';
      inner.style.minHeight = (frameH + (state.rulers ? 23 : 0)) + 'px';
    }

    state.frameW = frameW;
    state.frameH = frameH;
    rulerHost(true);
    rulerHost(false);
    if (state.mode === 'add') paintAddOverlay(); else paintOverlay();
  }

  function renderStage() {
    var inner = $('#stageInner');
    var scroller = $('#stageScroller');
    inner.innerHTML = '';
    inner.className = 'stage-inner mode-' + state.mode;
    inner.style.width = '';
    inner.style.height = '';
    inner.style.minWidth = '0';
    inner.style.minHeight = '0';
    var report = state.report;

    if (!report) {
      var empty = el('div', 'placeholder');
      var icon = el('div', 'ph-icon');
      icon.innerHTML = '<svg class="ic"><use href="#i-image"/></svg>';
      empty.appendChild(icon);
      empty.appendChild(el('strong', null, 'Load a Before and After screenshot to start'));
      empty.appendChild(el('span', null, 'Open the report.json that Orphic Eyes saved next to this page. Its images load from the same folder.'));
      var actions = el('div', 'ph-actions');
      var load = el('button', 'btn primary', 'Load report');
      load.type = 'button';
      load.id = 'loadReportBtn';
      actions.appendChild(load);
      empty.appendChild(actions);
      if (state.loadError) empty.appendChild(el('span', 'hint-note', state.loadError));
      inner.appendChild(empty);
      state.scale = 1;
      return;
    }

    var size = stageSize();
    var images = report.images || {};

    if (state.mode === 'add') {
      renderMoveStage(inner, scroller, size);
      return;
    }

    if (state.mode !== 'review') {
      renderMoveStage(inner, scroller, size);
      return;
    }

    renderReviewStage(inner, scroller, size);
  }

  function restoreFocus(focusId, caret) {
    if (!focusId) return;
    var node = document.getElementById(focusId);
    if (!node) return;
    try {
      node.focus({ preventScroll: true });
      if (caret !== null && typeof node.setSelectionRange === 'function' && typeof node.value === 'string') {
        node.setSelectionRange(caret, caret);
      }
    } catch (err) { /* focus is best-effort */ }
  }

  function renderInspector() {
    renderSummary();
    var title = $('#inspectorTitle');
    var chip = $('#inspectorChip');
    var body = $('#inspectorBody');
    /* Rebuilds replace the form controls; keep the caret where the user left it. */
    var active = document.activeElement;
    var focusId = active && active.id && body.contains(active) ? active.id : null;
    var caret = focusId && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    if (focusId) {
      /* Dropping the control must not be read as "the user finished editing". */
      state.suppressFocusCommit = true;
      try { active.blur(); } catch (err) { /* ignore */ }
      state.suppressFocusCommit = false;
      state.addFieldBefore = null;
      state.labelBefore = null;
    }
    body.innerHTML = '';
    chip.className = 'chip';
    chip.hidden = false;
    var report = state.report;
    var card = $('#summaryCard');
    card.hidden = !report || state.mode !== 'review';
    if (state.mode !== 'review') $('#reportNote').hidden = true;

    if (!report) {
      title.textContent = 'Details';
      chip.textContent = '';
      chip.hidden = true;
      body.appendChild(emptyInspector('Load a report to begin'));
      return;
    }
    chip.hidden = false;

    if (state.mode === 'add') {
      renderAddInspector(title, chip, body);
      restoreFocus(focusId, caret);
      return;
    }

    if (state.mode !== 'review') {
      renderMoveInspector(title, chip, body);
      restoreFocus(focusId, caret);
      return;
    }

    var request = findRequest(state.selectedRequest);
    if (request) {
      title.textContent = 'Request ' + (request.id || '');
      chip.className = 'chip ' + request.status;

      var asked = el('div', 'detail');
      appendRow(asked, 'Kind', TYPE_WORD[request.type] || word(request.type));
      if (request.precision) appendRow(asked, 'Precision', request.precision === 'exact' ? 'Exact (2 px)' : request.precision === 'approximate' ? 'Approx (8 px)' : request.precision);
      if (request.from) appendRow(asked, 'From', fmtRect(request.from));

      body.appendChild(blockWithCaption('Asked', asked));
      var verdict = el('div', 'detail');
      appendRow(verdict, 'Verdict', word(request.status));
      var result = request.result || {};
      /* match is 0..1 in the contract; the UI only ever shows whole percents. */
      if (num(result.match) !== null) appendRow(verdict, 'Match', matchText(result.match));
      /* found/moved/off may be null: a dash, never "null". */
      appendRow(verdict, 'Found', fmtRect(result.found));
      appendRow(verdict, 'Moved', pairText(result.moved));
      appendRow(verdict, 'Off', pairText(result.off));
      if (typeof result.why === 'string' && result.why) appendRow(verdict, 'Why', result.why);
      body.appendChild(blockWithCaption('Verdict', verdict));

      if (requestCrops) body.appendChild(blockWithCaption('Crops', requestCrops));
      else body.appendChild(el('p', 'empty-note', 'No crops for this request.'));
      restoreFocus(focusId, caret);

    var box = findBox(state.selectedBox);

      var rows = el('div', 'detail');
      appendRow(rows, 'Area', zoneLabel(box.zone));

      appendRow(rows, 'Size', fmtSize(box) + ' px');

      appendRow(rows, 'Status', word(status));
      body.appendChild(blockWithCaption('Details', rows));
      var actions = el('div', 'insp-actions');
      var approve = el('button', 'btn', status === 'approved' ? 'Approved' : 'Approve');
      approve.type = 'button';
      approve.id = 'inspApprove';

      var change = el('button', 'btn', 'Request change');

  /* Renders only the fields that changed, so a focused control keeps its focus

  function syncAddControls() {
    var label = document.getElementById('addLabel');
    if (label && document.activeElement !== label && label.value !== state.addLabel) label.value = state.addLabel;
    var hint = document.getElementById('addHint');
    if (hint && hint.value !== state.addHint) hint.value = state.addHint;
    var anim = document.getElementById('addAnimation');
    if (anim && anim.value !== state.addAnimation) anim.value = state.addAnimation;
    var easing = document.getElementById('addEasing');
    if (easing && easing.value !== state.addEasing) easing.value = state.addEasing;
    var motion = addHasMotion({ animation: state.addAnimation });
    if (easing) easing.disabled = !motion;
    var duration = document.getElementById('addDuration');
    if (duration) {
      duration.disabled = !motion;
      var shown = String(addDurationOf({ duration: state.addDuration }));
      if (document.activeElement !== duration && duration.value !== shown) duration.value = shown;
    }
  }

  function placePopover(clientX, clientY) {
    var pop = $('#changePop');
    if (pop.hidden) return;
    var rect = pop.getBoundingClientRect();
    var left = clientX + 14;
    var top = clientY + 14;
    if (left + rect.width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - rect.width - 8);
    if (top + rect.height > window.innerHeight - 8) top = Math.max(8, clientY - rect.height - 12);

    pop.style.top = Math.round(top) + 'px';

  function renderChrome() {

    var views = document.querySelectorAll('#viewSwitch button');
    for (var j = 0; j < views.length; j++) {

      views[j].classList.toggle('on', active);
      views[j].setAttribute('aria-pressed', active ? 'true' : 'false');
    }
    document.body.classList.remove('mode-review', 'mode-move', 'mode-add');
    document.body.classList.add('mode-' + state.mode);
    document.body.classList.toggle('no-report', !state.report);
    var toolbar = $('#moveToolbar');
    var editing = state.mode === 'move' || state.mode === 'add';
    if (toolbar) toolbar.hidden = !editing || !state.report;
    $('#floatTop').hidden = !state.report;
    $('#zoomPill').hidden = !state.report;
    var hint = $('#moveHint');
    if (hint) hint.textContent = state.mode === 'add' ? HINT_ADD : state.mode === 'move' ? HINT_MOVE : 'This tool only sees pixels, not page code.';
    /* Each mode shows only its own controls. */
    var forNodes = document.querySelectorAll('#floatTop [data-for], #moveToolbar [data-for]');
    for (var f = 0; f < forNodes.length; f++) {
      forNodes[f].style.display = forNodes[f].getAttribute('data-for') === state.mode ? '' : 'none';
    }
    var tools = document.querySelectorAll('#moveToolbar [data-tool]');
    var current = activeTool();
    for (var k = 0; k < tools.length; k++) {
      var on = tools[k].getAttribute('data-tool') === current;

    input.addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown') { event.preventDefault(); index = (index + 1) % Math.max(1, shown.length); draw(); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); index = (index - 1 + shown.length) % Math.max(1, shown.length); draw(); }
      else if (event.key === 'Enter') { event.preventDefault(); run(index); }
    });
    draw();
    openLayer(scrim(box), { focus: 'input' });
  }

  /* quick tour */
  var TOUR = [
    { target: '#modeSwitch', title: 'Pick a mode', text: 'Review compares Before and After. Move and Add turn what you point at into requests.' },
    { target: '#sidebar', alt: '#sheetBar', title: 'Changes and requests', text: 'Every changed area and every request lives here. Click one to see its details.' },
    { target: '#canvas', title: 'Point at the picture', text: 'Use the top bar to switch views and the tool dock to select or move an area.' },
    { target: '.copy-split', title: 'Copy for your AI', text: 'One click copies a clear message with all requests. The arrow picks Hermes, ChatGPT, Claude, Gemini or Antigravity.' }
  ];
  function maybeStartTour() {
    if (!prefs.tourDone && state.report) startTour();
  }
  function startTour() {
    var step = 0;
    function finish() { prefs.tourDone = true; savePrefs(); closeLayer(); }
    function targetOf(item) {
      var node = $(item.target);
      if (node && node.getBoundingClientRect().width > 0 && getComputedStyle(node).display !== 'none') return node;
      return item.alt ? $(item.alt) : null;
    }
    function draw() {
      var item = TOUR[step];
      var target = targetOf(item);
      var wrap = el('div');
      var ring = el('div', 'tour-ring');
      var card = el('div', 'tour');
      card.setAttribute('role', 'dialog');
      card.setAttribute('aria-label', 'Quick tour');
      card.appendChild(el('h3', null, item.title));
      card.appendChild(el('p', null, item.text));
      var foot = el('div', 'tour-foot');
      foot.appendChild(el('span', 'step', (step + 1) + ' of ' + TOUR.length));
      var skip = el('button', 'btn ghost', 'Skip');
      skip.type = 'button';
      skip.addEventListener('click', finish);
      var next = el('button', 'btn blue', step === TOUR.length - 1 ? 'Done' : 'Next');
      next.type = 'button';
      next.addEventListener('click', function () {
        if (step === TOUR.length - 1) { finish(); return; }
        step += 1;
        draw();
      });
      foot.appendChild(skip);
      foot.appendChild(next);
      card.appendChild(foot);
      wrap.appendChild(ring);
      wrap.appendChild(card);
      trapKeys(wrap);
      openLayer(wrap, { focus: '.btn.blue', onClose: function () { prefs.tourDone = true; savePrefs(); } });
      var r = target ? target.getBoundingClientRect() : { left: window.innerWidth / 2, top: window.innerHeight / 2, width: 0, height: 0, right: window.innerWidth / 2, bottom: window.innerHeight / 2 };
      ring.style.left = (r.left - 4) + 'px';
      ring.style.top = (r.top - 4) + 'px';
      ring.style.width = (r.width + 8) + 'px';
      ring.style.height = (r.height + 8) + 'px';
      var cr = card.getBoundingClientRect();
      if (r.height > window.innerHeight * 0.5 && r.width < window.innerWidth * 0.5) {
        /* Tall panels: sit beside them instead of on top. */
        var side = r.right + 12 + cr.width < window.innerWidth ? r.right + 12 : r.left - cr.width - 12;
        card.style.left = Math.round(clamp(side, 8, window.innerWidth - cr.width - 8)) + 'px';
        card.style.top = Math.round(clamp(r.top + 40, 8, window.innerHeight - cr.height - 8)) + 'px';
        return;
      }
      var top = r.bottom + 12;
      if (top + cr.height > window.innerHeight - 8) top = r.top - cr.height - 12;
      if (top < 8) top = clamp(r.top + 16, 8, window.innerHeight - cr.height - 8);
      var left = clamp(r.left + r.width / 2 - cr.width / 2, 8, window.innerWidth - cr.width - 8);
      card.style.left = Math.round(left) + 'px';
      card.style.top = Math.round(top) + 'px';
    }
    draw();
  }

  /* load a report.json chosen by the user (images resolve next to this page) */
  function bindLoadReport() {
    var input = el('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.hidden = true;
    document.body.appendChild(input);
    document.addEventListener('click', function (event) {
      if (event.target.closest('#loadReportBtn')) input.click();
    });
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var data = null;
        try { data = JSON.parse(String(reader.result)); } catch (err) { data = null; }
        if (!data || typeof data !== 'object' || data.schema_version !== 1) {
          state.loadError = 'That file is not an Orphic Eyes report (schema version 1).';
          render();
          return;
        }
        state.loadError = null;
        state.loadedData = data;
        loadReport();
        render();
        toast('Report loaded');
      };
      reader.readAsText(file);
      input.value = '';
    });
  }

  function initShell() {
    document.querySelector('.sb-tabs').addEventListener('click', function (event) {
      var tab = event.target.closest('[data-tab]');
      if (tab) { setSidebarTab(tab.getAttribute('data-tab')); return; }
      if (event.target.closest('#sbToggle')) toggleSidebar();
    });
    document.querySelector('.sb-tabs').addEventListener('keydown', function (event) {
      if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight' && event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;
      var order = ['pages', 'changes', 'requests'];
      var i = order.indexOf(state.sidebarTab);
      var step = event.key === 'ArrowLeft' || event.key === 'ArrowUp' ? -1 : 1;
      var next = order[(i + step + order.length) % order.length];
      event.preventDefault();
      setSidebarTab(next);
      $('#tab' + next.charAt(0).toUpperCase() + next.slice(1)).focus();
    });
    $('#zoneClear').addEventListener('click', function () { state.zone = null; render(); });
    $('#inspectorClose').addEventListener('click', toggleInspector);
    $('#settingsBtn').addEventListener('click', function () { openSettings(); });
    $('#settingsBtn2').addEventListener('click', function () { openSettings(); });
    $('#helpBtn').addEventListener('click', function (event) { event.stopPropagation(); openHelpMenu($('#helpBtn')); });
    $('#copyTarget').addEventListener('click', function (event) { event.stopPropagation(); openCopyMenu(); });
    $('#copyTarget').addEventListener('keydown', function (event) {
      if (event.key === 'ArrowDown') { event.preventDefault(); openCopyMenu(); }
      else if (event.key === 'ArrowUp') { event.preventDefault(); openCopyMenu(COPY_TARGETS.length - 1); }
    });
    renderCopyButton();
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && overlayOpen()) { event.preventDefault(); closeLayer(); }
    });
    bindTooltips();
    bindSheet();
    bindLoadReport();
  }

  function setPrecision(value) {
    if (state.precision === value) return;
    var before = state.selection ? snapshotState() : null;
    state.precision = value;
    if (state.selection) syncSelectedDraft();
    if (before) commitHistory(before);
    render();
    toast(value === 'exact' ? 'Exact · 2 px' : 'Approx · 8 px');
  }

  loadPrefs();
  loadReport();
  initEvents();
  applyTheme(prefs.theme);
  applyTextSize(state.textSize);
  render();
  window.addEventListener('load', function () { renderStage(); renderStatusbar(); renderChrome(); maybeStartTour(); });
})();
</script>
</body>
</html>
