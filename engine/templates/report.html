  function imageNode(path, label) {
    var safe = safePath(path);
    if (!safe) return el('div', 'img-missing', 'image not found');
    var img = el('img');
    img.alt = label || '';
    img.src = safe;
    /* Shimmer only while a picture is really loading; cached pictures show at once. */
    if (!img.complete) {
      img.classList.add('pending');
      requestAnimationFrame(function () {
        var pic = img.closest && img.closest('.rv-pic');
        if (pic && img.classList.contains('pending')) pic.classList.add('loading');
      });
      var settle = function (ok) {
        img.classList.remove('pending');
        if (ok && !reducedMotion()) img.classList.add('img-in');
        var pic = img.closest && img.closest('.rv-pic');
        if (pic && !pic.querySelector('img.pending')) pic.classList.remove('loading');
      };
      img.addEventListener('load', function () { settle(true); });
      img.addEventListener('error', function () { settle(false); });
    }
    img.addEventListener('error', function () {
      var box = el('div', 'img-missing', 'image not found');
      if (img.parentNode) img.parentNode.replaceChild(box, img);
    });
    return img;
  }

  function cropSide(side, which) {
    var figure = el('figure', 'crop');
    figure.appendChild(el('span', 'crop-tag', which === 'before' ? 'Before' : 'After'));
    var holder = el('div', 'crop-img');
    var safe = side && typeof side.path === 'string' ? safePath(side.path) : null;
    if (!safe) {
      holder.appendChild(el('div', 'img-missing', 'image not found'));
    } else {
      var img = el('img');
      img.alt = (which === 'before' ? 'Before' : 'After') + ' crop';
      img.src = safe;
      img.addEventListener('error', function () {
        if (img.parentNode) img.parentNode.replaceChild(el('div', 'img-missing', 'image not found'), img);
      });
      holder.appendChild(img);
    }
    figure.appendChild(holder);
    return figure;
  }

  function cropPair(cropId) {
    var entry = state.crops[cropId];
    if (!entry) return null;
    var pair = el('div', 'crop-pair');
    pair.appendChild(cropSide(entry.before && typeof entry.before === 'object' ? entry.before : null, 'before'));
    pair.appendChild(cropSide(entry.after && typeof entry.after === 'object' ? entry.after : null, 'after'));
    return pair;

  function blockWithCaption(caption, node) {

  /* Room the picture may use: the scroller minus the padding kept for floating bars. */
  function stageAvail(scroller, fallbackW, fallbackH) {
    if (!scroller) return { w: fallbackW, h: fallbackH };
    var cs = window.getComputedStyle(scroller);
    var padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    var padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    return { w: scroller.clientWidth - padX, h: scroller.clientHeight - padY };
  }

  function stageSize() {
    var report = state.report;
    var size = report && report.size ? report.size : null;
    return {
      w: num(size && size.width) || state.capture.w || 1280,
      h: num(size && size.height) || state.capture.h || 720
    };
  }

  function markLayer(size) {
    var layer = el('div', 'marks');
    if (!size || size.w <= 0 || size.h <= 0) return layer;
    /* Boxes are changed-pixel clusters in AFTER capture pixels (contract: flat x,y,w,h).
       Both images share the same capture size, so the same rectangle is used on each;
       no before/after offset is invented from a shift hint. */
    state.boxes.forEach(function (box) {
      if (box.x === null || box.y === null || box.w === null || box.h === null) return;
      var node = el('button', 'mark-box ' + boxStatus(box));
      node.type = 'button';
      node.setAttribute('data-box', String(box.id));
      node.title = 'Change ' + box.id + ' \u00b7 ' + zoneLabel(box.zone);
      node.style.left = (box.x / size.w * 100) + '%';
      node.style.top = (box.y / size.h * 100) + '%';
      node.style.width = (box.w / size.w * 100) + '%';
      node.style.height = (box.h / size.h * 100) + '%';
      if (isBoxSelected(box)) { node.classList.add('selected'); ants(node); }
      layer.appendChild(node);
    });
    return layer;
  }

  /* ---------- review views ---------- */
  /* A caption row sits ABOVE each picture, in its own box, so no label can ever
     cover picture pixels. Pictures are sized from the stage, never cropped. */
  function rvCaption(nodes) {
    var cap = el('div', 'rv-cap');
    (nodes || []).forEach(function (node) { cap.appendChild(node); });
    return cap;
  }
  function rvLabel(text) { return el('span', 'rv-label', text); }
  function rvFrame(capNodes) {
    var frame = el('div', 'rv-frame');
    var cap = rvCaption(capNodes);
    var pic = el('div', 'rv-pic');
    frame.appendChild(cap);
    frame.appendChild(pic);
    return { frame: frame, cap: cap, pic: pic };
  }
  function rvLayer(cls, path, label) {
    var layer = el('div', cls);

  function diffNode(path) {
    var safe = safePath(path);
    if (!safe) return el('div', 'rv-nodiff', 'No diff image in this report');
    var img = el('img', 'rv-img');
    img.alt = 'diff';
    img.src = safe;
    img.addEventListener('error', function () {
      var box = el('div', 'rv-nodiff', 'No diff image in this report');
      if (img.parentNode) img.parentNode.replaceChild(box, img);
    });
    return img;
  }
  var HANDLE_MIN_INSET = 17; /* half the handle width: keeps it fully inside */
  function applySlider(value) {
    state.sliderPct = clamp(Math.round(value), 0, 100);
    var pic = document.getElementById('rvSliderPic');
    if (!pic) return;
    var after = pic.querySelector('.rv-after');
    var line = pic.querySelector('.rv-line');
    var handle = pic.querySelector('.rv-handle');
    if (after) after.style.clipPath = 'inset(0 0 0 ' + state.sliderPct + '%)';
    if (line) line.style.left = state.sliderPct + '%';
    if (handle) {
      /* The split stays exact; the handle is nudged inward at the extremes so it
         is never half-clipped by the picture box. */
      handle.style.left = 'clamp(' + HANDLE_MIN_INSET + 'px,' + state.sliderPct +
        '%,calc(100% - ' + HANDLE_MIN_INSET + 'px))';
      handle.setAttribute('aria-valuenow', String(state.sliderPct));
    }
  }
  function sliderAt(pic, clientX) {
    var rect = pic.getBoundingClientRect();
    if (!rect.width) return;
    applySlider(clamp((clientX - rect.left) / rect.width, 0, 1) * 100);
  }
  function bindSlider(pic) {
    var drag = false;
    var grabOffset = 0;
    pic.addEventListener('pointerdown', function (event) {
      if (event.button !== 0) return;
      if (event.target.closest('[data-box]')) return; /* boxes stay clickable */
      drag = true;
      var handle = event.target.closest('.rv-handle');
      var rect = pic.getBoundingClientRect();
      /* Grabbing the handle keeps its value; clicking the picture jumps there. */
      if (handle && rect.width) {
        grabOffset = event.clientX - (rect.left + rect.width * state.sliderPct / 100);
      } else {
        grabOffset = 0;
        sliderAt(pic, event.clientX);
      }
      if (pic.setPointerCapture) { try { pic.setPointerCapture(event.pointerId); } catch (err) {} }
      event.preventDefault();
    });
    pic.addEventListener('pointermove', function (event) {
      if (!drag) return;
      sliderAt(pic, event.clientX - grabOffset);
    });
    var stop = function (event) {
      if (!drag) return;
      drag = false;
      if (pic.releasePointerCapture) { try { pic.releasePointerCapture(event.pointerId); } catch (err) {} }
    };
    pic.addEventListener('pointerup', stop);
    pic.addEventListener('pointercancel', stop);
  }
  function sliderHandle() {
    var handle = el('button', 'rv-handle');

    handle.setAttribute('role', 'slider');
    handle.setAttribute('tabindex', '0');
    handle.setAttribute('aria-valuemin', '0');
    handle.setAttribute('aria-valuemax', '100');
    handle.setAttribute('aria-valuenow', String(state.sliderPct));
    handle.setAttribute('aria-label', 'Before and after position');
    handle.title = 'Drag to compare \u00b7 arrows move 1%, Shift moves 10%';
    handle.appendChild(el('i', 'l'));
    handle.appendChild(el('i', 'r'));
    handle.style.left = 'clamp(' + HANDLE_MIN_INSET + 'px,' + state.sliderPct +
      '%,calc(100% - ' + HANDLE_MIN_INSET + 'px))';
    handle.addEventListener('keydown', function (event) {
      var step = event.shiftKey ? 10 : 1;
      var next = state.sliderPct;
      if (event.key === 'ArrowLeft') next -= step;
      else if (event.key === 'ArrowRight') next += step;
      else if (event.key === 'Home') next = 0;
      else if (event.key === 'End') next = 100;
      else return;
      event.preventDefault();
      applySlider(next);
    });
    return handle;
  }
  function opacityControl() {
    var wrap = el('label', 'rv-opacity');

  function renderReviewStage(inner, scroller, size) {
    var report = state.report;
    var images = report.images || {};
    var view = state.view;
    var gap = 8;
    var room = stageAvail(scroller, 900, 600);
    var availW = Math.max(80, room.w);
    var availH = Math.max(80, room.h);
    var zoom = state.zoom === 'fit' ? null : (Number(state.zoom) || 1);
    var stage = el('div', 'rv-stage');
    stage.setAttribute('data-view', view);

    /* Built before measuring: the caption row height is real layout, not a guess. */
    var frames = [];
    var sideBefore = null;
    var sideAfter = null;

    if (view === 'side') {
      sideBefore = rvFrame([rvLabel('Before')]);
      sideAfter = rvFrame([rvLabel('After')]);
      frames.push(sideBefore, sideAfter);
    } else if (view === 'slider') {
      /* Both words sit in the SAME caption row: Before at its left end, After at its right. */
      frames.push(rvFrame([rvLabel('Before'), rvLabel('After')]));
    } else if (view === 'overlay') {
      var ovLeft = el('span', 'rv-side');
      ovLeft.appendChild(el('span', 'rv-view', 'Overlay'));
      ovLeft.appendChild(rvLabel('Before / After'));
      frames.push(rvFrame([ovLeft, opacityControl()]));
    } else {
      var dfLeft = el('span', 'rv-side');
      dfLeft.appendChild(el('span', 'rv-view', 'Diff'));
      frames.push(rvFrame([dfLeft]));
    }
    frames.forEach(function (item) { stage.appendChild(item.frame); });
    if (view === 'side') stage.classList.add('row');
    inner.appendChild(stage);

    var capH = 0;
    frames.forEach(function (item) { capH = Math.max(capH, item.cap.offsetHeight || 0); });
    if (!capH) capH = 20;

    var single = frames[0];
    var scale;
    if (zoom !== null) {
      scale = zoom;
    } else if (view === 'side') {
      /* Two candidate layouts at Fit: compare the picture size each would give. */
      var rowScale = Math.min((availW - gap) / (2 * size.w), (availH - capH) / size.h);
      var stackScale = Math.min(availW / size.w, (availH - 2 * capH - gap) / (2 * size.h));
      rowScale = Math.max(0.01, rowScale);
      stackScale = Math.max(0.01, stackScale);
      if (stackScale > rowScale) {
        stage.classList.remove('row');
        stage.classList.add('stack');
        scale = stackScale;
      } else {
        scale = rowScale;
      }
    } else {
      scale = Math.max(0.01, Math.min(availW / size.w, (availH - capH) / size.h));
    }

    var pw = Math.max(20, Math.round(size.w * scale));
    var ph = Math.max(20, Math.round(size.h * scale));
    frames.forEach(function (item) {
      item.pic.style.width = pw + 'px';
      item.pic.style.height = ph + 'px';
    });
    if (zoom !== null) {
      var across = view === 'side' && !stage.classList.contains('stack') ? 2 : 1;
      var down = view === 'side' && stage.classList.contains('stack') ? 2 : 1;
      inner.style.minWidth = (pw * across + (across > 1 ? gap : 0)) + 'px';
      inner.style.minHeight = (ph * down + capH * down + (down > 1 ? gap : 0)) + 'px';
    }
    state.scale = scale;
    state.overlaySize = size;
    if (state.grid) {
      var gstep = Math.max(4, (state.gridSize || 8) * scale);
      frames.forEach(function (item) {
        var g = el('div', 'rv-grid');
        g.style.backgroundSize = gstep + 'px ' + gstep + 'px';
        item.pic.appendChild(g);
      });
    }

    if (view === 'side') {
      sideBefore.pic.appendChild(imageNode(images.before, 'before'));
      sideBefore.pic.appendChild(markLayer(size));
      sideAfter.pic.appendChild(imageNode(images.after, 'after'));
      sideAfter.pic.appendChild(markLayer(size));
      return;
    }

    if (view === 'slider') {
      var pic = single.pic;
      pic.id = 'rvSliderPic';
      pic.appendChild(rvLayer('rv-before', images.before, 'before'));
      var after = rvLayer('rv-after', images.after, 'after');
      /* Right of the handle is AFTER, left is BEFORE. */
      after.style.clipPath = 'inset(0 0 0 ' + state.sliderPct + '%)';
      pic.appendChild(after);
      pic.appendChild(markLayer(size));
      var line = el('div', 'rv-line');
      line.style.left = state.sliderPct + '%';
      pic.appendChild(line);
      pic.appendChild(sliderHandle());
      bindSlider(pic);
      return;
    }

    if (view === 'overlay') {
      var opic = single.pic;
      opic.appendChild(rvLayer('rv-before', images.before, 'before'));
      var afterLayer = rvLayer('rv-after', images.after, 'after');
      afterLayer.id = 'rvOverlayAfter';
      afterLayer.style.opacity = String(state.overlayOpacity / 100);
      opic.appendChild(afterLayer);
      opic.appendChild(markLayer(size));
      return;
    }

    single.pic.appendChild(diffNode(images.diff));
    single.pic.appendChild(markLayer(size));
  }

  function renderMoveStage(inner, scroller, size) {
    var report = state.report;
    var images = report.images || {};

    var system = el('div', 'frame-system');
    system.appendChild(el('div', 'ruler-corner'));
    var rulerTop = el('div', 'ruler-top');
    rulerTop.id = 'rulerTop';
    var rulerLeft = el('div', 'ruler-left');
    rulerLeft.id = 'rulerLeft';
    var frame = el('div', 'move-frame ' + (CURSOR_CLASS[activeTool()] || 'cursor-grab'));
    frame.id = 'moveFrame';

    var room = stageAvail(scroller, 900, 600);
    var rulerPx = state.rulers ? 23 : 0;
    var availW = Math.max(120, room.w - rulerPx);
    var availH = Math.max(120, room.h - rulerPx);
    var zoom = state.zoom === 'fit' ? null : (Number(state.zoom) || 1);
    /* The scale only changes the drawing box; capture pixels and ruler numbers never change. */
    var scale = zoom === null ? Math.min(availW / size.w, availH / size.h) : zoom;
    scale = Math.max(0.02, scale);
    var frameW = Math.max(20, Math.round(size.w * scale));
    var frameH = Math.max(20, Math.round(size.h * scale));
    state.scale = scale;
    state.overlaySize = size;
    frame.style.width = frameW + 'px';
    frame.style.height = frameH + 'px';
    rulerTop.style.width = frameW + 'px';
    rulerLeft.style.height = frameH + 'px';

    var grid = el('div', 'move-grid');
    var wantGrid = state.grid;
    if (wantGrid) {
      var step = Math.max(4, (state.gridSize || 8) * frameW / size.w);
      grid.style.backgroundImage = 'linear-gradient(to right,rgba(47,128,255,.13) 1px,transparent 1px),' +
        'linear-gradient(to bottom,rgba(47,128,255,.13) 1px,transparent 1px)';
      grid.style.backgroundSize = step + 'px ' + step + 'px';
    }
    frame.appendChild(grid);

    var img = el('img');
    img.alt = 'after image';
    var afterSafe = safePath(images.after);
    img.addEventListener('error', function () {
      if (img.parentNode) img.parentNode.replaceChild(el('div', 'img-missing', 'image not found'), img);
    });
    if (afterSafe) { img.src = afterSafe; frame.appendChild(img); }
    else frame.appendChild(el('div', 'img-missing', 'image not found'));

    var overlay = el('div', 'move-overlay');
    overlay.id = 'moveOverlay';
    frame.appendChild(overlay);

    frame.addEventListener('pointerdown', beginMoveDrag);
    frame.addEventListener('pointermove', moveMoveDrag);
    frame.addEventListener('pointerup', endMoveDrag);
    frame.addEventListener('pointercancel', endMoveDrag);
    /* Keep the stage from selecting text while dragging a rectangle. */
    frame.addEventListener('dragstart', function (event) { event.preventDefault(); });

    system.appendChild(rulerTop);
    system.appendChild(rulerLeft);
    system.appendChild(frame);
    inner.appendChild(system);

    if (zoom !== null) {
      inner.style.minWidth = (frameW + (state.rulers ? 23 : 0)) + 'px';
      inner.style.minHeight = (frameH + (state.rulers ? 23 : 0)) + 'px';
    }

    state.frameW = frameW;
    state.frameH = frameH;
    rulerHost(true);
    rulerHost(false);
    if (state.mode === 'add') paintAddOverlay(); else paintOverlay();
  }

  function renderStage() {
    var inner = $('#stageInner');
    var scroller = $('#stageScroller');
    inner.innerHTML = '';
    inner.className = 'stage-inner mode-' + state.mode;
    inner.style.width = '';
    inner.style.height = '';
    inner.style.minWidth = '0';
    inner.style.minHeight = '0';
    var report = state.report;

    if (!report) {
      renderLoader(inner);
      state.scale = 1;
      return;
    }

    var size = stageSize();
    var images = report.images || {};

    if (state.mode === 'add') {
      renderMoveStage(inner, scroller, size);
      return;
    }

    if (state.mode !== 'review') {
      renderMoveStage(inner, scroller, size);
      return;
    }

    renderReviewStage(inner, scroller, size);
  }

  function appendRow(parent, label, value) {
    var row = el('div', 'row');
    row.appendChild(el('span', null, label));
    row.appendChild(el('strong', null, value));
    parent.appendChild(row);
  }

  function renderSummary() {
    var card = $('#summaryCard');
    var text = $('#summaryText');
    var note = $('#reportNote');
    var report = state.report;
    card.className = 'summary-card';
    card.textContent = '';
    if (!report) {
      text.textContent = 'No report loaded';
      card.appendChild(text);
      note.textContent = '';
      note.hidden = true;
      return;
    }
    var status = STATUS_TEXT[report.status] ? report.status : 'check';
    card.classList.add(status);
    var mark = el('span', 'mark', statusSymbol(status));
    mark.setAttribute('aria-hidden', 'true');
    card.appendChild(mark);
    text.textContent = STATUS_TEXT[status];
    card.appendChild(text);
    /* Only the three contract tokens are shown, in words. Anything else stays silent. */
    var value = typeof report.note_text === 'string' && report.note_text ? report.note_text
      : typeof report.note === 'string' ? NOTE_TEXT[report.note] || '' : '';
    note.textContent = value;
    note.hidden = !value;
  }

  function restoreFocus(focusId, caret) {
    if (!focusId) return;
    var node = document.getElementById(focusId);
    if (!node) return;
    try {
      node.focus({ preventScroll: true });
      if (caret !== null && typeof node.setSelectionRange === 'function' && typeof node.value === 'string') {
        node.setSelectionRange(caret, caret);
      }
    } catch (err) { /* focus is best-effort */ }
  }

  function renderInspector() {
    renderSummary();
    var title = $('#inspectorTitle');
    var chip = $('#inspectorChip');
    var body = $('#inspectorBody');
    /* Rebuilds replace the form controls; keep the caret where the user left it. */
    var active = document.activeElement;
    var focusId = active && active.id && body.contains(active) ? active.id : null;
    var caret = focusId && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    if (focusId) {
      /* Dropping the control must not be read as "the user finished editing". */
      state.suppressFocusCommit = true;
      try { active.blur(); } catch (err) { /* ignore */ }
      state.suppressFocusCommit = false;
      state.addFieldBefore = null;
      state.labelBefore = null;
    }
    body.innerHTML = '';
    chip.className = 'chip';
    chip.hidden = false;
    var report = state.report;
    var card = $('#summaryCard');
    card.hidden = !report || state.mode !== 'review';
    if (state.mode !== 'review') $('#reportNote').hidden = true;

    if (!report) {
      title.textContent = 'Details';
      chip.textContent = '';
      chip.hidden = true;
      body.appendChild(emptyInspector('Load a report to begin'));
      return;
    }
    chip.hidden = false;

    if (state.mode === 'add') {
      renderAddInspector(title, chip, body);
      restoreFocus(focusId, caret);
      return;
    }

    if (state.mode !== 'review') {
      renderMoveInspector(title, chip, body);
      restoreFocus(focusId, caret);
      return;
    }

    var request = findRequest(state.selectedRequest);
    if (request) {
      title.textContent = 'Request ' + (request.id || '');
      chip.className = 'chip ' + request.status;
      chip.textContent = word(request.status);
      var asked = el('div', 'detail');
      appendRow(asked, 'Kind', TYPE_WORD[request.type] || word(request.type));
      if (request.precision) appendRow(asked, 'Precision', request.precision === 'exact' ? 'Exact (2 px)' : request.precision === 'approximate' ? 'Approx (8 px)' : request.precision);
      if (request.from) appendRow(asked, 'From', fmtRect(request.from));
      if (request.to) appendRow(asked, 'To', fmtRect(request.to));
      body.appendChild(blockWithCaption('Asked', asked));
      var verdict = el('div', 'detail');
      appendRow(verdict, 'Verdict', word(request.status));
      var result = request.result || {};
      /* match is 0..1 in the contract; the UI only ever shows whole percents. */
      if (num(result.match) !== null) appendRow(verdict, 'Match', matchText(result.match));
      /* found/moved/off may be null: a dash, never "null". */
      appendRow(verdict, 'Found', fmtRect(result.found));
      appendRow(verdict, 'Moved', pairText(result.moved));
      appendRow(verdict, 'Off', pairText(result.off));
      if (typeof result.why === 'string' && result.why) appendRow(verdict, 'Why', result.why);
      body.appendChild(blockWithCaption('Verdict', verdict));
      var requestCrops = request.id ? cropPair('req-' + request.id) : null;
      if (requestCrops) body.appendChild(blockWithCaption('Crops', requestCrops));
      else body.appendChild(el('p', 'empty-note', 'No crops for this request.'));
      restoreFocus(focusId, caret);
      return;
    }

    var box = findBox(state.selectedBox);
    if (box) {
      var status = boxStatus(box);
      title.textContent = 'Change ' + box.id;
      chip.className = 'chip ' + status;
      chip.textContent = word(status);
      var boxCrops = cropPair('box-' + box.id);
      if (boxCrops) body.appendChild(blockWithCaption('Before and after', boxCrops));
      var rows = el('div', 'detail');
      appendRow(rows, 'Area', zoneLabel(box.zone));
      appendRow(rows, 'Position', fmtPoint(box));
      appendRow(rows, 'Size', fmtSize(box) + ' px');
      var changed = el('div', 'row');
      changed.appendChild(el('span', null, 'Changed'));
      var amount = el('strong', null, sizeWord(box.percent));
      amount.title = pct(box.percent) + ' of the page changed';
      amount.setAttribute('data-tip', pct(box.percent) + ' of the page changed');
      changed.appendChild(amount);
      rows.appendChild(changed);
      appendRow(rows, 'Status', word(status));
      body.appendChild(blockWithCaption('Details', rows));
      var actions = el('div', 'insp-actions');
      var approve = el('button', 'btn', status === 'approved' ? 'Approved' : 'Approve');
      approve.type = 'button';
      approve.id = 'inspApprove';
      explainDisabled(approve, status === 'approved' ? 'Already approved' : '');
      actions.appendChild(approve);
      var change = el('button', 'btn', 'Request change');
      change.type = 'button';
      change.id = 'inspRequestChange';
      change.setAttribute('data-tip', 'Open this area in Move mode');
      actions.appendChild(change);
      body.appendChild(actions);
      var fix = el('button', 'btn block', 'Copy fix message');
      fix.type = 'button';
      fix.id = 'inspCopyFix';
      body.appendChild(fix);
      return;
    }

    title.textContent = 'Details';
    chip.hidden = true;
    body.appendChild(emptyInspector('Select an area or a request to see its details'));
  }

  /* Static helper phrases: tap to append, never to replace. No AI, no network. */
  var NOTE_CHIPS = [
    ['Colour', ['wrong colour', 'match the Before colour']],
    ['Size', ['too big', 'too small', 'same size as Before']],
    ['Position', ['misaligned', 'spacing too tight', 'spacing too wide']],
    ['Text', ['text cut off', 'wrong text', 'font too small']]
  ];
  function chipBlock(fieldId) {
    var wrap = el('div', 'chip-help');
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', 'Quick phrases');
    NOTE_CHIPS.forEach(function (group) {
      var row = el('div', 'chip-row');
      row.appendChild(el('span', 'chip-topic', group[0]));
      group[1].forEach(function (phrase) {
        var b = el('button', 'help-chip', phrase);
        b.type = 'button';
        b.setAttribute('data-chip', phrase);
        b.setAttribute('data-chip-for', fieldId);
        b.setAttribute('aria-label', 'Add \u201c' + phrase + '\u201d to the text');
        row.appendChild(b);
      });
      wrap.appendChild(row);
    });
    return wrap;
  }
  function appendPhrase(current, phrase) {
    var text = String(current || '').replace(/\s+$/, '');
    if (!text) return phrase.charAt(0).toUpperCase() + phrase.slice(1);
    return text + (/[;,.:!?]$/.test(text) ? ' ' : '; ') + phrase;
  }
  function useChip(button) {
    var field = document.getElementById(button.getAttribute('data-chip-for'));
    if (!field || field.disabled) return;
    var next = appendPhrase(field.value, button.getAttribute('data-chip'));
    if (field.maxLength > 0 && next.length > field.maxLength) { toast('The text is full'); return; }
    /* One undo step per chip: open the step, change the field, close the step. */
    if (field.id === 'selectionNote') state.labelBefore = snapshotState();
    else { state.addFieldBefore = snapshotState(); state.addFocus = field.id; }
    field.value = next;
    field.dispatchEvent(new Event('input', { bubbles: true }));
    if (field.id === 'selectionNote') commitLabel(); else commitAddField();
    try { field.focus({ preventScroll: true }); field.setSelectionRange(next.length, next.length); } catch (err) { /* ignore */ }
  }

  function emptyInspector(heading) {
    var box = el('div', 'guide');
    box.appendChild(el('strong', null, heading));
    var steps = el('ol');
    ['1|Review: click a coloured box on the image', '2|Move or Add: drag an area to create a request', '3|Copy the message for your AI'].forEach(function (step) {
      var parts = step.split('|');
      var li = el('li');
      li.appendChild(el('b', null, parts[0]));
      li.appendChild(el('span', null, parts[1]));
      steps.appendChild(li);
    });
    box.appendChild(steps);
    return box;
  }

    function fieldBox(caption, value, id) {

    cropBlock.appendChild(el('div', 'caption', 'Before crop'));

    cropBlock.appendChild(holder);
    var meta = el('div', 'crop-meta mono', sel
      ? Math.round(sel.x) + ', ' + Math.round(sel.y) + ' \u00b7 ' + Math.round(sel.w) + ' \u00d7 ' + Math.round(sel.h) + ' px'
      : 'No area selected');
    cropBlock.appendChild(meta);
    body.appendChild(cropBlock);

    /* Generated request */
    var source = liveSource();
    var requestBlock = el('div', 'block');
    var head = el('div', 'request-head');
    head.appendChild(el('div', 'caption', 'Generated request'));
    var copyBtn = el('button', 'copy-mini');
    copyBtn.type = 'button';
    copyBtn.id = 'copyRequest';
    copyBtn.title = 'Copy this request';
    copyBtn.setAttribute('aria-label', 'Copy this request');
    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('viewBox', '0 0 24 24');
    icon.setAttribute('aria-hidden', 'true');
    var pathA = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    pathA.setAttribute('x', '8'); pathA.setAttribute('y', '8');
    pathA.setAttribute('width', '12'); pathA.setAttribute('height', '12');
    pathA.setAttribute('rx', '2');
    var pathB = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    pathB.setAttribute('d', 'M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2');
    icon.appendChild(pathA);
    icon.appendChild(pathB);
    copyBtn.appendChild(icon);

    head.appendChild(copyBtn);
    requestBlock.appendChild(head);
    var text = el('div', 'request-text mono');
    text.id = 'requestText';
    text.textContent = sel ? (requestHeading(source) + '\n' + requestText(source)) : 'Point at an area to create a request.';
    requestBlock.appendChild(text);
    if (sel) {
      var json = el('div', 'request-json mono');

    body.appendChild(requestBlock);

    /* Draft actions */
    var actions = el('div', 'block');
    var addBtn = el('button', 'btn', 'Add request');

    addBtn.style.justifyContent = 'center';
    actions.appendChild(addBtn);
    if (requestCount() >= MAX_REQUESTS) {
      var limit = el('p', 'hint-note', 'Up to 8 requests per check');
      limit.id = 'moveLimit';
      actions.appendChild(limit);
    } else if (state.selectedDraft) {
      actions.appendChild(el('p', 'hint-note', 'Edits above save to ' + state.selectedDraft + '.'));

    function toggleOption(selector, on) {

  /* Basenames only: the status bar never shows a full path. */
  function baseName(path) {
    if (typeof path !== 'string' || !path) return '';
    var parts = path.replace(/\\/g, '/').split('/');
    return parts[parts.length - 1] || '';
  }
  /* DPR is shown only when the report itself carries a DPR/scale field. */
  function dprText(report) {
    if (!report) return '';
    var meta = report.meta && typeof report.meta === 'object' ? report.meta : {};
    var view = meta.viewport && typeof meta.viewport === 'object' ? meta.viewport : {};
    var candidates = [meta.dpr, meta.device_pixel_ratio, meta.devicePixelRatio,
      meta.scale, meta.pixel_ratio, view.dpr, view.scale, report.dpr, report.scale];
    for (var i = 0; i < candidates.length; i++) {
      var value = num(candidates[i]);
      if (value !== null && value > 0) return 'DPR ' + (Math.round(value * 100) / 100);
    }
    return '';
  }

  function renderStatusbar() {
    var report = state.report;
    var size = stageSize();

    $('#captureSize').textContent = report ? size.w + '\u00d7' + size.h : '\u2014';
    $('#captureName').textContent = report ? presetName(size.w, size.h) : 'Capture';
    if (!report) {
      $('#sbCapture').textContent = 'No report loaded';
    } else {
      var images = report.images && typeof report.images === 'object' ? report.images : {};
      var parts = [];
      var name = typeof report.name === 'string' && report.name ? report.name : '';
      if (name) parts.push(name);
      var afterName = typeof report.after_name === 'string' ? report.after_name : baseName(images.after);
      if (afterName) parts.push(afterName);
      parts.push(label);
      var dpr = dprText(report);
      if (dpr) parts.push(dpr);
      $('#sbCapture').textContent = parts.join(' \u00b7 ');
    }
    $('#sbZoom').textContent = state.zoom === 'fit' ? 'Fit \u00b7 ' + Math.round((state.scale || 1) * 100) + '%' : Math.round(Number(state.zoom) * 100) + '%';

        : '';

  /* ---------- events ---------- */
  var seenKeys = true;
  function rowKey(node) {
    return node.getAttribute('data-draft') ? 'd:' + node.getAttribute('data-draft')
      : node.getAttribute('data-add-draft') ? 'a:' + node.getAttribute('data-add-draft')
      : node.getAttribute('data-request') ? 'r:' + node.getAttribute('data-request') : null;
  }
  /* The action runs at once; a copy of the old row fades out on top and the
     rows below slide up into place (transform only, no layout animation). */
  function removeWithMotion(row, action) {
    var list = row && row.parentNode;
    if (!list || reducedMotion()) { action(); return; }
    var listRect = list.getBoundingClientRect();
    var rowRect = row.getBoundingClientRect();
    var before = {};
    list.querySelectorAll('.row-item').forEach(function (node) {
      var key = rowKey(node);
      if (key) before[key] = node.getBoundingClientRect().top;
    });
    var ghost = row.cloneNode(true);
    ghost.removeAttribute('data-draft');
    ghost.removeAttribute('data-add-draft');
    ghost.removeAttribute('role');
    ghost.removeAttribute('tabindex');
    ghost.setAttribute('aria-hidden', 'true');
    ghost.querySelectorAll('[data-delete-draft],[data-delete-add]').forEach(function (n) { n.remove(); });
    action();
    var fresh = document.getElementById(list.id) || list;
    ghost.classList.add('row-ghost');
    ghost.classList.remove('row-new', 'selected');
    ghost.style.left = (rowRect.left - listRect.left) + 'px';
    ghost.style.top = (rowRect.top - listRect.top + fresh.scrollTop) + 'px';
    ghost.style.width = rowRect.width + 'px';
    fresh.appendChild(ghost);
    var cleanup = function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); };
    ghost.addEventListener('animationend', cleanup);
    setTimeout(cleanup, 400);
    fresh.querySelectorAll('.row-item:not(.row-ghost)').forEach(function (node) {
      var key = rowKey(node);
      if (!key || before[key] === undefined) return;
      var delta = before[key] - node.getBoundingClientRect().top;
      if (!delta) return;
      node.style.transform = 'translateY(' + delta + 'px)';
      void node.offsetWidth;
      node.style.transition = 'transform var(--dur) var(--ease-out)';
      node.style.transform = '';
      node.addEventListener('transitionend', function done() { node.style.transition = ''; node.removeEventListener('transitionend', done); });
    });
  }

      if (button) setTool(button.getAttribute('data-tool'));
    });
    var toolbar = document.getElementById('floatTop');
    toolbar.addEventListener('click', function (event) {
      var option = event.target.closest('button[id]');
      if (!option) return;
      var id = option.id;
      if (id === 'gridBtn') {
        state.grid = !state.grid;
        savePrefs();
        renderChrome();
        renderStage();
      } else if (id === 'snapBtn') {
        state.snap = !state.snap;
        savePrefs();
        renderChrome();
        toast(state.snap ? 'Snap on \u00b7 ' + state.gridSize + ' px grid' : 'Snap off');
      } else if (id === 'axisBtn') {
        state.axisLock = !state.axisLock;
        renderChrome();
        toast(state.axisLock ? 'Axis lock on' : 'Axis lock off');
      } else if (id === 'exactBtn' || id === 'approxBtn') {
        setPrecision(id === 'exactBtn' ? 'exact' : 'approximate');
      } else if (id === 'addGridBtn') {
        state.grid = !state.grid;
        savePrefs();
        renderChrome();
        renderStage();
      }
    });

    document.addEventListener('click', function (event) {
      var mark = event.target.closest('[data-box]');
      if (mark) {
        selectBox(mark.getAttribute('data-box'), event.clientX, event.clientY, true);
        return;
      }
      var removeAdd = event.target.closest('[data-delete-add]');
      if (removeAdd) {
        var addId = removeAdd.getAttribute('data-delete-add');
        if (seenKeys) delete state.seen['a:' + addId];
        removeWithMotion(removeAdd.closest('.row-item'), function () { deleteAddDraft(addId); });
        return;
      }
      var remove = event.target.closest('[data-delete-draft]');
      if (remove) {
        var draftId = remove.getAttribute('data-delete-draft');
        if (seenKeys) delete state.seen['d:' + draftId];
        removeWithMotion(remove.closest('.row-item'), function () { deleteDraft(draftId); });
        return;
      }
      var addRow = event.target.closest('[data-add-draft]');
      if (addRow) {
        selectAddDraft(addRow.getAttribute('data-add-draft'));
        return;
      }
      var draftRow = event.target.closest('[data-draft]');
      if (draftRow) {
        selectDraft(draftRow.getAttribute('data-draft'));
        return;
      }
      var requestRow = event.target.closest('[data-request]');
      if (requestRow) {
        /* Verdict rows stay informational in Move mode; only drafts are selectable there. */
        if (state.mode === 'review') selectRequest(requestRow.getAttribute('data-request'));
        return;
      }
      if (event.target.closest('#changePop, #inspector, #layer, .sheet-bar, .header, .float')) return;
      if (state.selectedBox !== null) {
        state.selectedBox = null;
        render();
      }
    });

    /* Inspector controls are rebuilt on every render, so listen on the body once. */
    var body = document.getElementById('inspectorBody');
    body.addEventListener('click', function (event) {
      var target = event.target;
      if (target.closest('#precisionExact')) { setPrecision('exact'); return; }
      if (target.closest('#precisionApprox')) { setPrecision('approximate'); return; }
      var chipBtn = target.closest('[data-chip]');
      if (chipBtn) { useChip(chipBtn); return; }
      if (target.closest('#addDraft')) { addDraft(); return; }
      if (target.closest('#inspApprove')) { approveSelected(); return; }
      if (target.closest('#inspRequestChange')) { requestChange(findBox(state.selectedBox)); return; }
      if (target.closest('#inspCopyFix')) {
        var fixBox = findBox(state.selectedBox);
        if (fixBox) writeClipboard(fixText(fixBox), 'Fix message copied');
        return;
      }
      if (target.closest('#addDraftSave')) { saveAddDraft(); return; }

    input.hidden = true;
    document.body.appendChild(input);
    document.addEventListener('click', function (event) {
      if (event.target.closest('#loadReportBtn')) input.click();
    });
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function () {
        var data = null;
        try { data = JSON.parse(String(reader.result)); } catch (err) { data = null; }
        if (!data || typeof data !== 'object' || data.schema_version !== 1) {
          state.loadError = 'That file is not an Orphic Eyes report (schema version 1).';
          render();
          return;
        }
        state.loadError = null;
        if (state.source === 'images') { clearImageReport(); }
        state.loadedData = data;
        loadReport();
        render();
        toast('Report loaded');

  }

  var LOAD_TYPES = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/webp': 'webp' };

  var DIFF_FAIL_PERCENT = 5;

  /* Read one file into an image; reject wrong types, huge files and huge images. */
  function readImageFile(file) {
    return new Promise(function (resolve, reject) {
      if (!isImageFile(file)) { reject(new Error(MSG_TYPE)); return; }
      if (file.size > LOAD_MAX_BYTES) { reject(new Error('This file is over 20 MB. Use a smaller screenshot.')); return; }
      var url = localUrl(file);
      var img = new Image();
      img.onload = function () {
        if (img.naturalWidth > LOAD_MAX_SIDE || img.naturalHeight > LOAD_MAX_SIDE) {
          dropUrl(url);
          reject(new Error('This image is over 8000 px on a side. Use a smaller screenshot.'));
          return;
        }
        resolve({ name: file.name || 'image.png', size: file.size, w: img.naturalWidth, h: img.naturalHeight, url: url, img: img });
      };
      img.onerror = function () { dropUrl(url); reject(new Error(MSG_READ)); };
      img.src = url;
    });
  }

  function loaderFail(message) {
    state.loaderError = message;
    toast(message);
    render();
  }

  function setSlot(which, file) {
    return readImageFile(file).then(function (entry) {

      if (old) dropUrl(old.url);
      state.slots[which] = entry;
      state.loaderError = null;
      return entry;
    });

  /* Before/after from names when they say so, otherwise by file order. */
  function orderFiles(files) {
    var list = Array.prototype.slice.call(files || []);
    var hint = function (f) {
      var n = (f.name || '').toLowerCase();
      return /(before|baseline)/.test(n) ? 'before' : /(after|current)/.test(n) ? 'after' : null;
    };
    if (list.length >= 2) {
      var a = list[0], b = list[1];
      if (hint(a) === 'after' || hint(b) === 'before') return [b, a];
      return [a, b];
    }
    return list;
  }

  function loadFiles(files, target) {
    var list = Array.prototype.slice.call(files || []).filter(Boolean);
    if (!list.length) return;
    var bad = list.filter(function (f) { return !isImageFile(f); });
    if (bad.length === list.length) { loaderFail(MSG_TYPE); return; }
    list = list.filter(isImageFile);
    var jobs = [];
    if (list.length >= 2) {
      var pair = orderFiles(list);
      jobs.push(['before', pair[0]], ['after', pair[1]]);
    } else {
      var which = target || (!state.slots.before ? 'before' : !state.slots.after ? 'after' : null);
      if (!which) { loaderFail('Both slots are full. Replace or remove one first.'); return; }
      jobs.push([which, list[0]]);
    }
    Promise.all(jobs.map(function (job) { return setSlot(job[0], job[1]); }))
      .then(function () { return afterSlotsChanged(); })
      .catch(function (err) { loaderFail(err && err.message ? err.message : MSG_READ); });
    return jobs;
  }

  function removeSlot(which) {
    var old = state.slots[which];
    if (old) dropUrl(old.url);
    state.slots[which] = null;
    afterSlotsChanged();
    toast(slotName(which) + ' removed');
  }
  function swapSlots() {
    var b = state.slots.before;
    state.slots.before = state.slots.after;
    state.slots.after = b;

    toast('Before and After swapped');
  }

  function clearImageReport() {
    state.genUrls.forEach(dropUrl);
    state.genUrls = [];
    if (state.source === 'images') {
      state.source = null;
      state.loadedData = null;
      state.selectedBox = null;
      state.selectedRequest = null;
      loadReport();
    }
  }

  function afterSlotsChanged() {

    });
  }

  /* The engine's diff, in the browser: tolerance 0, 32 px tiles, 8-way clusters, 3x3 zones. */
  function diffBoxes(mask, W, H) {

    var clusters = [];
    var keys = Object.keys(tiles);
    keys.forEach(function (seed) {
      if (!tiles[seed]) return;

      delete tiles[seed];
      var box = [first[0], first[1], first[2], first[3]];
      var pending = [seed];
      while (pending.length) {

            var e = tiles[k];

            delete tiles[k];
            pending.push(k);
            box[0] = Math.min(box[0], e[0]); box[1] = Math.min(box[1], e[1]);
            box[2] = Math.max(box[2], e[2]); box[3] = Math.max(box[3], e[3]);

      for (var y = c[1]; y < c[3]; y++) for (var x = c[0]; x < c[2]; x++) if (mask[y * W + x]) inBox++;
      var col = Math.min(2, Math.floor(((c[0] + c[2]) / 2) * 3 / W));
      var row = Math.min(2, Math.floor(((c[1] + c[3]) / 2) * 3 / H));
      return { id: i + 1, x: c[0], y: c[1], w: c[2] - c[0], h: c[3] - c[1], zone: ZONES[row * 3 + col],

    });

  function buildImageReport() {

  /* ---------- slot UI (empty canvas and the Pages panel) ---------- */
  function slotBlock(which, compact) {
    var entry = state.slots[which];
    var wrap = el('div', 'slot-wrap' + (compact ? ' compact' : ''));
    var zone = el('button', 'slot' + (entry ? ' filled' : ''));
    zone.type = 'button';
    zone.setAttribute('data-slot', which);
    zone.setAttribute('aria-label', entry ? slotName(which) + ': ' + entry.name + ', ' + entry.w + ' by ' + entry.h + ' pixels. Choose another image' : slotName(which) + ': drop image or click to choose');
    zone.appendChild(el('span', 'slot-tag', slotName(which)));
    if (entry) {
      var thumb = el('img', 'slot-thumb');
      thumb.alt = '';
      thumb.src = entry.url;
      zone.appendChild(thumb);
      zone.appendChild(el('span', 'slot-name', entry.name));
      zone.appendChild(el('span', 'slot-meta num', entry.w + ' × ' + entry.h + ' px · ' + bytesText(entry.size)));
    } else {
      var ic = el('span', 'slot-icon');
      ic.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-image"/></svg>';
      zone.appendChild(ic);
      zone.appendChild(el('span', 'slot-cta', 'Drop image or click to choose'));
      zone.appendChild(el('span', 'slot-meta', 'PNG, JPG or WebP'));
    }
    wrap.appendChild(zone);
    if (entry) {
      var actions = el('div', 'slot-actions');
      var rep = el('button', 'btn ghost', 'Replace');
      rep.type = 'button';
      rep.setAttribute('data-slot-replace', which);
      rep.setAttribute('aria-label', 'Replace ' + slotName(which) + ' image');
      var rem = el('button', 'btn ghost', 'Remove');
      rem.type = 'button';
      rem.setAttribute('data-slot-remove', which);
      rem.setAttribute('aria-label', 'Remove ' + slotName(which) + ' image');

      actions.appendChild(rem);

  function bindImageLoader() {
    var picker = el('input');
    picker.type = 'file';
    picker.accept = 'image/png,image/jpeg,image/webp,.png,.jpg,.jpeg,.webp';
    picker.multiple = true;
    picker.hidden = true;
    document.body.appendChild(picker);
    var pickTarget = null;
    picker.addEventListener('change', function () {
      if (picker.files && picker.files.length) loadFiles(picker.files, picker.files.length > 1 ? null : pickTarget);
      picker.value = '';
    });
    function choose(which) { pickTarget = which; picker.click(); }

    document.addEventListener('click', function (event) {
      var t = event.target;
      var slot = t.closest('[data-slot]');
      if (slot) { choose(slot.getAttribute('data-slot')); return; }
      var rep = t.closest('[data-slot-replace]');
      if (rep) { choose(rep.getAttribute('data-slot-replace')); return; }
      var rem = t.closest('[data-slot-remove]');
      if (rem) { removeSlot(rem.getAttribute('data-slot-remove')); return; }
      var sw = t.closest('[data-slot-swap]');
      if (sw) {
        if (!state.slots.before && !state.slots.after) { toast('Load an image first'); return; }
        swapSlots();
        return;
      }
      if (t.closest('#trySample')) trySample();
      if (t.closest('#loadImagesBtn')) choose(null);
    });

    /* Drag and drop: files only. Dropped web addresses stay blocked, and a stray
       drop never navigates away from the page (that would lose the session). */
    function canLoad() { return !state.report || state.source === 'images'; }
    function hasFiles(dt) { return !!dt && Array.prototype.indexOf.call(dt.types || [], 'Files') !== -1; }
    document.addEventListener('dragover', function (event) {
      var dt = event.dataTransfer;
      if (!dt) return;
      event.preventDefault();
      var zone = event.target.closest && event.target.closest('[data-slot]');
      document.querySelectorAll('.slot.drag').forEach(function (n) { if (n !== zone) n.classList.remove('drag'); });
      if (zone && hasFiles(dt) && canLoad()) zone.classList.add('drag');
      dt.dropEffect = hasFiles(dt) && canLoad() ? 'copy' : 'none';
    });
    document.addEventListener('dragleave', function (event) {
      var zone = event.target.closest && event.target.closest('[data-slot]');
      if (zone && !zone.contains(event.relatedTarget)) zone.classList.remove('drag');

    document.addEventListener('drop', function (event) {
      var dt = event.dataTransfer;

      event.preventDefault();
      document.querySelectorAll('.slot.drag').forEach(function (n) { n.classList.remove('drag'); });
      if (!hasFiles(dt)) {
        var types = Array.prototype.slice.call(dt.types || []);
        if (types.indexOf('text/uri-list') !== -1 || types.indexOf('text/plain') !== -1) toast(MSG_URL);
        return;
      }
      if (!canLoad()) { toast('This report already has its images.'); return; }
      var zone = event.target.closest && event.target.closest('[data-slot]');
      loadFiles(dt.files, zone && dt.files.length === 1 ? zone.getAttribute('data-slot') : null);
    });

      if (!canLoad()) return false;
      var which = !state.slots.before ? 'before' : !state.slots.after ? 'after' : null;
      if (!which) { toast('Both slots are full. Replace or remove one first.'); return true; }
      setSlot(which, file).then(function () {
        toast('Pasted into ' + slotName(which));
        return afterSlotsChanged();
      }).catch(function (err) { loaderFail(err && err.message ? err.message : MSG_READ); });
      return true;
    });

    var items = event.clipboardData && event.clipboardData.items ? event.clipboardData.items : [];

    layout: [['match', 'Match', ['Structure only', 'Structure + spacing', 'Exact']],
             ['align', 'Alignment', ['Left', 'Center', 'Right']],
             ['columns', 'Columns', ['1', '2', '3', '4+']]],
    style: [['copy', 'Copy', ['Colors', 'Typography', 'Shadows & radius', 'Whole look'], true],
            ['strength', 'Strength', ['Subtle', 'Close match']],
            ['brand', 'Keep my brand colors', ['Yes', 'No']]],
    animation: [['effect', 'Effect', ['Fade', 'Slide', 'Scale', 'Rotate']],
                ['direction', 'Direction', ['Up', 'Down', 'Left', 'Right'], false, function (a) { return a.effect === 'Slide'; }],
                ['speed', 'Speed', ['Fast', 'Medium', 'Slow']],
                ['trigger', 'Trigger', ['On load', 'On scroll', 'On hover', 'On click']],
                ['repeat', 'Repeat', ['Once', 'Loop']]],
    interaction: [['trigger', 'Trigger', ['Hover', 'Click', 'Drag', 'Focus']],
                  ['feedback', 'Feedback', ['Color change', 'Lift/shadow', 'Scale', 'Show content']],
                  ['speed', 'Speed', ['Fast', 'Medium', 'Slow']]]
  };
  state.addRef = null;
  state.addKind = null;
  state.addAnswers = {};
  state.addRefError = null;
  state.addKindError = null;

  function kindLabel(kind) { for (var i = 0; i < KINDS.length; i++) if (KINDS[i][0] === kind) return KINDS[i][1]; return ''; }
  function refEntry(id) { return id && REFS[id] ? REFS[id] : null; }
  function refExtOf(file) {
    if (REF_TYPES[file.type]) return REF_TYPES[file.type];
    var m = /\.(png|jpe?g|webp|gif)$/i.exec(file.name || '');
    return m ? (m[1].toLowerCase() === 'jpeg' ? 'jpg' : m[1].toLowerCase()) : null;
  }
  /* The number a request has in the Copy prompt list: Moves first, then Adds. */
  function addRequestNumber(addId) {
    for (var i = 0; i < state.addDrafts.length; i++) {
      if (String(state.addDrafts[i].id) === String(addId)) return state.drafts.length + i + 1;
    }
    return requestCount() + 1; /* an Add that is not saved yet comes next */
  }
  function refName(refId, addId) {
    var entry = refEntry(refId);
    return entry ? 'ref-' + addRequestNumber(addId) + '.' + entry.ext : '';
  }
  function liveAddId() { return state.addSelected && findAddDraft(state.addSelected) ? state.addSelected : null; }

  function setReference(file, replace) {
    var ext = file ? refExtOf(file) : null;
    if (!ext) return refFail(REF_MSG_TYPE);
    if (file.size > REF_MAX) return refFail(REF_MSG_SIZE);
    if (state.addRef && refEntry(state.addRef) && !replace) return refFail(REF_MSG_ONE);
    var before = snapshotState();
    var old = state.addRef;
    var id = 'R' + (++refSeq);
    var url = URL.createObjectURL(file);
    LOCAL_URLS[url] = true;
    REFS[id] = { url: url, blob: file, ext: ext, size: file.size };
    state.addRef = id;
    state.addRefError = null;
    syncSelectedAdd();
    if (old && old !== id) releaseRef(old);
    commitHistory(before);
    renderInspector();
    renderLeft();
    toast('Reference added');
    return true;
  }
  function releaseRef(id) {
    var entry = REFS[id];
    if (!entry) return;
    /* Keep it while any saved request or the undo history still points at it. */
    var used = state.addDrafts.some(function (d) { return d.ref === id; }) || state.addRef === id ||
      (state.history || []).some(function (snap) { return snap.addRef === id || (snap.addDrafts || []).some(function (d) { return d.ref === id; }); });
    if (used) return;
    delete LOCAL_URLS[entry.url];
    try { URL.revokeObjectURL(entry.url); } catch (err) { /* ignore */ }
    delete REFS[id];
  }
  function removeReference() {
    var id = state.addRef;
    if (!id) return;
    var before = snapshotState();
    state.addRef = null;
    var draft = liveAddId() ? findAddDraft(liveAddId()) : null;
    if (draft) draft.ref = null;
    releaseRef(id);
    commitHistory(before);
    renderInspector();
    renderLeft();
    toast('Reference removed');
  }
  function refFail(message) {
    state.addRefError = message;
    renderInspector();
    toast(message);
    return false;
  }
  function downloadRef(refId, name) {
    var entry = refEntry(refId);
    if (!entry) { toast('This reference is no longer in this tab.'); return; }
    var a = document.createElement('a');
    a.href = entry.url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }
  function downloadAllRefs() {
    state.addDrafts.forEach(function (d) { if (refEntry(d.ref)) downloadRef(d.ref, refName(d.ref, d.id)); });
  }

  function setKind(kind) {
    var before = snapshotState();
    state.addKind = state.addKind === kind ? null : kind;
    state.addAnswers = {};
    state.addKindError = null;
    state.kindAnimate = !!state.addKind;
    syncSelectedAdd();
    commitHistory(before);
    renderInspector();
    renderLeft();
  }
  function setAnswer(key, value, multi) {
    var before = snapshotState();
    var answers = copy(state.addAnswers || {});
    if (multi) {
      var list = Array.isArray(answers[key]) ? answers[key] : [];
      var at = list.indexOf(value);
      if (at === -1) list.push(value); else list.splice(at, 1);
      if (list.length) answers[key] = list; else delete answers[key];
    } else if (answers[key] === value) {
      delete answers[key];
    } else {
      answers[key] = value;
    }
    if (key === 'effect' && answers.effect !== 'Slide') delete answers.direction;
    state.addAnswers = answers;
    state.kindAnimate = false;
    syncSelectedAdd();
    commitHistory(before);
    renderInspector();
  }
  /* "Effect: slide up · Speed: medium (~300ms) · Trigger: on scroll · Repeat: once" */
  function answersLine(kind, answers) {
    var qs = QUESTIONS[kind] || [];
    var parts = [];
    answers = answers || {};
    qs.forEach(function (q) {
      var key = q[0], value = answers[key];
      if (value === undefined || (Array.isArray(value) && !value.length)) return;
      if (key === 'direction') return;
      var text = Array.isArray(value) ? value.map(function (v) { return v.toLowerCase(); }).join(', ') : String(value).toLowerCase();
      if (key === 'effect' && value === 'Slide' && answers.direction) text += ' ' + String(answers.direction).toLowerCase();
      if (key === 'speed' && SPEED_MS[value]) text += ' (' + SPEED_MS[value] + ')';
      parts.push(q[1] + ': ' + text);
    });
    return parts.join(' · ');
  }

  /* ---------- Add panel sections ---------- */
  function refSection() {
    var block = el('div', 'block ref-block');
    block.appendChild(el('div', 'caption', 'Reference (optional)'));
    var entry = refEntry(state.addRef);
    if (entry) {
      var card = el('div', 'ref-card');
      var thumb = el('img', 'ref-thumb');
      thumb.alt = 'Reference image';
      thumb.src = entry.url;
      card.appendChild(thumb);
      var meta = el('div', 'ref-meta');
      meta.appendChild(el('span', 'ref-name', refName(state.addRef, liveAddId())));
      meta.appendChild(el('span', 'ref-size num', bytesText(entry.size)));
      card.appendChild(meta);
      var tools = el('div', 'ref-tools');
      var rep = el('button', 'icon-btn');
      rep.type = 'button';
      rep.id = 'refReplace';
      rep.setAttribute('aria-label', 'Replace reference');
      rep.setAttribute('data-tip', 'Replace reference');
      rep.innerHTML = '<svg class="ic" aria-hidden="true" viewBox="0 0 16 16"><path d="M13 5.5A5.5 5.5 0 0 0 3.3 4.2M3 2v2.5h2.5M3 10.5a5.5 5.5 0 0 0 9.7 1.3M13 14v-2.5h-2.5"/></svg>';
      var rem = el('button', 'icon-btn');
      rem.type = 'button';
      rem.id = 'refRemove';
      rem.setAttribute('aria-label', 'Remove reference');
      rem.setAttribute('data-tip', 'Remove reference');
      rem.innerHTML = '<svg class="ic" aria-hidden="true"><use href="#i-x"/></svg>';
      tools.appendChild(rep);
      tools.appendChild(rem);
      card.appendChild(tools);
      block.appendChild(card);
    } else {
      var drop = el('button', 'ref-drop');
      drop.type = 'button';
      drop.id = 'refDrop';
      drop.setAttribute('data-ref-drop', '');
      drop.setAttribute('aria-label', 'Add reference: drop an image or GIF, or paste with Ctrl+V');
      drop.appendChild(el('span', 'ref-drop-idle', 'Drop an image or GIF, or paste with Ctrl+V'));
      drop.appendChild(el('span', 'ref-drop-active', 'Drop to add reference'));
      block.appendChild(drop);
      var add = el('button', 'btn ref-add');
      add.type = 'button';
      add.id = 'refAdd';
      add.textContent = 'Add reference';
      block.appendChild(add);
    }
    if (state.addRefError) {
      var err = el('p', 'field-error', state.addRefError);
      err.setAttribute('role', 'alert');
      block.appendChild(err);
    }
    block.appendChild(el('p', 'hint-note', 'References stay in this tab only. Download them before you close it.'));
    return block;
  }
  function kindSection() {
    var block = el('div', 'block kind-block');
    var head = el('div', 'caption', 'What should the AI copy from it?');
    head.id = 'kindLabel';
    block.appendChild(head);
    var row = el('div', 'kind-row');
    row.setAttribute('role', 'radiogroup');
    row.setAttribute('aria-labelledby', 'kindLabel');
    KINDS.forEach(function (k) {
      var on = state.addKind === k[0];
      var b = el('button', 'kind-chip' + (on ? ' on' : ''), k[1]);
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-checked', on ? 'true' : 'false');
      b.setAttribute('data-kind', k[0]);
      row.appendChild(b);
    });
    block.appendChild(row);
    if (state.addKindError) {
      var err = el('p', 'field-error', state.addKindError);
      err.id = 'kindError';
      err.setAttribute('role', 'alert');
      block.appendChild(err);
    }
    if (state.addKind) {
      var qs = el('div', 'questions' + (state.kindAnimate ? ' fade-in' : ''));
      var answers = state.addAnswers || {};
      (QUESTIONS[state.addKind] || []).forEach(function (q) {
        if (q[4] && !q[4](answers)) return;
        var line = el('div', 'q-row');
        var label = el('span', 'q-label', q[1]);
        label.id = 'q-' + q[0];
        line.appendChild(label);
        var opts = el('div', 'q-opts');
        opts.setAttribute('role', q[3] ? 'group' : 'radiogroup');
        opts.setAttribute('aria-labelledby', label.id);
        q[2].forEach(function (value) {
          var picked = q[3] ? (Array.isArray(answers[q[0]]) && answers[q[0]].indexOf(value) !== -1) : answers[q[0]] === value;
          var b = el('button', 'q-chip' + (picked ? ' on' : ''), value);
          b.type = 'button';
          b.setAttribute(q[3] ? 'aria-pressed' : 'aria-checked', picked ? 'true' : 'false');
          if (!q[3]) b.setAttribute('role', 'radio');
          b.setAttribute('data-answer', q[0]);
          b.setAttribute('data-value', value);
          if (q[3]) b.setAttribute('data-multi', '');
          opts.appendChild(b);
        });
        line.appendChild(opts);
        qs.appendChild(line);
      });
      block.appendChild(qs);
    }
    return block;
  }

  function bindReferences() {
    var picker = el('input');
    picker.type = 'file';
    picker.accept = 'image/png,image/jpeg,image/webp,image/gif,.png,.jpg,.jpeg,.webp,.gif';
    picker.hidden = true;
    picker.id = 'refPicker';
    document.body.appendChild(picker);
    var replacing = false;
    picker.addEventListener('change', function () {
      var file = picker.files && picker.files[0];
      if (file) setReference(file, replacing);
      picker.value = '';
    });
    var body = document.getElementById('inspectorBody');
    body.addEventListener('click', function (event) {
      var t = event.target;
      if (t.closest('#refAdd') || t.closest('#refDrop')) { replacing = false; picker.click(); return; }
      if (t.closest('#refReplace')) { replacing = true; picker.click(); return; }
      if (t.closest('#refRemove')) { removeReference(); return; }
      var kind = t.closest('[data-kind]');
      if (kind) { setKind(kind.getAttribute('data-kind')); return; }
      var ans = t.closest('[data-answer]');
      if (ans) { setAnswer(ans.getAttribute('data-answer'), ans.getAttribute('data-value'), ans.hasAttribute('data-multi')); return; }
    });
    /* The drop zone takes its own drop, so Load images never sees it. */
    body.addEventListener('dragover', function (event) {
      var zone = event.target.closest('[data-ref-drop]');
      if (!zone) return;
      event.preventDefault();
      event.stopPropagation();
      zone.classList.add('drag');
      if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy';
    });
    body.addEventListener('dragleave', function (event) {
      var zone = event.target.closest('[data-ref-drop]');
      if (zone && !zone.contains(event.relatedTarget)) zone.classList.remove('drag');
    });
    body.addEventListener('drop', function (event) {
      var zone = event.target.closest('[data-ref-drop]');
      if (!zone) return;
      event.preventDefault();
      event.stopPropagation();
      zone.classList.remove('drag');
      var files = event.dataTransfer && event.dataTransfer.files;
      if (files && files.length) setReference(files[0], false);
      else toast(REF_MSG_TYPE);
    });
    body.addEventListener('click', function (event) {
      var dl = event.target.closest('[data-ref-download]');
      if (dl) { var d = findAddDraft(dl.getAttribute('data-ref-download')); if (d) downloadRef(d.ref, refName(d.ref, d.id)); }
    });
    document.getElementById('requestList').addEventListener('click', function (event) {
      var dl = event.target.closest('[data-ref-download]');
      if (!dl) return;
      event.stopPropagation();
      var d = findAddDraft(dl.getAttribute('data-ref-download'));
      if (d) downloadRef(d.ref, refName(d.ref, d.id));
    });
    /* Paste: the reference wins only while the Add panel is open and focused. */
    claimPaste(function (file) {
      var active = document.activeElement;
      var focused = active && document.getElementById('inspector').contains(active);
      if (state.mode !== 'add' || !state.addSelection || !focused) return false;
      setReference(file, false);
      return true;
    }, true);
  }


  function setPrecision(value) {
    if (state.precision === value) return;
    var before = state.selection ? snapshotState() : null;
    state.precision = value;
    if (state.selection) syncSelectedDraft();
    if (before) commitHistory(before);
    render();
    /* The toolbar choice IS the saved preference: Settings shows the same value. */
    prefs.defaultPrecision = state.precision;
    savePrefs();
    refreshSettings();
    toast(value === 'exact' ? 'Exact · 2 px' : 'Approx · 8 px');
  }

  loadPrefs();
  loadReport();
  initEvents();
  applyTheme(prefs.theme);
  applyTextSize(state.textSize);
  render();
  window.addEventListener('load', function () { renderStage(); renderStatusbar(); renderChrome(); maybeStartTour(); });
})();
</script>
</body>
