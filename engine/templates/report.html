/* =====================================================================
   LAYOUT LOCK — every size, position and colour lives here.
   Change one value to adjust the whole app; nothing below hard-codes these.
   ===================================================================== */
:root{
  /* shell sizes */
  --header-h:48px;
  --status-h:28px;
  --sidebar-w:260px;
  --rail-w:56px;
  --inspector-w:300px;
  --float-gap:12px;          /* distance of floating bars from the canvas edges */
  --stage-pad-top:64px;      /* room kept free for the floating view bar */
  --stage-pad-bottom:76px;   /* room kept free for the tool dock */
  --stage-pad-x:24px;
  --sheet-bar-h:44px;        /* mobile bottom-sheet tab bar */
  --ruler:23px;
  /* spacing (8px grid, 4 for tight gaps) */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  /* radius */
  --r-input:6px;--r-btn:8px;--r-panel:12px;--r-pill:999px;
  /* hit areas */
  --hit:32px;--hit-dense:28px;
  /* type — the S/M/L control changes ONLY --fs-scale */
  --fs-scale:1;
  --fs-cap:calc(11px * var(--fs-scale));
  --fs-sec:calc(12px * var(--fs-scale));
  --fs-body:calc(13px * var(--fs-scale));
  --fs-panel:calc(14px * var(--fs-scale));
  --fs-section:calc(16px * var(--fs-scale));
  --fs-empty:calc(20px * var(--fs-scale));
  --fs-mono:calc(12px * var(--fs-scale));
  --fs-ruler:calc(11px * var(--fs-scale));
  --lh-tight:1.35;--lh-body:1.5;
  --w-regular:400;--w-medium:500;--w-strong:600;
  --font-ui:"Montserrat","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  /* motion */
  --ease:cubic-bezier(.2,.7,.3,1);--t:170ms;
  /* motion tokens: every animation below uses these; reduced motion turns them all off */
  --dur-fast:120ms;--dur:200ms;--dur-slow:300ms;--dur-panel:160ms;
  --ease-out:cubic-bezier(.2,.8,.2,1);

  /* colours — light */
  color-scheme:light;
  --bg:#F7F7F5;--panel:#FFFFFF;--surface:#F1F0ED;--soft:#FAFAF8;--hover:rgba(31,31,34,.05);--active:rgba(31,31,34,.07);
  --line:#E7E6E2;--line2:#D8D7D2;--ink:#1F1F22;--muted:#6B6F76;--faint:#8E9197;
  --canvas:#EDECE8;--dot:rgba(31,31,34,.11);--pill-on:#FFFFFF;--input:#FFFFFF;
  --bronze:#C58B3E;--bronze-hover:#B67C30;--on-bronze:#1B1B19;--logo-box:#1B1B19;
  --blue:#2F80FF;--blue-ink:#1D63D3;--blue-bg:#EEF4FF;--blue-line:#C5DAFB;--focus:#2F80FF;
  --guide:#E5359B;
  --add:#7A4FE0;--add-bg:#F2ECFE;--add-fill:rgba(122,79,224,.08);
  --green:#188951;--green-bg:#E5F5EC;--amber:#A84F07;--amber-dot:#D99A2B;--amber-bg:#FDF1DE;--red:#C2383D;--red-bg:#FDECEC;
  --chip-gray:#5F636A;--chip-gray-bg:#EEEEF0;
  --ruler-bg:#F4F4F2;--ruler-line:#D5D5D1;--ruler-ink:#80838A;
  --toast-bg:#26262A;--toast-ink:#FFFFFF;
  --shadow-float:0 1px 2px rgba(20,20,25,.06),0 4px 16px rgba(20,20,25,.08);
  --shadow-pop:0 12px 36px rgba(20,20,25,.18),0 2px 6px rgba(20,20,25,.08);
  --scrim:rgba(20,20,25,.32);
  font-family:var(--font-ui);font-synthesis:none}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#141416;--panel:#1C1C1F;--surface:#26262A;--soft:#18181B;--hover:rgba(255,255,255,.06);--active:rgba(255,255,255,.09);
  --line:#2C2C31;--line2:#3A3A41;--ink:#ECECEF;--muted:#A6A9B0;--faint:#8D9097;
  --canvas:#101012;--dot:rgba(255,255,255,.07);--pill-on:#34343A;--input:#202024;
  --bronze:#C58B3E;--bronze-hover:#D29A4E;--on-bronze:#1B1B19;--logo-box:#1B1B19;
  --blue:#4C8DFF;--blue-ink:#9BC0FF;--blue-bg:rgba(76,141,255,.16);--blue-line:rgba(76,141,255,.42);--focus:#6EA4FF;
  --add:#B59CFF;--add-bg:rgba(181,156,255,.16);--add-fill:rgba(181,156,255,.12);
  --green:#5BC992;--green-bg:rgba(91,201,146,.15);--amber:#F2B55E;--amber-dot:#F2B55E;--amber-bg:rgba(242,181,94,.15);--red:#FF8589;--red-bg:rgba(255,133,137,.15);
  --chip-gray:#B9BCC2;--chip-gray-bg:#2E2E34;
  --ruler-bg:#202024;--ruler-line:#36363C;--ruler-ink:#A0A3AA;
  --toast-bg:#ECECEF;--toast-ink:#18181B;
  --shadow-float:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.45);
  --shadow-pop:0 14px 40px rgba(0,0,0,.55);
  --scrim:rgba(0,0,0,.55)}

/* ---------- base ---------- */
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;font-weight:var(--w-regular)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{opacity:.42;cursor:not-allowed}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r-input)}
.mono{font-family:var(--font-mono);font-size:var(--fs-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.hidden,[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
/* Reduced motion: no animation or transition anywhere; every state still changes, instantly.
   (The app has no separate Reduce motion setting; the OS setting is the switch.) */
/* ---------- micro-animations (opacity, transform, stroke-dashoffset only) ---------- */
/* Each keyframe animates FROM a hidden start TO the element's normal style,
   so with animation turned off the final state is simply there. */
@keyframes oe-draw{from{stroke-dashoffset:1}}
@keyframes oe-row-in{from{opacity:0;transform:translateY(4px)}}
@keyframes oe-row-out{to{opacity:0;transform:scale(.98)}}
@keyframes oe-pop{50%{transform:scale(1.15)}}
@keyframes oe-ants{to{stroke-dashoffset:-10}}
@keyframes oe-panel-up{from{opacity:0;transform:translateY(6px)}}
@keyframes oe-panel-left{from{opacity:0;transform:translateX(-8px)}}
@keyframes oe-panel-right{from{opacity:0;transform:translateX(8px)}}
@keyframes oe-fade-in{from{opacity:0}}
@keyframes oe-shimmer{to{transform:translateX(100%)}}
/* 1. copy icon morphs into a drawn check */
.copy-ic g,.copy-ic path{transform-box:fill-box;transform-origin:center}
.copy-ic .ic-copy{transition:opacity var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}
.copy-ic .ic-check{opacity:0;stroke-dasharray:1;stroke-dashoffset:1}
#copyMain.copied .ic-copy{opacity:0;transform:scale(.6)}
#copyMain.copied .ic-check{opacity:1;stroke-dashoffset:0;animation:oe-draw var(--dur-slow) var(--ease-out)}
/* 2. new request row + count pop */
.row-new{animation:oe-row-in var(--dur) var(--ease-out)}
.badge.pop{animation:oe-pop var(--dur) var(--ease-out)}
/* 4. marching ants on the selected area */
.ants{position:absolute;left:-2px;top:-2px;width:calc(100% + 4px);height:calc(100% + 4px);overflow:visible;pointer-events:none;z-index:1}
.ants rect{fill:none;stroke:#2F80FF;stroke-width:2;stroke-dasharray:6 4;animation:oe-ants 1s linear infinite}
.add-sel .ants rect{stroke:var(--add)}
.has-ants,.mark-box.selected{border-color:transparent!important}
/* 5. deleted row fades out while the rest slide up */
#requestList{position:relative}
.row-ghost{position:absolute;margin:0;pointer-events:none;animation:oe-row-out var(--dur-fast) var(--ease-out) forwards}
/* 6. Done: a circle turns into a drawn green check */
.done-ic{width:11px;height:11px;margin-right:4px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
.done-ic circle{opacity:0;transform-box:fill-box;transform-origin:center}
.done-ic path{stroke-dasharray:1;stroke-dashoffset:0}
.done-ic.anim circle{animation:oe-circle var(--dur-slow) var(--ease-out) backwards}
@keyframes oe-circle{from{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.6)}}
.done-ic.anim path{animation:oe-draw var(--dur-slow) var(--ease-out) var(--dur-fast) backwards}
/* 7. panels slide + fade in */
.modal,.palette,.menu,.tour{animation:oe-panel-up var(--dur-panel) var(--ease-out)}
.inspector.panel-in .inspector-header,.inspector.panel-in .summary-card,.inspector.panel-in .inspector-body{animation:oe-panel-right var(--dur-panel) var(--ease-out)}
.sb-body.panel-in{animation:oe-panel-left var(--dur-panel) var(--ease-out)}
/* 8. image loading: shimmer, then the picture fades in */
.rv-pic.loading::after{content:"";position:absolute;inset:0;z-index:4;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-100%);animation:oe-shimmer 1s linear infinite}
.rv-pic.loading{background:var(--surface)}
img.pending{opacity:0}
img.img-in{animation:oe-fade-in var(--dur) var(--ease-out)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ---------- app shell ---------- */
.app{height:100%;display:grid;grid-template-rows:var(--header-h) minmax(0,1fr) var(--status-h);min-height:0}
.main{min-height:0;display:grid;grid-template-columns:var(--sidebar-cur,var(--sidebar-w)) minmax(0,1fr) var(--inspector-cur,var(--inspector-w));position:relative}
body.sb-collapsed{--sidebar-cur:var(--rail-w)}
body.insp-closed{--inspector-cur:0px}

/* ---------- header ---------- */
.header{display:grid;grid-template-columns:minmax(max-content,1fr) auto minmax(max-content,1fr);align-items:center;gap:var(--s3);padding:0 var(--s3) 0 var(--s4);background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.hd-left,.hd-right{display:flex;align-items:center;gap:var(--s2);min-width:0}
.hd-right{justify-content:flex-end}
.brand{display:flex;align-items:center;gap:var(--s2);flex:none;margin-right:var(--s2)}
.logo-wrap{width:28px;height:28px;flex:none;background:var(--logo-box);border-radius:7px;padding:3px;display:flex}
.logo-wrap svg{display:block;width:100%;height:100%}
.brand-name{font-size:var(--fs-section);font-weight:var(--w-strong);letter-spacing:-.01em;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:2px;margin:0 0 0 var(--s2);padding:0;list-style:none;flex:none}
.step{display:flex;align-items:center;gap:6px;padding:0 6px;color:var(--muted);font-size:var(--fs-sec);font-weight:var(--w-medium);white-space:nowrap}
.step+.step::before{content:"";width:14px;height:1px;background:var(--line2);margin-right:4px}
.step-dot{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--muted);font-size:var(--fs-cap);font-weight:var(--w-strong);flex:none}
.step-dot svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.step.done .step-dot{background:var(--green-bg);color:var(--green)}
.step.current{color:var(--ink)}
.step.current .step-dot{background:#2F80FF;color:#fff}
.stepper-short{display:none;font-size:var(--fs-sec);color:var(--muted);white-space:nowrap}
@media (max-width:1439px){.step-label{display:none}.step+.step::before{width:8px}}
@media (max-width:639px){.stepper{display:none}.stepper-short{display:inline}}
.page-tabs{display:flex;align-items:stretch;height:var(--header-h);gap:var(--s1);min-width:0;overflow:hidden}
.page-tab{position:relative;display:flex;align-items:center;padding:0 var(--s3);font-size:var(--fs-body);color:var(--muted);white-space:nowrap;font-weight:var(--w-medium)}
.page-tab:hover{color:var(--ink)}
.page-tab.on{color:var(--ink);font-weight:var(--w-strong)}
.page-tab.on::after{content:"";position:absolute;left:var(--s2);right:var(--s2);bottom:-1px;height:2px;border-radius:2px;background:var(--bronze)}

/* segmented control */
.seg{display:inline-flex;align-items:center;padding:3px;gap:2px;border-radius:var(--r-btn);background:var(--surface)}
.seg button{min-height:var(--hit-dense);padding:0 var(--s4);border-radius:6px;white-space:nowrap;color:var(--muted);font-size:var(--fs-body);font-weight:var(--w-medium);transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.seg button:hover:not(.on){color:var(--ink);background:var(--hover)}
.seg button.on{background:var(--pill-on);color:var(--ink);font-weight:var(--w-strong);box-shadow:0 1px 2px rgba(0,0,0,.08),0 1px 6px rgba(0,0,0,.06)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:var(--hit);padding:0 var(--s3);border-radius:var(--r-btn);border:1px solid var(--line2);background:var(--panel);white-space:nowrap;font-size:var(--fs-body);font-weight:var(--w-medium);transition:background var(--t) var(--ease),border-color var(--t) var(--ease)}
.btn:hover:not(:disabled){background:var(--hover)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);background:var(--hover)}
.btn.primary{background:var(--bronze);border-color:var(--bronze);color:var(--on-bronze);font-weight:var(--w-strong);padding:0 var(--s4)}
.btn.primary:hover:not(:disabled){background:var(--bronze-hover);border-color:var(--bronze-hover)}
.btn.primary[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
[aria-disabled="true"]:not(.btn.primary){opacity:.45;cursor:not-allowed}
textarea[aria-disabled="true"],input[aria-disabled="true"],select[aria-disabled="true"]{opacity:.55}
.link-btn{display:inline-flex;align-items:center;gap:6px;min-height:var(--hit-dense);padding:0 var(--s2);border-radius:6px;color:var(--blue-ink);font-size:var(--fs-sec);font-weight:var(--w-medium)}
.link-btn:hover{background:var(--hover)}
.req-foot{display:flex;justify-content:flex-start;padding:var(--s2) 0 0}
.prompt-text{margin:0;padding:var(--s3) var(--s4);font-family:var(--font-mono);font-size:var(--fs-mono);line-height:var(--lh-body);white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;color:var(--ink);background:var(--soft);flex:1;min-height:0;user-select:text}
.modal-actions{display:flex;justify-content:flex-end;gap:var(--s2);padding:var(--s3) var(--s4);border-top:1px solid var(--line)}
.info-card{margin-top:var(--s3);padding:var(--s3);border-radius:var(--r-btn);background:var(--surface);color:var(--muted);font-size:var(--fs-sec);line-height:var(--lh-body)}
.info-card p{margin:0 0 var(--s2)}
.menu button[aria-checked="true"]{font-weight:var(--w-strong)}
.menu .mark-slot{width:16px;flex:none;display:inline-flex;color:var(--blue-ink)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:var(--w-strong)}
.btn.blue:hover:not(:disabled){filter:brightness(.95)}
.btn.block{width:100%}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:var(--hit);height:var(--hit);border-radius:var(--r-btn);color:var(--muted);flex:none;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--ink)}
.icon-btn.on{color:var(--blue-ink);background:var(--blue-bg)}
.hd-divider{width:1px;height:20px;background:var(--line);flex:none;margin:0 var(--s1)}

/* status chip */
.status-chip{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 var(--s2);border-radius:var(--r-pill);background:var(--chip-gray-bg);color:var(--chip-gray);font-size:var(--fs-sec);font-weight:var(--w-medium);white-space:nowrap;cursor:default}
.status-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.8}
.status-chip.pass{background:var(--green-bg);color:var(--green)}
.status-chip.check{background:var(--amber-bg);color:var(--amber)}
.status-chip.fail{background:var(--red-bg);color:var(--red)}
.status-chip.draft{background:var(--blue-bg);color:var(--blue-ink)}
.capture-chip{display:inline-flex;align-items:center;gap:6px;height:var(--hit);padding:0 var(--s3);border-radius:var(--r-btn);background:var(--surface);color:var(--ink);font-size:var(--fs-body);white-space:nowrap;cursor:default}
.capture-chip .num{color:var(--muted)}

/* ---------- sidebar ---------- */
.sidebar{min-width:0;min-height:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.sb-tabs{display:flex;align-items:center;gap:2px;padding:var(--s2);flex:none}
.sb-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:var(--hit);border-radius:var(--r-btn);color:var(--muted);font-size:var(--fs-body);font-weight:var(--w-medium);white-space:nowrap;position:relative}
.sb-tab:hover{background:var(--hover);color:var(--ink)}
.sb-tab.on{background:var(--active);color:var(--ink);font-weight:var(--w-strong)}
.sb-tab .lbl{display:none}
.sb-tab .badge{min-width:18px;height:18px;padding:0 5px;border-radius:var(--r-pill);background:var(--surface);color:var(--muted);font-size:var(--fs-cap);display:inline-flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums;font-weight:var(--w-strong)}
.sb-tab.on .badge{background:var(--panel)}
.sb-toggle{flex:none}
.sb-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 var(--s2) var(--s2)}
.sb-pane{display:flex;flex-direction:column;gap:var(--s1)}
.group-label{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s3) var(--s2) var(--s1);font-size:var(--fs-cap);font-weight:var(--w-strong);letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.group-label .num{letter-spacing:0}
.sb-foot{flex:none;display:flex;align-items:center;gap:2px;padding:var(--s2);border-top:1px solid var(--line)}
.sb-foot .btn.ghost{flex:1;justify-content:flex-start;padding:0 var(--s2)}
/* rail (collapsed) */
body.sb-collapsed .sb-tabs{flex-direction:column;padding:var(--s2) 0;gap:var(--s1)}
body.sb-collapsed .sb-tab{width:40px;flex:none}
body.sb-collapsed .sb-tab .lbl,body.sb-collapsed .sb-tab .badge,body.sb-collapsed .sb-body,body.sb-collapsed .sb-foot .lbl{display:none}
body.sb-collapsed .sb-tab .dot-badge{display:block}
body.sb-collapsed .sb-foot{flex-direction:column;border-top:0;margin-top:auto}
body.sb-collapsed .sb-foot .btn.ghost{flex:none;width:40px;justify-content:center;padding:0}
body.sb-collapsed .sb-toggle{order:-1;margin-bottom:var(--s1)}
body.sb-collapsed .sidebar{align-items:center}
.dot-badge{display:none;position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;background:var(--amber-dot)}

/* pages */
.page-item{display:flex;align-items:center;gap:var(--s2);padding:6px var(--s2);border-radius:var(--r-btn);width:100%;text-align:left;min-height:44px}
.page-item:hover{background:var(--hover)}
.page-item.active{background:var(--active)}
.page-thumb{width:44px;height:28px;border-radius:4px;flex:none;background:var(--surface) center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--line)}
.page-meta{display:flex;flex-direction:column;min-width:0;flex:1;line-height:var(--lh-tight)}
.page-name{font-weight:var(--w-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page-size{font-size:var(--fs-sec);color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.dot.pass{background:var(--green)}.dot.check{background:var(--amber-dot)}.dot.fail{background:var(--red)}

/* area map: a 3x3 grid drawn over a tiny page thumbnail */
.mini-map{position:relative;margin:0 var(--s2) var(--s1);aspect-ratio:16/9;border-radius:var(--r-btn);background:var(--surface) center/100% 100% no-repeat;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.zone-cell{position:relative;border-right:1px dashed rgba(127,127,127,.35);border-bottom:1px dashed rgba(127,127,127,.35);transition:background var(--t) var(--ease)}
.zone-cell:nth-child(3n){border-right:0}.zone-cell:nth-child(n+7){border-bottom:0}
.zone-cell:hover{background:rgba(47,128,255,.10)}
.zone-cell.selected{background:rgba(47,128,255,.16);box-shadow:inset 0 0 0 2px var(--blue)}
.zone-cell.hit::after{content:"";position:absolute;top:50%;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--amber-dot);box-shadow:0 0 0 2px #fff}
.zone-cell.hit.expected::after,.zone-cell.hit.approved::after{background:var(--green)}
.zone-cell:focus-visible{outline-offset:-2px;border-radius:0}
.map-legend{display:flex;justify-content:space-between;gap:var(--s2);padding:0 var(--s2) var(--s1);font-size:var(--fs-sec);color:var(--muted)}
.map-legend button{color:var(--blue-ink);font-size:var(--fs-sec)}

/* list rows */
.row-item{position:relative;display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:var(--s2);border-radius:var(--r-btn);min-height:44px;cursor:pointer;min-width:0}
.row-item:hover{background:var(--hover)}
.row-item.selected{background:var(--blue-bg)}
.row-item.zone-hit{box-shadow:inset 2px 0 0 var(--blue)}
.row-item.flash{animation:flash .7s ease-out 1}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px rgba(47,128,255,.55)}100%{box-shadow:inset 0 0 0 2px rgba(47,128,255,0)}}
.line1{display:flex;align-items:center;gap:var(--s2);min-width:0;line-height:var(--lh-tight)}
.id-pill{flex:none;min-width:22px;height:20px;padding:0 5px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs-cap);font-weight:var(--w-strong);color:var(--muted);background:var(--surface);font-variant-numeric:tabular-nums}
.id-pill.muted{background:transparent;color:var(--faint);font-weight:var(--w-medium);padding:0}
.list-name{flex:1;min-width:0;font-weight:var(--w-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-sub{font-size:var(--fs-sec);color:var(--muted);line-height:var(--lh-tight);padding-left:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-actions{position:absolute;right:6px;top:6px;display:flex;gap:2px;opacity:0;transition:opacity var(--t) var(--ease)}
.row-item:hover .row-actions,.row-item:focus-within .row-actions,.row-item.selected .row-actions{opacity:1}
.row-item:hover .chip.hide-on-hover,.row-item:focus-within .chip.hide-on-hover,.row-item.selected .chip.hide-on-hover{visibility:hidden}
.row-x{width:var(--hit-dense);height:var(--hit-dense);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:var(--panel)}
.row-x:hover{color:var(--ink);background:var(--surface)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r-pill);font-size:var(--fs-cap);font-weight:var(--w-strong);white-space:nowrap;flex:none;background:var(--chip-gray-bg);color:var(--chip-gray)}
.chip.approved,.chip.done,.chip.pass{background:var(--green-bg);color:var(--green)}
.chip.expected{background:var(--blue-bg);color:var(--blue-ink)}
.chip.unexpected,.chip.check{background:var(--amber-bg);color:var(--amber)}
.chip.not_done,.chip.fail{background:var(--red-bg);color:var(--red)}
.chip.skipped{background:transparent;color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.chip.draft{background:var(--blue-bg);color:var(--blue-ink)}
.chip.unverified{background:var(--chip-gray-bg);color:var(--chip-gray);margin-left:6px}

/* guides / empty states */
.guide{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s4) var(--s2);color:var(--muted);font-size:var(--fs-body)}
.guide strong{color:var(--ink);font-weight:var(--w-strong);font-size:var(--fs-panel)}
.guide ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:var(--s2)}
.guide li{display:flex;gap:var(--s2);align-items:flex-start;line-height:var(--lh-tight)}
.guide li b{flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:var(--fs-cap);font-weight:var(--w-strong)}
.empty-note{color:var(--muted);font-size:var(--fs-body);line-height:var(--lh-body);margin:0 0 var(--s3);padding:0 var(--s2)}

/* ---------- canvas ---------- */
.canvas{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:var(--canvas);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:16px 16px}
.stage-scroller{position:absolute;inset:0;overflow:auto;display:flex;padding:var(--stage-pad-top) var(--stage-pad-x) var(--stage-pad-bottom)}
body.mode-review .stage-scroller{--stage-pad-bottom:64px}
/* No report: nothing floats over the canvas, so the empty state sits dead centre in every mode. */
body.no-report .stage-scroller,body.no-report.mode-review .stage-scroller{--stage-pad-bottom:var(--stage-pad-top)}
.stage-inner{flex:none;margin:auto;display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
.float{position:absolute;z-index:20;display:flex;align-items:center;gap:2px;padding:4px;border-radius:var(--r-pill);background:var(--panel);box-shadow:var(--shadow-float);max-width:calc(100% - 2 * var(--float-gap))}
.float-top{top:var(--float-gap);left:50%;transform:translateX(-50%)}
.float-group{display:flex;align-items:center;gap:2px}
.float .seg{background:transparent;padding:0}
.float .seg button{border-radius:var(--r-pill);padding:0 var(--s3);min-height:var(--hit-dense);font-size:var(--fs-body)}
.float .seg button.on{background:var(--surface);box-shadow:none}
.float-sep{width:1px;height:18px;background:var(--line);margin:0 var(--s1);flex:none}
.opt{display:inline-flex;align-items:center;gap:6px;min-height:var(--hit-dense);padding:0 var(--s3);border-radius:var(--r-pill);color:var(--muted);font-size:var(--fs-body);font-weight:var(--w-medium);white-space:nowrap}
.opt:hover{background:var(--hover);color:var(--ink)}
.opt.on{background:var(--blue-bg);color:var(--blue-ink)}
.dock{bottom:var(--float-gap);left:50%;transform:translateX(-50%);border-radius:14px;padding:4px}
.tool{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--s3);border-radius:10px;color:var(--muted);font-size:var(--fs-body);font-weight:var(--w-medium);white-space:nowrap}
.tool:hover{background:var(--hover);color:var(--ink)}
.tool.on{background:var(--blue-bg);color:var(--blue-ink)}
.zoom-pill{right:var(--float-gap);bottom:var(--float-gap)}
.zoom-pill .opt{padding:0 10px}
.zoom-pill .zoom-now{min-width:48px;justify-content:center;color:var(--ink);font-variant-numeric:tabular-nums;cursor:default;padding:0 var(--s2)}
.zoom-pill .zoom-now:hover{background:transparent}
/* tooltips */
[data-tip]{position:relative}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--toast-bg);color:var(--toast-ink);font-size:var(--fs-sec);font-weight:var(--w-medium);line-height:1.3;padding:5px 8px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity 120ms var(--ease);max-width:280px}
.tip.show{opacity:1}
.tip kbd{font-family:var(--font-mono);font-size:var(--fs-cap);opacity:.75;margin-left:6px}

/* empty canvas */
.loader{display:flex;flex-direction:column;align-items:center;gap:var(--s3);width:min(680px,calc(100vw - 48px));text-align:center;padding:var(--s4)}
.steps-guide{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2) var(--s4);margin:0;padding:0;list-style:none;color:var(--muted);font-size:var(--fs-body)}
.steps-guide li{display:flex;align-items:center;gap:6px}
.steps-guide b{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--surface);color:var(--ink);font-size:var(--fs-cap);font-weight:var(--w-strong)}
.steps-guide li.now{color:var(--ink);font-weight:var(--w-medium)}
.steps-guide li.now b{background:#2F80FF;color:#fff}
.loader-title{font-size:var(--fs-empty);font-weight:var(--w-strong);color:var(--ink);line-height:1.25;text-wrap:balance}
.loader-sub{color:var(--muted);max-width:460px}
.slots{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:var(--s3);align-items:center;width:100%;margin-top:var(--s2)}
.slot-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:176px;padding:var(--s3);border:1.5px dashed var(--line2);border-radius:var(--r-panel);background:var(--panel);color:var(--muted);text-align:center;min-width:0;transition:border-color var(--dur-fast) var(--ease-out),background-color var(--dur-fast) var(--ease-out)}
.slot:hover,.slot.drag{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-ink)}
.slot.filled{border-style:solid;border-color:var(--line)}
.slot-tag{font-size:var(--fs-cap);font-weight:var(--w-strong);letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.slot-icon{width:40px;height:40px;border-radius:12px;background:var(--surface);display:flex;align-items:center;justify-content:center;margin:4px 0}
.slot-cta{font-weight:var(--w-medium);color:var(--ink)}
.slot-meta{font-size:var(--fs-sec);color:var(--muted)}
.slot-name{font-weight:var(--w-medium);color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot-thumb{display:block;max-width:100%;max-height:96px;border-radius:6px;box-shadow:0 0 0 1px var(--line);background:#fff}
.slot-actions{display:flex;justify-content:center;gap:4px}
.slot-actions .btn{min-height:var(--hit-dense);padding:0 var(--s2);font-size:var(--fs-sec)}
.slot-swap{align-self:center}
.slot-swap[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.slots.compact{grid-template-columns:minmax(0,1fr);gap:6px;margin:0 0 var(--s2);padding:0 var(--s1)}
.slots.compact .slot{min-height:0;padding:var(--s2);flex-direction:row;flex-wrap:wrap;justify-content:flex-start;text-align:left;gap:2px 8px}
.slots.compact .slot-thumb{max-height:36px;max-width:64px}
.slots.compact .slot-icon{display:none}
.slots.compact .slot-swap{justify-self:center;transform:rotate(90deg)}
.slots.compact .slot-actions{justify-content:flex-start}
@media (max-width:767px){.slots{grid-template-columns:minmax(0,1fr)}.slot{min-height:120px}.slot-swap{justify-self:center;transform:rotate(90deg)}}
.placeholder{display:flex;flex-direction:column;align-items:center;gap:var(--s3);text-align:center;color:var(--muted);max-width:360px;padding:var(--s5)}
.placeholder .ph-icon{width:56px;height:56px;border-radius:16px;background:var(--panel);box-shadow:var(--shadow-float);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.placeholder .ph-icon .ic{width:24px;height:24px}
.placeholder strong{font-size:var(--fs-empty);font-weight:var(--w-strong);color:var(--ink);line-height:1.25}
.placeholder .ph-actions{display:flex;gap:var(--s2);flex-wrap:wrap;justify-content:center}

/* review views */
.rv-stage{display:flex;gap:var(--s2);align-items:flex-start;justify-content:center;margin:auto;flex:none;min-width:0}
.rv-stage.stack{flex-direction:column;align-items:center}
.rv-frame{display:flex;flex-direction:column;flex:none;min-width:0}
.rv-cap{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:0 2px 6px;min-height:18px;font-size:var(--fs-cap);line-height:var(--lh-tight);font-weight:var(--w-strong);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;flex:none}
.rv-cap .rv-side{display:flex;align-items:center;gap:var(--s2);min-width:0}
.rv-cap .rv-view{color:var(--ink);overflow:hidden;text-overflow:ellipsis}
.rv-opacity{display:flex;align-items:center;gap:6px;font-weight:var(--w-regular);text-transform:none;letter-spacing:0;font-size:var(--fs-sec);color:var(--muted);min-width:0}
.rv-opacity input[type=range]{width:96px;height:16px;margin:0;accent-color:var(--blue);cursor:pointer;flex:none}
.rv-opacity .rv-opval{font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.rv-pic{position:relative;background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line2),var(--shadow-float);flex:none}
.rv-pic img.rv-img,.rv-pic>img{display:block;width:100%;height:100%;object-fit:fill}
.rv-before,.rv-after{position:absolute;inset:0;z-index:1;overflow:hidden}
.rv-before img,.rv-after img{display:block;width:100%;height:100%;object-fit:fill}
.rv-after{pointer-events:none}
.rv-nodiff,.img-missing{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 8px,#f2f2f0 8px,#f2f2f0 16px);color:#80838A;font-size:var(--fs-sec);text-align:center;padding:var(--s3)}
.img-missing{font-size:var(--fs-cap);padding:2px}
.rv-line{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:#2F80FF;z-index:9;pointer-events:none}
.rv-handle{position:absolute;top:50%;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px #2F80FF,0 2px 10px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;gap:2px;z-index:10;cursor:ew-resize;touch-action:none}
.rv-handle i{display:block;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent}
.rv-handle i.l{border-right:5px solid #2F80FF}.rv-handle i.r{border-left:5px solid #2F80FF}
.marks{position:absolute;inset:0;z-index:3;pointer-events:none}
.rv-grid{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:linear-gradient(to right,rgba(47,128,255,.13) 1px,transparent 1px),linear-gradient(to bottom,rgba(47,128,255,.13) 1px,transparent 1px)}
.mark-box{position:absolute;border:2px solid #D99A2B;border-radius:3px;pointer-events:auto;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.75)}
.mark-box.expected,.mark-box.approved{border-color:#188951}
.mark-box:hover{box-shadow:0 0 0 1px rgba(255,255,255,.75),0 0 0 4px rgba(47,128,255,.22)}
.mark-box.selected{border-color:#2F80FF;box-shadow:0 0 0 3px rgba(47,128,255,.28)}

/* ---------- move / add stage ---------- */
.frame-system{display:grid;grid-template-columns:var(--ruler) auto;grid-template-rows:var(--ruler) auto;flex:none;margin:auto;border-radius:6px;overflow:hidden;box-shadow:0 0 0 1px var(--line2),var(--shadow-float)}
body.no-rulers .frame-system{grid-template-columns:0 auto;grid-template-rows:0 auto}
body.no-rulers .ruler-top,body.no-rulers .ruler-left,body.no-rulers .ruler-corner{visibility:hidden}
.ruler-corner{grid-area:1/1;background:var(--ruler-bg);border-right:1px solid var(--ruler-line);border-bottom:1px solid var(--ruler-line)}
.ruler-top{grid-area:1/2;height:var(--ruler);overflow:hidden;border-bottom:1px solid var(--ruler-line);background:var(--ruler-bg);color:var(--ruler-ink)}
.ruler-left{grid-area:2/1;width:var(--ruler);overflow:hidden;border-right:1px solid var(--ruler-line);background:var(--ruler-bg);color:var(--ruler-ink)}
.ruler-top svg,.ruler-left svg{display:block}
.move-frame{grid-area:2/2;position:relative;overflow:hidden;background:#fff;touch-action:none;user-select:none}
.move-frame img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none}
.move-frame.cursor-cross{cursor:crosshair}.move-frame.cursor-grab{cursor:grab}.move-frame.cursor-grabbing{cursor:grabbing}
.move-overlay{position:absolute;inset:0;pointer-events:none;z-index:3}
.move-grid{position:absolute;inset:0;z-index:1}
.move-sel{position:absolute;z-index:2;border:2px dashed #2F80FF;background:rgba(47,128,255,.07)}
.move-ghost{position:absolute;z-index:3;border:2px solid #2F80FF;background:rgba(47,128,255,.14);display:flex;align-items:center;justify-content:center;padding:2px;overflow:hidden}
.move-ghost span{font-size:var(--fs-cap);font-weight:var(--w-strong);color:#1c5cb8;background:#ffffffe6;border-radius:4px;padding:1px 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.move-guide{position:absolute;z-index:5;pointer-events:auto}
.move-guide.v{width:2px;margin-left:-1px;background-image:repeating-linear-gradient(to bottom,var(--guide) 0 5px,transparent 5px 9px)}
.move-guide.h{height:2px;margin-top:-1px;background-image:repeating-linear-gradient(to right,var(--guide) 0 5px,transparent 5px 9px)}
.move-guide.dim{opacity:.45}
.move-measure{position:absolute;z-index:6;pointer-events:auto;background:var(--guide);border-radius:2px}
.move-measure.h{height:2px}.move-measure.v{width:2px}
.move-tag,.add-tag{position:absolute;z-index:8;pointer-events:auto;font-size:var(--fs-cap);font-weight:var(--w-strong);line-height:1.5;color:#fff;background:var(--guide);border-radius:4px;padding:1px 6px;white-space:nowrap;transform:translate(-50%,-50%);max-width:70%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.move-tag.blue{background:#2F80FF}
.add-tag{background:var(--add);color:#fff}
:root[data-theme="dark"] .add-tag{color:#1B1230}
.move-tag.gray{background:#4A4E57}
.add-sel{position:absolute;z-index:3;border:2px dashed var(--add);background:var(--add-fill);pointer-events:none}
.add-ghost{position:absolute;z-index:2;border:1px dashed var(--add);opacity:.6;background:var(--add-fill);pointer-events:none}
body.mode-add .tool.on{background:var(--add-bg);color:var(--add)}
.chip.add{background:var(--add-bg);color:var(--add)}
.add-desc{min-height:72px;padding:var(--s2);line-height:var(--lh-body);resize:vertical}
.add-desc[aria-invalid="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.chip-help{display:flex;flex-direction:column;gap:6px;margin-top:var(--s2)}
.chip-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.chip-topic{min-width:58px;margin-right:2px;font-size:var(--fs-cap);font-weight:var(--w-strong);letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.help-chip{min-height:var(--hit-dense);padding:0 10px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font-size:var(--fs-sec);font-weight:var(--w-medium);white-space:nowrap;transition:background var(--t) var(--ease)}
.help-chip:hover{background:var(--active)}
.help-chip:active{background:var(--blue-bg);color:var(--blue-ink)}
.ref-drop{display:flex;align-items:center;justify-content:center;width:100%;height:72px;padding:0 var(--s3);border:1px dashed var(--line2);border-radius:var(--r-btn);background:var(--soft);color:var(--muted);font-size:var(--fs-sec);text-align:center;transition:border-color var(--dur-fast) var(--ease-out),background-color var(--dur-fast) var(--ease-out)}
.ref-drop:hover{border-color:var(--blue)}
.ref-drop.drag{border-color:#2F80FF;background:var(--blue-bg);color:var(--blue-ink)}
.ref-drop .ref-drop-active,.ref-drop.drag .ref-drop-idle{display:none}
.ref-drop.drag .ref-drop-active{display:inline}
.ref-add{margin-top:var(--s2);min-height:var(--hit-dense);font-size:var(--fs-sec)}
.ref-card{display:flex;align-items:center;gap:var(--s2);padding:6px;border-radius:var(--r-btn);background:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.ref-thumb{width:64px;height:64px;object-fit:cover;border-radius:6px;flex:none;background:#fff}
.ref-meta{display:flex;flex-direction:column;min-width:0;flex:1}
.ref-name{font-family:var(--font-mono);font-size:var(--fs-mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref-size{font-size:var(--fs-sec);color:var(--muted)}
.ref-tools{display:flex;gap:2px}
.chip.ref-badge{background:var(--blue-bg);color:var(--blue-ink);font-family:var(--font-mono);font-weight:var(--w-medium);margin-right:6px;vertical-align:1px}
.kind-row{display:flex;flex-wrap:wrap;gap:6px}
.kind-chip,.q-chip{height:28px;padding:0 12px;border-radius:var(--r-pill);background:var(--surface);color:var(--ink);font-size:calc(12px * var(--fs-scale));font-weight:var(--w-medium);white-space:nowrap;transition:background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out)}
.kind-chip:hover,.q-chip:hover{background:var(--active)}
.kind-chip.on,.q-chip.on{background:#2F80FF;color:#fff}
.questions{display:flex;flex-direction:column;gap:6px;margin-top:var(--s3)}
.questions.fade-in{animation:oe-fade-in var(--dur-fast) var(--ease-out)}
.q-row{display:flex;align-items:flex-start;gap:var(--s2)}
.q-label{width:72px;flex:none;padding-top:6px;font-size:calc(12px * var(--fs-scale));color:var(--muted);line-height:1.25}
.q-opts{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.field-error{margin:4px 0 0;color:var(--red);font-size:var(--fs-sec);font-weight:var(--w-medium)}

/* ---------- inspector ---------- */
.inspector{min-width:0;min-height:0;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
body.insp-closed .inspector{border-left:0}
.inspector-header{flex:none;display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s2) var(--s3) var(--s4);min-width:0}
.inspector-header h2{margin:0;flex:1;min-width:0;font-size:var(--fs-panel);font-weight:var(--w-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-card{flex:none;display:flex;align-items:center;gap:var(--s2);margin:0 var(--s4) var(--s2);padding:10px var(--s3);border-radius:10px;font-size:var(--fs-body);font-weight:var(--w-strong);background:var(--surface);line-height:var(--lh-tight)}
.summary-card.pass{color:var(--green);background:var(--green-bg)}
.summary-card.check{color:var(--amber);background:var(--amber-bg)}
.summary-card.fail{color:var(--red);background:var(--red-bg)}
.summary-card .mark{width:16px;text-align:center;flex:none}
.report-note{margin:0 var(--s4) var(--s2);font-size:var(--fs-sec);color:var(--muted)}
.inspector-body{flex:1;min-height:0;overflow:auto;padding:var(--s1) var(--s4) var(--s4)}
.inspector-foot{flex:none;padding:var(--s3) var(--s4);font-size:var(--fs-sec);color:var(--muted);border-top:1px solid var(--line);line-height:var(--lh-tight)}
.block{margin:0 0 var(--s4);min-width:0}
.caption{font-size:var(--fs-cap);font-weight:var(--w-strong);letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:0 0 6px;line-height:var(--lh-tight)}
.detail{display:flex;flex-direction:column;border-radius:var(--r-btn);background:var(--soft);padding:2px 0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2);padding:6px var(--s3);font-size:var(--fs-body);line-height:var(--lh-tight);min-width:0}
.row span:first-child{color:var(--muted);flex:none}
.row strong{font-weight:var(--w-medium);text-align:right;overflow-wrap:anywhere;min-width:0;font-variant-numeric:tabular-nums}
.crop-pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.crop{margin:0;border-radius:var(--r-btn);overflow:hidden;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);min-width:0}
.crop-tag{display:block;font-size:var(--fs-cap);font-weight:var(--w-strong);letter-spacing:.04em;text-transform:uppercase;color:var(--faint);padding:5px 7px 2px}
.crop-img{height:72px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:4px}
.crop-img img{display:block;max-width:100%;max-height:100%}
.insp-actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-bottom:var(--s2)}
.field-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.field-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.field-box{background:var(--soft);border-radius:var(--r-input);box-shadow:inset 0 0 0 1px var(--line);padding:5px 2px;text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.field-box .tiny{font-size:var(--fs-cap);color:var(--faint);margin-bottom:1px;font-family:var(--font-ui)}
.precision-buttons{display:flex;padding:3px;gap:2px;border-radius:var(--r-btn);background:var(--surface)}
.precision-buttons button{flex:1;min-height:var(--hit-dense);border-radius:6px;color:var(--muted);font-weight:var(--w-medium)}
.precision-buttons button:hover:not(.active){color:var(--ink)}
.precision-buttons button.active{background:var(--pill-on);color:var(--blue-ink);font-weight:var(--w-strong);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field,.add-form select{width:100%;border:1px solid var(--line2);background:var(--input);border-radius:var(--r-input);padding:0 var(--s2);min-height:var(--hit);font-size:var(--fs-body);min-width:0;color:var(--ink)}
.field:focus,.add-form select:focus{outline:2px solid var(--focus);outline-offset:0;border-color:transparent}
.hint-note{font-size:var(--fs-sec);color:var(--muted);line-height:var(--lh-body);margin:6px 0 0}
.crop-holder{position:relative;width:100%;height:96px;border-radius:var(--r-btn);background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center}
.crop-holder canvas{display:block}
.crop-missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:var(--fs-sec);text-align:center;padding:var(--s2)}
.crop-meta{margin-top:5px;font-size:var(--fs-sec);color:var(--faint);font-variant-numeric:tabular-nums}
.request-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.request-head .caption{margin:0}
.request-text{background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-btn);padding:var(--s2) var(--s3);line-height:var(--lh-body);white-space:pre-wrap;overflow-wrap:anywhere}
.request-json{margin-top:6px;background:var(--soft);box-shadow:inset 0 0 0 1px var(--line);border-radius:var(--r-btn);padding:var(--s2) var(--s3);font-size:var(--fs-cap);line-height:var(--lh-body);white-space:pre-wrap;overflow-wrap:anywhere;color:var(--muted)}
.copy-mini{display:inline-flex;align-items:center;gap:4px;min-height:var(--hit-dense);padding:0 var(--s2);border-radius:6px;color:var(--muted);font-size:var(--fs-sec);font-weight:var(--w-medium)}
.copy-mini:hover{background:var(--hover);color:var(--ink)}
.copy-mini svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.motion-badge{display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 8px;border-radius:6px;background:var(--surface);color:var(--muted);font-size:var(--fs-sec)}
.motion-badge b{font-weight:var(--w-strong);color:var(--ink)}
.add-form{display:flex;flex-direction:column;gap:var(--s2)}
.add-form .labelled{display:flex;flex-direction:column;gap:4px}
.add-form label{font-size:var(--fs-sec);color:var(--muted)}
.add-form select:disabled,.add-form input:disabled{opacity:.55;cursor:not-allowed}

/* ---------- status bar ---------- */
.statusbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:0 var(--s4);background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-sec);white-space:nowrap;min-width:0}
.statusbar>div{display:flex;align-items:center;gap:var(--s2);min-width:0;overflow:hidden}
.statusbar span{overflow:hidden;text-overflow:ellipsis}
.sep{width:1px;height:12px;background:var(--line2);flex:none}

/* ---------- popover, toast, menus, modals ---------- */
.pop{position:fixed;z-index:40;width:260px;padding:var(--s3);border-radius:var(--r-panel);background:var(--panel);box-shadow:var(--shadow-pop);font-size:var(--fs-body)}
.pop strong{display:block;font-weight:var(--w-strong);margin-bottom:2px}
.pop p{margin:0 0 var(--s2);color:var(--muted);font-size:var(--fs-sec)}
.pop .crop-pair{margin:0 0 var(--s2)}
.pop .crop-img{height:52px}
.pop-actions{display:flex;gap:6px}
.pop-actions .btn{flex:1;min-height:var(--hit-dense);padding:0 var(--s2);font-size:var(--fs-sec)}
.toast{position:fixed;left:50%;bottom:calc(var(--status-h) + 96px);transform:translate(-50%,8px);z-index:95;background:var(--toast-bg);color:var(--toast-ink);border-radius:10px;padding:9px var(--s4);box-shadow:var(--shadow-pop);font-weight:var(--w-medium);font-size:var(--fs-body);opacity:0;pointer-events:none;transition:opacity var(--dur) var(--ease-out),transform var(--dur) var(--ease-out);max-width:calc(100vw - 24px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.has-action.show{pointer-events:auto;display:flex;align-items:center;gap:var(--s3)}
.toast-action{color:#8DB8FF;font-weight:var(--w-strong);min-height:var(--hit-dense);padding:0 var(--s2);border-radius:6px}
:root[data-theme="dark"] .toast-action{color:#1D63D3}
.toast-action:hover{background:rgba(127,127,127,.18)}
.prompt-hint{margin:0;padding:var(--s2) var(--s4);font-size:var(--fs-sec);color:var(--muted);border-top:1px solid var(--line)}
.menu{position:fixed;z-index:60;min-width:220px;padding:var(--s1);border-radius:var(--r-panel);background:var(--panel);box-shadow:var(--shadow-pop)}
.menu button{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:var(--hit);padding:0 var(--s2);border-radius:6px;text-align:left}
.menu button:hover,.menu button:focus-visible{background:var(--hover)}
.menu kbd{margin-left:auto;font-family:var(--font-mono);font-size:var(--fs-cap);color:var(--faint)}
.scrim{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:12vh var(--s4) var(--s4);animation:fade var(--t) var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(640px,100%);max-height:76vh;display:flex;flex-direction:column;border-radius:var(--r-panel);background:var(--panel);box-shadow:var(--shadow-pop);overflow:hidden}
.modal-head{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s3) var(--s3) var(--s4);border-bottom:1px solid var(--line)}
.modal-head h2{margin:0;flex:1;font-size:var(--fs-section);font-weight:var(--w-strong)}
.modal-body{display:grid;grid-template-columns:160px minmax(0,1fr);min-height:0;flex:1}
.modal-foot{display:flex;align-items:center;gap:6px;padding:var(--s2) var(--s4);border-top:1px solid var(--line);color:var(--muted);font-size:var(--fs-sec)}
.modal-foot .ic{width:14px;height:14px;color:var(--green)}
.modal-nav{padding:var(--s2);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.modal-nav button{text-align:left;min-height:var(--hit);padding:0 var(--s3);border-radius:var(--r-btn);color:var(--muted);font-weight:var(--w-medium)}
.modal-nav button:hover{background:var(--hover);color:var(--ink)}
.modal-nav button.on{background:var(--active);color:var(--ink);font-weight:var(--w-strong)}
.modal-pane{padding:var(--s4);overflow:auto}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s2) 0;min-height:44px}
.set-row+.set-row{border-top:1px solid var(--line)}
.set-row .set-label{display:flex;flex-direction:column;min-width:0}
.set-row .set-label b{font-weight:var(--w-medium)}
.set-row .set-label span{font-size:var(--fs-sec);color:var(--muted)}
.switch{width:36px;height:20px;border-radius:var(--r-pill);background:var(--line2);position:relative;flex:none;transition:background var(--t) var(--ease)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--t) var(--ease)}
.switch[aria-checked="true"]{background:var(--blue)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.kbd-list{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px var(--s4);font-size:var(--fs-body)}
.kbd-list kbd{font-family:var(--font-mono);font-size:var(--fs-sec);background:var(--surface);border-radius:5px;padding:1px 7px;justify-self:end;white-space:nowrap}
.kbd-list .kbd-group{grid-column:1/-1;margin-top:var(--s3)}
.kbd-list .kbd-group:first-child{margin-top:0}
.about p{margin:0 0 var(--s3);color:var(--muted)}
.about p:first-child{color:var(--ink)}
/* command palette */
.palette{width:min(560px,100%);border-radius:var(--r-panel);background:var(--panel);box-shadow:var(--shadow-pop);overflow:hidden}
.palette-input{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s4);border-bottom:1px solid var(--line);color:var(--muted)}
.palette-input input{flex:1;border:0;outline:0;background:transparent;height:48px;font-size:var(--fs-panel);color:var(--ink)}
.palette-list{max-height:min(360px,56vh);overflow:auto;padding:var(--s1)}
.palette-item{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:36px;padding:0 var(--s3);border-radius:var(--r-btn);text-align:left}
.palette-item.on{background:var(--blue-bg);color:var(--blue-ink)}
.palette-item .grp{margin-left:auto;font-size:var(--fs-sec);color:var(--faint)}
.palette-empty{padding:var(--s4);color:var(--muted);text-align:center}
/* tour */
.tour{position:fixed;z-index:80;width:280px;padding:var(--s4);border-radius:var(--r-panel);background:var(--panel);box-shadow:var(--shadow-pop)}
.tour h3{margin:0 0 4px;font-size:var(--fs-panel);font-weight:var(--w-strong)}
.tour p{margin:0 0 var(--s3);color:var(--muted)}
.tour-foot{display:flex;align-items:center;gap:var(--s2)}
.tour-foot .step{font-size:var(--fs-sec);color:var(--faint);margin-right:auto}
.tour-ring{position:fixed;z-index:79;border-radius:var(--r-btn);box-shadow:0 0 0 2px var(--blue),0 0 0 9999px rgba(20,20,25,.28);pointer-events:none;transition:all var(--t) var(--ease)}
/* mobile sheet */
.sheet-bar{display:none}

/* ---------- responsive ---------- */
.lbl-wide{display:inline}
@media (max-width:1279px){
  .main{grid-template-columns:var(--sidebar-cur,var(--sidebar-w)) minmax(0,1fr)}
  .inspector{position:absolute;top:0;right:0;bottom:0;width:var(--inspector-w);z-index:30;box-shadow:var(--shadow-pop);border-left:0;transform:translateX(0);transition:transform var(--dur-panel) var(--ease-out)}
  body.insp-closed .inspector{transform:translateX(calc(100% + 24px));box-shadow:none}
  .capture-chip .cap-name{display:none}
}
@media (max-width:1100px){
  .tool .lbl{display:none}
  .tool{padding:0 10px}
  .page-tabs{display:none}
}
@media (max-width:900px){
  .hd-right .hide-md{display:none}
}
@media (max-width:767px){
  :root{--stage-pad-top:60px;--stage-pad-x:12px;--sheet-h:0px}
  .app{grid-template-rows:var(--header-h) minmax(0,1fr) 0}
  .statusbar{display:none}
  .header{grid-template-columns:auto minmax(0,1fr) auto;padding:0 var(--s2);gap:var(--s2)}
  .header .hd-center{justify-self:center}
  .brand-name,.hd-right .hide-sm{display:none}
  .seg button{padding:0 var(--s3)}
  .btn.primary .lbl{display:none}
  .btn.primary{padding:0 10px}
  .main{grid-template-columns:minmax(0,1fr)}
  .canvas{grid-column:1}
  .stage-scroller{padding-bottom:calc(var(--sheet-bar-h) + var(--sheet-h) + 72px)}
  body.mode-review .stage-scroller{padding-bottom:calc(var(--sheet-bar-h) + var(--sheet-h) + 60px)}
  body.no-report .stage-scroller,body.no-report.mode-review .stage-scroller{padding-bottom:calc(var(--sheet-bar-h) + var(--sheet-h) + var(--stage-pad-top))}
  .dock{bottom:calc(var(--sheet-bar-h) + var(--sheet-h) + 10px)}
  .zoom-pill{bottom:calc(var(--sheet-bar-h) + var(--sheet-h) + 10px)}
  body:not(.mode-review) .zoom-pill{bottom:calc(var(--sheet-bar-h) + var(--sheet-h) + 62px)}
  .float-top{max-width:calc(100% - 16px);overflow-x:auto;scrollbar-width:none}
  .float-top::-webkit-scrollbar{display:none}
  .float .seg button,.opt{padding:0 10px}
  .toast{bottom:calc(var(--sheet-bar-h) + var(--sheet-h) + 70px)}
  .sheet-bar{display:flex;position:fixed;left:0;right:0;bottom:var(--sheet-h);height:var(--sheet-bar-h);z-index:35;background:var(--panel);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);align-items:center;padding:0 var(--s2);gap:2px;touch-action:none}
  .sheet-handle{position:absolute;top:5px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line2)}
  .sheet-bar button.sheet-tab{flex:1;min-height:34px;margin-top:6px;border-radius:var(--r-btn);color:var(--muted);font-weight:var(--w-medium);font-size:var(--fs-body);white-space:nowrap}
  .sheet-bar button.sheet-tab.on{background:var(--active);color:var(--ink);font-weight:var(--w-strong)}
  .sidebar,.inspector{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:var(--sheet-h);z-index:34;border:0;box-shadow:none;transform:none!important;transition:none}
  body.insp-closed .inspector{transform:none}
  body[data-sheet="inspector"] .sidebar,body:not([data-sheet="inspector"]) .inspector{display:none}
  .sidebar .sb-tabs,.sidebar .sb-foot,.inspector .inspector-header .icon-btn{display:none}
  body.sb-collapsed .sb-body{display:block}
  .sidebar .sb-body{padding-top:var(--s2)}
  .inspector-foot{display:none}
}
</style>

    var natural = { w: record.img.naturalWidth || 0, h: record.img.naturalHeight || 0 };
    if (!natural.w || !natural.h) { holder.appendChild(el('span', 'crop-missing', 'image not found')); return; }
    var size = imageSize();
    var boxW = Math.max(20, holder.clientWidth || 220);
    var boxH = Math.max(20, holder.clientHeight || 79);
    var ratio = Math.min(boxW / sel.w, boxH / sel.h);
    var cw = Math.max(1, Math.round(sel.w * ratio));
    var ch = Math.max(1, Math.round(sel.h * ratio));
    var canvas = el('canvas');
    canvas.width = cw;
    canvas.height = ch;
    canvas.setAttribute('aria-label', 'Before crop');
    var ctx = canvas.getContext('2d');
    if (!ctx) { holder.appendChild(el('span', 'crop-missing', 'image not found')); return; }
    var sx = sel.x / size.w * natural.w;
    var sy = sel.y / size.h * natural.h;
    var sw = sel.w / size.w * natural.w;
    var sh = sel.h / size.h * natural.h;
    try {
      ctx.imageSmoothingEnabled = true;
      ctx.drawImage(record.img, sx, sy, sw, sh, 0, 0, cw, ch);
      holder.appendChild(canvas);
    } catch (err) {
      holder.innerHTML = '';
      holder.appendChild(el('span', 'crop-missing', 'image not found'));
    }
  }

  /* ---------- move mode: rulers ---------- */
  /* Ruler numbers are always capture pixels; only tick density follows the zoom.
     Tick positions are untouched by label logic: label steps and skipping are
     computed separately so a number is never drawn twice or over its neighbour. */
  var RULER_LABEL_STEPS = [50, 100, 200, 500];
  var RULER_LABEL_GAP = 48;   /* minimum display px between label anchors */
  var RULER_LABEL_GUTTER = 6; /* minimum display px between painted labels */

  function rulerFontPx() {
    var scale = TEXT_SCALE[state.textSize] || 1;
    return 12 * scale;
  }
  /* Exact text width for one label, measured in the page's own ruler font.
     Falls back to a per-character estimate when measurement is unavailable. */
  var RULER_MEASURE = null;
  function rulerTextWidth(text) {
    var str = String(text);
    if (RULER_MEASURE === null) {
      RULER_MEASURE = document.createElement('canvas').getContext('2d');
    }
    if (RULER_MEASURE) {
      try {
        RULER_MEASURE.font = rulerFontPx() + 'px ' +
          '"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",ui-monospace,monospace';
        var measured = RULER_MEASURE.measureText(str).width;
        if (measured > 0) return measured;
      } catch (err) { /* fall through to the estimate */ }
    }
    return str.length * rulerFontPx() * 0.62;
  }

  function rulerLabels(capturePx, scale, length, horizontal) {
    var step = RULER_LABEL_STEPS[RULER_LABEL_STEPS.length - 1];
    for (var i = 0; i < RULER_LABEL_STEPS.length; i++) {
      if (RULER_LABEL_STEPS[i] * scale >= RULER_LABEL_GAP) { step = RULER_LABEL_STEPS[i]; break; }
    }
    /* The vertical ruler writes rotated text starting 10 px past the tick. */
    var lead = horizontal ? 2 : 10;
    var out = [];
    var lastEnd = -Infinity;
    for (var value = 0; value <= capturePx; value += step) {
      var pos = Math.round(value * scale * 10) / 10;
      var width = rulerTextWidth(value);
      var start = pos + lead;
      var end = start + width;
      /* Never run past the far end, never touch the previous label. */
      if (end > length) continue;
      if (start < lastEnd + RULER_LABEL_GUTTER) continue;
      out.push({ value: value, pos: pos, anchor: 'start' });
      lastEnd = end;
    }
    if (capturePx % step !== 0) {
      var edge = Math.round(capturePx * scale * 10) / 10;
      var edgeWidth = rulerTextWidth(capturePx);
      var edgeEnd = edge - 2;
      var edgeStart = edgeEnd - edgeWidth;
      /* The end value is the image size: keep it visible by dropping the last
         step label when the two would touch. "0" is never dropped. */
      while (out.length && out[out.length - 1].value !== 0) {
        var prev = out[out.length - 1];
        var prevEnd = prev.pos + lead + rulerTextWidth(prev.value);
        if (edgeStart >= prevEnd + RULER_LABEL_GUTTER) break;
        out.pop();
      }
      if (edgeEnd <= length + 0.5 && edgeStart >= 0) {
        out.push({ value: capturePx, pos: edge, anchor: 'end' });
      }
    }
    return out;
  }

  function rulerSvg(horizontal, capturePx, scale) {
    var major = 100;
    var choices = [100, 200, 500, 1000];
    for (var i = 0; i < choices.length; i++) {
      if (choices[i] * scale >= 40) { major = choices[i]; break; }
      major = choices[choices.length - 1];
    }
    var minor = major / 5;
    var length = Math.max(1, Math.round(capturePx * scale));
    var parts = [];
    var count = Math.floor(capturePx / minor);
    for (var k = 0; k <= count; k++) {
      var value = k * minor;
      if (value > capturePx) break;
      var pos = Math.round(value * scale * 10) / 10;
      var isMajor = k % 5 === 0;
      var tick = isMajor ? 11 : 4;
      if (horizontal) {
        parts.push('<line x1="' + pos + '" x2="' + pos + '" y1="' + (23 - tick) + '" y2="23"/>');
      } else {
        parts.push('<line y1="' + pos + '" y2="' + pos + '" x1="' + (23 - tick) + '" x2="23"/>');
      }
    }
    /* Close the ruler at the capture edge with a tick only; the end number is
       placed by the label pass, which knows whether it would collide. */
    if (capturePx % major !== 0) {
      var edge = Math.round(capturePx * scale * 10) / 10;
      if (horizontal) parts.push('<line x1="' + edge + '" x2="' + edge + '" y1="12" y2="23"/>');
      else parts.push('<line y1="' + edge + '" y2="' + edge + '" x1="12" x2="23"/>');
    }
    rulerLabels(capturePx, scale, length, horizontal).forEach(function (item) {
      if (horizontal) {
        var x = item.anchor === 'end' ? item.pos - 2 : item.pos + 2;
        parts.push('<text x="' + x + '" y="9"' +
          (item.anchor === 'end' ? ' text-anchor="end"' : '') + '>' + item.value + '</text>');
      } else {
        var y = item.anchor === 'end' ? item.pos - 2 : item.pos + 10;
        parts.push('<text x="2" y="' + y + '" transform="rotate(90 3 ' + y + ')"' +
          (item.anchor === 'end' ? ' text-anchor="end"' : '') + '>' + item.value + '</text>');
      }
    });
    var w = horizontal ? length : 23;
    var h = horizontal ? 23 : length;
    return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h +
      '" aria-hidden="true" fill="#82858b" stroke="#999ca1" stroke-width="0.7" ' +
      'font-size="var(--fs-ruler)" font-family="var(--font-mono)" preserveAspectRatio="none">' + parts.join('') + '</svg>';
  }

  function rulerHost(horizontal) {
    var found = document.querySelector(horizontal ? '#rulerTop' : '#rulerLeft');
    if (!found) return;
    var size = imageSize();
    var px = horizontal ? size.w : size.h;
    var shown = horizontal ? state.frameW : state.frameH;
    if (!shown || !px) { found.innerHTML = ''; return; }
    /* Scale from the same integer frame size the ruler box uses, so the last
       label lands exactly on the image edge at Fit and 50/100/200%. */
    found.innerHTML = rulerSvg(horizontal, px, shown / px);
  }

  /* ---------- move mode: overlay ---------- */
  function placeBox(node, rect, size) {
    node.style.left = (rect.x / size.w * 100) + '%';
    node.style.top = (rect.y / size.h * 100) + '%';
    node.style.width = (rect.w / size.w * 100) + '%';
    node.style.height = (rect.h / size.h * 100) + '%';
  }

  /* Guides are inset by half a pixel so a 1px line sits exactly on the capture
     pixel edge at any scale, and so its painted area is always inside the frame. */
  function guideV(layer, x, opts) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-guide v' + (opts && opts.dim ? ' dim' : ''));
    node.style.left = (x / size.w * 100) + '%';
    node.style.top = '0px';
    node.style.height = '100%';
    node.setAttribute('data-guide', (opts && opts.kind) || 'v');
    node.title = Math.round(x) + ' px';
    layer.appendChild(node);
    return node;
  }
  function guideH(layer, y, opts) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-guide h' + (opts && opts.dim ? ' dim' : ''));
    node.style.top = (y / size.h * 100) + '%';
    node.style.left = '0px';
    node.style.width = '100%';
    node.setAttribute('data-guide', (opts && opts.kind) || 'h');
    node.title = Math.round(y) + ' px';
    layer.appendChild(node);
    return node;
  }
  function measureH(layer, x1, x2, y) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-measure h');
    node.style.left = (Math.min(x1, x2) / size.w * 100) + '%';
    node.style.width = (Math.abs(x2 - x1) / size.w * 100) + '%';
    node.style.top = (y / size.h * 100) + '%';
    node.setAttribute('data-measure', 'dx');
    layer.appendChild(node);
    return node;
  }
  function measureV(layer, y1, y2, x) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-measure v');
    node.style.top = (Math.min(y1, y2) / size.h * 100) + '%';
    node.style.height = (Math.abs(y2 - y1) / size.h * 100) + '%';
    node.style.left = (x / size.w * 100) + '%';
    node.setAttribute('data-measure', 'dy');
    layer.appendChild(node);
    return node;
  }
  /* shiftX/shiftY are CSS offsets from the anchor, so a label never sits on top
     of the line it annotates and its centre stays hit-testable. */
  function tag(layer, cx, cy, text, cls, shiftX, shiftY) {
    var size = state.overlaySize || imageSize();
    var node = el('div', 'move-tag' + (cls ? ' ' + cls : ''), text);
    node.setAttribute('data-tag', cls || 'guide');
    /* Keep the label inside the frame so it is never clipped away. */
    var halfPctX = 42 / Math.max(1, state.frameW || 1) * 100;
    var halfPctY = 9 / Math.max(1, state.frameH || 1) * 100;
    node.style.left = clamp(cx / size.w * 100, halfPctX, 100 - halfPctX) + '%';
    node.style.top = clamp(cy / size.h * 100, halfPctY, 100 - halfPctY) + '%';
    if (shiftX) node.style.marginLeft = shiftX + 'px';
    if (shiftY) node.style.marginTop = shiftY + 'px';
    layer.appendChild(node);
    return node;
  }

  /* Guides describe both rectangles: dashed magenta lines from the ORIGINAL
     edges and the NEW edges to the image edges, with a px distance for dx and
     dy measured anchor to anchor. Duplicate edges are drawn once so each line
     keeps a real size and a hit-testable centre. */
  function paintGuides(layer, sel, offset, size) {
    var dx = Math.round(offset.dx);
    var dy = Math.round(offset.dy);
    var ghost = { x: sel.x + dx, y: sel.y + dy, w: sel.w, h: sel.h };
    var usedV = {};
    var usedH = {};
    function addV(x, dim) {
      var key = String(Math.round(x));
      if (usedV[key]) return;
      usedV[key] = true;
      guideV(layer, x, { dim: dim, kind: dim ? 'from-x' : 'to-x' });
    }
    function addH(y, dim) {
      var key = String(Math.round(y));
      if (usedH[key]) return;
      usedH[key] = true;
      guideH(layer, y, { dim: dim, kind: dim ? 'from-y' : 'to-y' });
    }
    /* New edges first: where an old edge lands on a new one the brighter line
       should be the one that stays on top. */
    addV(ghost.x, false); addV(ghost.x + ghost.w, false);
    addH(ghost.y, false); addH(ghost.y + ghost.h, false);
    addV(sel.x, true); addV(sel.x + sel.w, true);
    addH(sel.y, true); addH(sel.y + sel.h, true);

    /* Distance from the original anchor to the new anchor, in capture pixels.
       Both measures sit outside the rectangles so they never cover a guide. */
    var topY = Math.max(4, Math.min(sel.y, ghost.y) - 14);
    var leftX = Math.max(4, Math.min(sel.x, ghost.x) - 14);
    if (dx !== 0) {
      measureH(layer, sel.x, ghost.x, topY);
      tag(layer, (sel.x + ghost.x) / 2, topY, Math.abs(dx) + ' px', null, 0, -11);
    }
    if (dy !== 0) {
      measureV(layer, sel.y, ghost.y, leftX);
      tag(layer, leftX, (sel.y + ghost.y) / 2, Math.abs(dy) + ' px', null, 34, 0);
    }
    if (dx === 0 && dy === 0) {
      tag(layer, ghost.x + ghost.w / 2, Math.max(4, ghost.y - 14), '0 px', null, 0, -11);
    }
  }

  function paintOverlay() {
    var layer = document.getElementById('moveOverlay');
    if (!layer) return;
    var size = state.overlaySize || imageSize();
    layer.innerHTML = '';
    if (state.drawRect) {
      var drawing = ants(el('div', 'move-sel'));
      placeBox(drawing, state.drawRect, size);
      layer.appendChild(drawing);
      return;
    }
    var sel = state.selection;
    if (!sel) return;
    var rect = ants(el('div', 'move-sel'));
    placeBox(rect, sel, size);
    layer.appendChild(rect);

    var ghost = { x: sel.x + state.offset.dx, y: sel.y + state.offset.dy, w: sel.w, h: sel.h };
    var ghostNode = el('div', 'move-ghost');
    placeBox(ghostNode, ghost, size);
    ghostNode.appendChild(el('span', null, labelOf({ label: state.label })));
    layer.appendChild(ghostNode);

    /* Guides stay painted after mouseup: they belong to the selection, and are
       removed only when the selection, mode, or Esc changes. */
    paintGuides(layer, sel, state.offset, size);

    tag(layer, ghost.x + ghost.w / 2, ghost.y - 12,
      'x ' + Math.round(ghost.x) + ' y ' + Math.round(ghost.y), 'gray');
  }

  /* ---------- add mode: overlay ---------- */
  function paintAddOverlay() {
    var layer = document.getElementById('moveOverlay');
    if (!layer) return;
    var size = state.overlaySize || imageSize();
    layer.innerHTML = '';
    if (state.drawRect) {
      var drawing = ants(el('div', 'add-sel'));
      placeBox(drawing, state.drawRect, size);
      layer.appendChild(drawing);
      return;
    }
    var sel = state.addSelection;
    if (!sel) return;
    var selectedDraft = findAddDraft(state.addSelected);
    if (selectedDraft) {
      var original = el('div', 'add-ghost');
      placeBox(original, selectedDraft, size);
      layer.appendChild(original);
    }
    var rect = ants(el('div', 'add-sel'));
    placeBox(rect, sel, size);
    layer.appendChild(rect);
    /* Corner ticks make a thin/tall selection readable without hiding the image. */
    var label = addName({ label: state.addLabel });
    var node = el('div', 'add-tag', label + ' \u00b7 ' + Math.round(sel.w) + '\u00d7' + Math.round(sel.h));
    var halfPctX = 44 / Math.max(1, state.frameW || 1) * 100;
    var halfPctY = 9 / Math.max(1, state.frameH || 1) * 100;
    node.style.left = clamp((sel.x + sel.w / 2) / size.w * 100, halfPctX, 100 - halfPctX) + '%';
    node.style.top = clamp((sel.y - 12) / size.h * 100, halfPctY, 100 - halfPctY) + '%';
    node.setAttribute('data-add-tag', 'add');
    layer.appendChild(node);
  }

  /* ---------- move mode: pointer ---------- */
  function capturePoint(frame, clientX, clientY) {
    var rect = frame.getBoundingClientRect();
    var size = imageSize();
    if (!rect.width || !rect.height) return { x: 0, y: 0 };
    return {
      x: clamp((clientX - rect.left) / rect.width * size.w, 0, size.w),
      y: clamp((clientY - rect.top) / rect.height * size.h, 0, size.h)
    };
  }

  function insideRect(point, rect, pad) {
    var p = pad || 0;
    return point.x >= rect.x - p && point.x <= rect.x + rect.w + p &&
      point.y >= rect.y - p && point.y <= rect.y + rect.h + p;
  }

  function activeTool() { return state.mode === 'add' ? state.addTool : state.tool; }

  /* Topmost existing add area under the cursor, for the Select tool. */
  function addDraftAt(point) {
    for (var i = state.addDrafts.length - 1; i >= 0; i--) {
      var draft = state.addDrafts[i];
      if (insideRect(point, draft, 0)) return draft;
    }
    return null;
  }

  function setTool(tool) {
    if (state.mode === 'add') {
      state.addTool = tool === 'select' ? 'select' : tool === 'hand' ? 'hand' : 'place';
    } else {
      state.tool = tool;
    }
    state.drag = null;
    state.drawRect = null;
    renderChrome();
    if (state.mode === 'add') paintAddOverlay(); else paintOverlay();
    updateFrameCursor();
  }

  function updateFrameCursor() {
    var frame = document.getElementById('moveFrame');
    if (!frame) return;
    var cls = CURSOR_CLASS[activeTool()] || 'cursor-grab';
    frame.className = 'move-frame ' + cls;
  }

  function beginMoveDrag(event) {
    var frame = event.currentTarget;
    if (!state.report || event.button !== 0) return;
    var point = capturePoint(frame, event.clientX, event.clientY);
    var scroller = $('#stageScroller');
    if (activeTool() === 'hand') {
      state.drag = { kind: 'pan', x: event.clientX, y: event.clientY,
                     left: scroller ? scroller.scrollLeft : 0, top: scroller ? scroller.scrollTop : 0 };
      frame.className = 'move-frame cursor-grabbing';
      if (frame.setPointerCapture) { try { frame.setPointerCapture(event.pointerId); } catch (err) {} }
      event.preventDefault();
      return;
    }
    var sel = state.selection;
    var ghost = sel ? { x: sel.x + state.offset.dx, y: sel.y + state.offset.dy, w: sel.w, h: sel.h } : null;
    if (state.mode === 'add' && state.addTool !== 'hand') {
      if (state.addTool === 'select') {
        /* Select only picks an existing area; Place draws a new one. */
        var hit = addDraftAt(point);
        if (hit) { selectAddDraft(hit.id); return; }
        if (state.addSelection && insideRect(point, state.addSelection, 0)) {
          state.addSelected = null;
          renderInspector();
          return;
        }
        toast('Click an add area, or use Place (P)');
        return;
      }
      state.drag = { kind: 'add-select', start: point, before: snapshotState() };
      state.drawRect = { x: point.x, y: point.y, w: 0, h: 0 };
      paintAddOverlay();
      if (frame.setPointerCapture) { try { frame.setPointerCapture(event.pointerId); } catch (err) {} }
      event.preventDefault();
      return;
    }
    if (state.tool === 'move' && sel && (insideRect(point, sel, 0) || (ghost && insideRect(point, ghost, 0)))) {
      state.drag = { kind: 'move', start: point, base: { dx: state.offset.dx, dy: state.offset.dy },

      frame.className = 'move-frame cursor-grabbing';
      if (frame.setPointerCapture) { try { frame.setPointerCapture(event.pointerId); } catch (err) {} }
      event.preventDefault();
      return;
    }
    state.drag = { kind: 'select', start: point, before: snapshotState() };
    state.drawRect = { x: point.x, y: point.y, w: 0, h: 0 };
    paintOverlay();
    if (frame.setPointerCapture) { try { frame.setPointerCapture(event.pointerId); } catch (err) {} }
    event.preventDefault();
  }

  function moveMoveDrag(event) {
    var drag = state.drag;
    if (!drag) return;
    var frame = event.currentTarget;
    if (drag.kind === 'pan') {
      var scroller = $('#stageScroller');
      if (scroller) {

        scroller.scrollTop = drag.top - (event.clientY - drag.y);

    }

    var size = imageSize();
    if (drag.kind === 'select' || drag.kind === 'add-select') {
      var x = Math.min(drag.start.x, point.x);
      var y = Math.min(drag.start.y, point.y);
      state.drawRect = {
        x: Math.round(x), y: Math.round(y),
        w: Math.round(Math.abs(point.x - drag.start.x)),
        h: Math.round(Math.abs(point.y - drag.start.y))
      };
      if (drag.kind === 'add-select') paintAddOverlay(); else paintOverlay();
      return;
    }
    var dx = drag.base.dx + (point.x - drag.start.x);
    var dy = drag.base.dy + (point.y - drag.start.y);
    if (state.axisLock || event.shiftKey) {
      if (Math.abs(dx - drag.base.dx) >= Math.abs(dy - drag.base.dy)) dy = drag.base.dy;
      else dx = drag.base.dx;
    }
    var sel = state.selection;
    var snappedX = snapPx(dx);
    var snappedY = snapPx(dy);
    var minX = -sel.x;
    var maxX = size.w - (sel.x + sel.w);
    var minY = -sel.y;
    var maxY = size.h - (sel.y + sel.h);
    state.offset = {
      dx: clamp(snappedX, minX, Math.max(minX, maxX)),
      dy: clamp(snappedY, minY, Math.max(minY, maxY))
    };

    updateMoveInline();
  }

  function endMoveDrag(event) {
    var drag = state.drag;
    if (!drag) return;
    state.drag = null;
    var frame = event.currentTarget;
    if (frame && frame.className) updateFrameCursor();
    if (drag.kind === 'pan') return;
    if (drag.kind === 'add-select') {
      var addRect = state.drawRect;
      state.drawRect = null;
      if (addRect && addRect.w >= MIN_SELECT && addRect.h >= MIN_SELECT) {
        state.addSelection = addRect;
        if (state.addSelected && findAddDraft(state.addSelected)) { state.addRef = null; state.addKind = null; state.addAnswers = {}; }
        state.addSelected = null;
        syncSelectedAdd();
        commitHistory(drag.before);
        render();
      } else {
        paintAddOverlay();
        if (addRect) toast('Select at least 8 \u00d7 8 px');
      }
      return;
    }
    if (drag.kind === 'select') {
      var rect = state.drawRect;
      state.drawRect = null;
      if (rect && rect.w >= MIN_SELECT && rect.h >= MIN_SELECT) {
        if (state.selectedDraft) state.selectedDraft = null;
        state.selection = rect;
        state.offset = { dx: 0, dy: 0 };
        state.label = '';
        syncSelectedDraft();
        commitHistory(drag.before);
        render();
      } else {
        paintOverlay();
        if (rect) toast('Select at least 8 \u00d7 8 px');
      }
      return;
    }
    if (state.offset.dx !== drag.base.dx || state.offset.dy !== drag.base.dy) {
      syncSelectedDraft();
      commitHistory(drag.before);
      render();
    }
  }

  function updateMoveInline() {
    var dxNode = $('#offsetDx');
    var dyNode = $('#offsetDy');
    if (dxNode) dxNode.textContent = (state.offset.dx > 0 ? '+' : '') + state.offset.dx;
    if (dyNode) dyNode.textContent = (state.offset.dy > 0 ? '+' : '') + state.offset.dy;
    if (!state.selection) return;
    var source = liveSource();
    var text = $('#requestText');
    if (text) text.textContent = requestHeading(source) + '\n' + requestText(source);
    var json = $('#requestJson');
    if (json) json.textContent = requestJson(source);
  }

  function addSource() {
    var sel = state.addSelection || { x: 0, y: 0, w: 0, h: 0 };
